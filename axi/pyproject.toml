[project]
name = "axi"
version = "0.0.1"
description = "Axi — local-first voice assistant module of LifeOS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.1",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "pyside6>=6.6",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "kokoro-onnx>=0.5.0",
    "coqui-tts>=0.27.5",
    # In-process Piper TTS bindings. axi.piper_python_engine loads the
    # ONNX once at boot and reuses it per sentence, replacing RealtimeTTS'
    # subprocess-per-sentence PiperEngine.
    "piper-tts>=1.4.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "huggingface-hub>=0.24",
    # Resemblyzer is the V0 diarization fallback (used when pyannote V2
    # fails or isn't enabled). Must stay pinned so `uv pip install -e .`
    # never silently drops the fallback path again.
    "resemblyzer>=0.1.4",
    # Speaker diarization V2 (P2.1). pyannote.audio 4.x renamed
    # use_auth_token → token; diarize_v2.py handles both via signature
    # introspection.
    "pyannote.audio>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axi"]

[tool.uv]
package = true
