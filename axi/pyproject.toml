[project]
name = "axi"
version = "0.0.1"
description = "Axi — local-first voice assistant module of LifeOS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.1",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "pyside6>=6.6",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "kokoro-onnx>=0.5.0",
    "coqui-tts>=0.27.5",
    # In-process Piper TTS bindings. axi.piper_python_engine loads the
    # ONNX once at boot and reuses it per sentence, replacing RealtimeTTS'
    # subprocess-per-sentence PiperEngine.
    "piper-tts>=1.4.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "huggingface-hub>=0.24",
    # transformers is imported directly by axi.translate (pipeline, AutoTokenizer,
    # etc.). Previously arrived transitively via pyannote.audio but that is not
    # a declared path — declaring it here makes the dependency explicit and
    # prevents a silent breakage if pyannote drops its own transitive dep.
    "transformers>=4.40",
    # Resemblyzer is the V0 diarization fallback (used when pyannote V2
    # fails or isn't enabled). Must stay pinned so `uv pip install -e .`
    # never silently drops the fallback path again.
    "resemblyzer>=0.1.4",
    # Speaker diarization V2 (P2.1). pyannote.audio 4.x renamed
    # use_auth_token → token; diarize_v2.py handles both via signature
    # introspection.
    "pyannote.audio>=3.1",
    # At-rest encryption for the memory store (axi.store / axi.db_migrate).
    # Ships its own SQLCipher build, so no system sqlcipher package is needed.
    # Also a transitive of lifeos, but axi imports it directly now.
    "sqlcipher3-wheels>=0.5",
    # sqlite-vec: vector similarity extension for SQLCipher (semantic memory, Slice 1).
    # PoC 0.1 confirmed it loads into a sqlcipher3 connection via enable_load_extension.
    # Installed ad-hoc during PoC; now formalized as a declared dependency so uv sync
    # keeps it available. Used by store.create_vec_nodes_table + knn_nodes.
    "sqlite-vec>=0.1.6",
    # MCP server (axi.mcp_server) — exposes LifeOS capabilities to local
    # agents over stdio. Official Python SDK; FastMCP lives under mcp.server.
    "mcp>=1.2",
    # Sibling LifeOS core package — imported as `from lifeos import ...`
    # for reminders, agents (nano), metrics, store, and per-domain
    # ingestion (finance/exercise/health/etc.). Sourced as an editable
    # path dep below so `uv sync` keeps it installed.
    "lifeos",
    # Audio playback for piper_python_engine.py (TTS output) and
    # translate.py (live capture). Not a transitive of any current dep —
    # must be declared explicitly or uv sync drops it.
    "pyaudio>=0.2.14",
    # VAD for diarize.preprocess_wav. resemblyzer pulls plain `webrtcvad`
    # but that package's wheel has a broken layout under uv (top-level
    # webrtcvad.py + _webrtcvad.so go missing post-install). Pinning the
    # `-wheels` fork ships a working binary install. Keep both: resemblyzer
    # still depends on `webrtcvad`, and `-wheels` overrides the import.
    "webrtcvad-wheels>=2.0.14",
    "freezegun>=1.5.5",
    # NOTE: openwakeword>=0.6.0 is a required runtime dep for the default
    # wakeword_engine='openwakeword' but CANNOT be declared here because its
    # tflite-runtime subdep has no cp312 wheel and blocks uv's resolver.
    # Install manually into the venv:
    #   uv pip install openwakeword --no-deps
    # onnxruntime (already present via faster-whisper) is used automatically.
    # See: axi/src/axi/wakeword.py OWWWakeWordListener for the integration.
    "claude-agent-sdk>=0.2.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axi"]

[tool.uv]
package = true

[tool.uv.sources]
lifeos = { path = "../lifeos", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
