{% extends "_base.html" %}
{% block nav_health %}active{% endblock %}
{% block title %}Salud · Axi{% endblock %}

{% block content %}
<div class="space-y-4" x-data="healthPage()" x-init="load(); startPolling()" x-destroy="stopPolling()">
  <div class="flex justify-between items-baseline gap-4 flex-wrap">
    <h1 class="text-2xl font-semibold">Salud</h1>
    <div class="flex gap-2 items-center text-sm flex-wrap">
      <select x-model="filter.kind" @change="load()" class="panel2 px-3 py-2 text-sm">
        <option value="">Todos</option>
        <option value="symptom">🤒 Síntomas</option>
        <option value="vital">📊 Vitales</option>
        <option value="medication">💊 Medicación</option>
        <option value="condition">📋 Condiciones</option>
        <option value="note">📝 Notas</option>
      </select>
      <select x-model.number="filter.days" @change="load()" class="panel2 px-3 py-2 text-sm">
        <option :value="7">Última semana</option>
        <option :value="30">Último mes</option>
        <option :value="90">Últimos 3 meses</option>
        <option :value="365">Último año</option>
        <option :value="3650">Todo</option>
      </select>
      <input type="text" x-model.debounce.300ms="filter.q" @input="load()"
             placeholder="Buscar…" class="panel2 px-3 py-2 text-sm" maxlength="120">
      <button class="btn" @click="load()">Refrescar</button>
    </div>
  </div>

  <!-- Compose -->
  <div class="panel p-4 space-y-3">
    <h2 class="text-sm font-semibold muted uppercase tracking-wider">Nueva entrada</h2>
    <div class="grid md:grid-cols-3 gap-2">
      <select x-model="form.kind" @change="onKindChange()" class="panel2 px-3 py-2 text-sm">
        <option value="symptom">🤒 Síntoma</option>
        <option value="vital">📊 Vital (glucosa, presión, peso, sueño)</option>
        <option value="medication">💊 Medicación</option>
        <option value="condition">📋 Condición</option>
        <option value="note">📝 Nota</option>
      </select>
      <input type="text" x-model="form.title" placeholder="Título"
             class="panel2 px-3 py-2 text-sm md:col-span-2" maxlength="200">
    </div>

    <!-- Vital-specific fields -->
    <template x-if="form.kind === 'vital'">
      <div class="grid md:grid-cols-3 gap-2">
        <select x-model="form.vital_type" class="panel2 px-3 py-2 text-sm">
          <option value="glucose">Glucosa (mg/dL)</option>
          <option value="blood_pressure">Presión (mmHg)</option>
          <option value="weight">Peso (kg)</option>
          <option value="sleep_hours">Horas de sueño</option>
          <option value="other">Otra</option>
        </select>
        <template x-if="form.vital_type !== 'blood_pressure'">
          <input type="number" step="0.1" x-model.number="form.vital_value" placeholder="Valor"
                 class="panel2 px-3 py-2 text-sm">
        </template>
        <template x-if="form.vital_type === 'blood_pressure'">
          <div class="flex items-center gap-1 text-sm md:col-span-2">
            <input type="number" x-model.number="form.bp_sys" placeholder="sistólica"
                   class="panel2 px-3 py-2 text-sm w-24">
            <span class="muted">/</span>
            <input type="number" x-model.number="form.bp_dia" placeholder="diastólica"
                   class="panel2 px-3 py-2 text-sm w-24">
            <span class="muted text-xs">mmHg</span>
          </div>
        </template>
      </div>
    </template>

    <div class="grid md:grid-cols-2 gap-2">
      <input type="datetime-local" x-model="form.ts_local"
             class="panel2 px-3 py-2 text-sm">
      <input type="text" x-model="form.tags" placeholder="Tags (coma)"
             class="panel2 px-3 py-2 text-sm" maxlength="200">
    </div>
    <textarea x-model="form.body" placeholder="Notas (opcional)"
              class="panel2 px-3 py-2 text-sm w-full" rows="2" maxlength="2000"></textarea>
    <div class="flex justify-end gap-2">
      <button class="btn btn-primary" @click="create()" :disabled="!form.title || !form.ts_local">
        Guardar
      </button>
    </div>
    <div x-show="error" x-text="error" x-cloak class="text-sm" style="color: var(--red)"></div>
  </div>

  <!-- Timeline -->
  <template x-if="loading">
    <div class="muted py-12 text-center">Cargando…</div>
  </template>
  <template x-if="!loading && rows.length === 0">
    <div class="panel p-12 text-center muted">
      Sin entradas en este rango. Probá decirle al chat: "tengo dolor de cabeza" o
      "glucosa 92" — Axi lo detecta y lo guarda acá.
    </div>
  </template>

  <div class="grid gap-2" x-show="rows.length > 0">
    <template x-for="r in rows" :key="r.id">
      <div class="panel p-3 flex items-start gap-3">
        <span class="text-xl" x-text="kindIcon(r.kind)"></span>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2 flex-wrap">
            <span class="text-sm font-medium" x-text="r.title"></span>
            <template x-if="r.source !== 'manual'">
              <span class="text-xs px-1.5 py-0.5 panel2 rounded muted"
                    x-text="r.source"></span>
            </template>
            <template x-if="r.confidence < 1.0">
              <span class="text-xs muted" x-text="'conf: ' + (r.confidence * 100).toFixed(0) + '%'"></span>
            </template>
          </div>
          <div class="text-xs muted mt-1" x-text="fmtTs(r.ts)"></div>
          <!-- Structured data fields (pulso, IMC, grasa, etc.) as labeled
               chips. Only renders what's actually present in r.data; if the
               user didn't include a metric, the chip simply doesn't appear. -->
          <template x-if="r.data && Object.keys(r.data).length > 0">
            <div class="mt-2 flex flex-wrap gap-1">
              <template x-for="chip in dataChips(r.data)" :key="chip.label">
                <span class="text-xs panel2 px-2 py-0.5 rounded inline-flex items-center gap-1">
                  <span class="muted" x-text="chip.label"></span>
                  <span class="font-medium" x-text="chip.value"></span>
                </span>
              </template>
            </div>
          </template>
          <template x-if="r.body">
            <div class="text-xs mt-2" x-text="r.body"></div>
          </template>
          <template x-if="r.tags && r.tags.length > 0">
            <div class="text-xs muted mt-1">
              <template x-for="t in r.tags" :key="t">
                <span class="mr-1 px-1.5 py-0.5 panel2 rounded" x-text="'#' + t"></span>
              </template>
            </div>
          </template>
        </div>
        <button @click="del(r.id)"
                class="text-xs panel2 px-2 py-1 rounded hover:brightness-110"
                title="Eliminar">🗑️</button>
      </div>
    </template>
  </div>
</div>

<script>
function healthPage() {
  return {
    rows: [],
    loading: true,
    error: '',
    filter: { kind: '', days: 30, q: '' },
    form: {
      kind: 'symptom', title: '', ts_local: '', body: '', tags: '',
      vital_type: 'glucose', vital_value: null, bp_sys: null, bp_dia: null,
    },
    _pollHandle: null,
    startPolling() {
      this.stopPolling();
      // Slower than reminders — health data doesn't change second-to-second.
      this._pollHandle = setInterval(() => this.load(true), 15000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) this.stopPolling();
        else this.startPolling();
      });
    },
    stopPolling() {
      if (this._pollHandle) { clearInterval(this._pollHandle); this._pollHandle = null; }
    },
    onKindChange() {
      // Reset vital fields when switching kinds
      if (this.form.kind !== 'vital') {
        this.form.vital_value = null;
        this.form.bp_sys = null;
        this.form.bp_dia = null;
      }
    },
    async load(silent = false) {
      if (!silent && this.rows.length === 0) this.loading = true;
      const params = new URLSearchParams();
      if (this.filter.kind) params.set('kind', this.filter.kind);
      if (this.filter.days) params.set('days', this.filter.days);
      if (this.filter.q) params.set('q', this.filter.q);
      try {
        const r = await fetch('/api/health/entries?' + params.toString());
        if (r.ok) {
          const data = await r.json();
          this.rows = data.entries || [];
        }
      } catch (e) { /* keep current rows on network blip */ }
      this.loading = false;
    },
    async create() {
      this.error = '';
      const localDt = new Date(this.form.ts_local);
      if (isNaN(localDt.getTime())) { this.error = 'Fecha inválida'; return; }
      let data = null;
      if (this.form.kind === 'vital') {
        if (this.form.vital_type === 'blood_pressure') {
          if (!this.form.bp_sys || !this.form.bp_dia) {
            this.error = 'Ingresá sistólica y diastólica'; return;
          }
          data = { type: 'blood_pressure', systolic: this.form.bp_sys,
                   diastolic: this.form.bp_dia, unit: 'mmHg' };
        } else {
          if (this.form.vital_value == null) {
            this.error = 'Ingresá un valor numérico'; return;
          }
          const unit = ({glucose:'mg/dL', weight:'kg', sleep_hours:'h'})[this.form.vital_type] || '';
          data = { type: this.form.vital_type, value: this.form.vital_value, unit };
        }
      }
      const tags = this.form.tags
        ? this.form.tags.split(',').map(t => t.trim()).filter(Boolean)
        : null;
      const body = {
        kind: this.form.kind,
        title: this.form.title,
        ts: localDt.toISOString(),
        body: this.form.body || null,
        data, tags,
      };
      const r = await fetch('/api/health/entries', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) { this.error = 'No se pudo guardar: ' + (await r.text()); return; }
      this.form = {
        kind: 'symptom', title: '', ts_local: '', body: '', tags: '',
        vital_type: 'glucose', vital_value: null, bp_sys: null, bp_dia: null,
      };
      this.load();
    },
    async del(id) {
      await fetch('/api/health/entries/' + id, { method: 'DELETE' });
      this.load();
    },
    kindIcon(k) {
      return ({symptom:'🤒', vital:'📊', medication:'💊', condition:'📋', note:'📝'})[k] || '•';
    },
    // Render data fields as labeled chips. Maps internal field keys to
    // user-readable labels + units. Only includes fields that have a value;
    // missing metrics (the user didn't send them) simply don't render.
    dataChips(d) {
      if (!d || typeof d !== 'object') return [];
      // Each entry: [key, label, unit]. Order = display order.
      const SCHEMA = [
        // Vitals (blood pressure, glucose, weight, sleep)
        ['systolic', 'Sistólica', 'mmHg'],
        ['diastolic', 'Diastólica', 'mmHg'],
        ['pulse_bpm', 'Pulso', 'bpm'],
        ['value', null, null],     // generic — label depends on `type`
        // Body composition
        ['weight_kg', 'Peso', 'kg'],
        ['muscle_pct', 'Músculo', '%'],
        ['body_fat_pct', 'Grasa', '%'],
        ['visceral_fat', 'Visceral', ''],
        ['basal_metabolic_rate', 'RM', 'kcal'],
        ['bmi', 'IMC', ''],
        // Sleep
        ['start_hour_24', 'Dormido a', 'h'],
        ['end_hour_24', 'Despertó a', 'h'],
      ];
      // 'value' field uses a label derived from `type` (so glucose, weight,
      // sleep_hours, body_fat_pct… each get the right label).
      const TYPE_LABELS = {
        glucose: ['Glucosa', 'mg/dL'],
        weight: ['Peso', 'kg'],
        sleep_hours: ['Sueño', 'h'],
        body_fat_pct: ['Grasa', '%'],
        muscle_pct: ['Músculo', '%'],
        basal_metabolic_rate: ['RM', 'kcal'],
        bmi: ['IMC', ''],
        visceral_fat: ['Visceral', ''],
      };
      const out = [];
      for (const [key, label, unit] of SCHEMA) {
        if (d[key] === undefined || d[key] === null) continue;
        let l = label;
        let u = unit;
        if (key === 'value' && d.type && TYPE_LABELS[d.type]) {
          [l, u] = TYPE_LABELS[d.type];
        } else if (key === 'value') {
          continue;  // generic value without a known type label
        }
        let v = d[key];
        // Format clock hours nicely.
        if (key === 'start_hour_24' || key === 'end_hour_24') {
          const min_key = key.replace('hour_24', 'minute');
          const mm = d[min_key] || 0;
          v = String(v).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
          u = '';
        }
        out.push({ label: l, value: u ? `${v} ${u}` : `${v}` });
      }
      return out;
    },
    fmtTs(iso) {
      try {
        return new Date(iso).toLocaleString('es-MX', {
          weekday: 'short', day: 'numeric', month: 'short',
          hour: '2-digit', minute: '2-digit',
        });
      } catch (e) { return iso; }
    },
  };
}
</script>
{% endblock %}
