{% extends "_base.html" %}
{% block title %}Chat — Axi{% endblock %}
{% block nav_chat %}active{% endblock %}

{% block content %}
<!-- Anclar el chat al viewport: header sticky arriba, este div ocupa
     EXACTO el resto. Solo el hilo de mensajes hace scroll. El input queda
     pegado al fondo. -->
<style>
  /* En /chat queremos un margen visible arriba del título (para que no
     toque la barra del header) y SIN padding inferior — el input queda
     pegado al borde de abajo del viewport. */
  main { padding-top: 0.75rem !important; padding-bottom: 0 !important; }
  body { overflow: hidden !important; }
</style>
<div
  x-data="chatApp()"
  x-init="init()"
  class="flex flex-col"
  style="height: calc(100dvh - 9rem); min-height: 24rem;"
>
  <!-- Header strip -->
  <div class="flex items-baseline justify-between mb-3 gap-2 flex-wrap">
    <div class="font-semibold text-base md:text-lg flex items-center gap-2">
      💬 Chat con Axi
      <!-- Online/offline indicator + queue count when sin VPN. -->
      <span x-show="!online" x-cloak
            class="text-xs px-2 py-0.5 rounded-full panel2"
            style="color: var(--amber); border-color: var(--amber);"
            x-text="queuedCount > 0 ? '📴 sin conexión · ' + queuedCount + ' encolado(s)' : '📴 sin conexión'"></span>
      <span x-show="online && queuedCount > 0" x-cloak
            class="text-xs px-2 py-0.5 rounded-full panel2"
            style="color: var(--blue); border-color: var(--blue);"
            x-text="'⏳ sincronizando ' + queuedCount"></span>
    </div>
    <div class="muted text-xs">
      <span x-show="lastLatencyMs !== null" x-cloak>
        última respuesta: <span x-text="lastLatencyMs"></span> ms
      </span>
    </div>
  </div>

  <!-- Conversation thread -->
  <div
    x-ref="thread"
    class="flex-1 overflow-y-auto panel p-3 md:p-4 space-y-3"
  >
    <template x-if="loading && messages.length === 0">
      <div class="muted text-sm text-center py-8">Cargando historial…</div>
    </template>
    <template x-if="!loading && messages.length === 0">
      <div class="muted text-sm text-center py-8">
        Hablale a Axi. Comparte el mismo recuerdo que la voz, así que puedes
        seguir conversaciones empezadas con Meta+Shift+Espacio.
      </div>
    </template>

    <template x-for="(m, idx) in messages" :key="m.id + ':' + m.role">
      <div :class="m.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
        <div
          class="max-w-[85%] md:max-w-[75%] px-3 py-2 rounded-2xl text-sm md:text-base"
          :style="m.role === 'user'
            ? 'background: rgba(255,107,157,0.18); border: 1px solid rgba(255,107,157,0.4);'
            : 'background: var(--panel2); border: 1px solid var(--border);'"
        >
          <template x-if="m.image_b64">
            <img
              :src="'data:image/png;base64,' + m.image_b64"
              class="max-w-full rounded mb-2"
              style="max-height: 18rem;"
              alt="adjunto"
            />
          </template>
          <template x-if="m.role === 'axi'">
            <div>
              <div class="md" x-html="renderMarkdown(m.text)"></div>
              <template x-if="m.audio_b64">
                <audio
                  :src="'data:audio/wav;base64,' + m.audio_b64"
                  controls
                  preload="auto"
                  class="mt-3 w-full block"
                  style="min-width: 18rem; max-width: 100%; height: 2.75rem; border-radius: 0.5rem;"
                ></audio>
              </template>
            </div>
          </template>
          <template x-if="m.role === 'user'">
            <div>
              <div style="white-space: pre-wrap" x-text="m.text"></div>
              <template x-if="m.status === 'queued'">
                <div class="text-xs muted mt-1" style="color: var(--amber)">
                  ⏳ encolado — se envía cuando vuelva la conexión
                </div>
              </template>
              <template x-if="m.status === 'error'">
                <div class="text-xs mt-1 flex items-center gap-2" style="color: var(--red)">
                  <span x-text="'⚠ ' + (m.errorMsg || 'falló')"></span>
                  <button class="btn" style="padding: 0.1rem 0.5rem; font-size: 0.75rem;"
                          @click="retryQueued(m.id.slice(0, -1))">↻ Reintentar</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="pending">
      <div class="flex justify-start">
        <div
          class="px-3 py-2 rounded-2xl text-sm muted pulse"
          style="background: var(--panel2); border: 1px solid var(--border);"
          x-text="online ? 'Axi escribiendo…' : '⏳ Encolando — se enviará cuando vuelva la conexión'"
        ></div>
      </div>
    </template>
    <template x-if="error">
      <div
        class="text-sm px-3 py-2 rounded-lg"
        style="background: rgba(238,51,51,0.1); color: var(--red); border: 1px solid var(--red)"
        x-text="error"
      ></div>
    </template>
  </div>

  <!-- Pending attachment preview (above input) -->
  <template x-if="pendingImage">
    <div class="mt-2 panel p-2 flex items-center gap-2">
      <img
        :src="'data:image/png;base64,' + pendingImage"
        class="rounded"
        style="height: 3rem; width: auto;"
        alt="adjunto pendiente"
      />
      <span class="text-xs muted flex-1">Imagen lista — escribe un prompt o envía vacío.</span>
      <button
        type="button"
        @click="pendingImage = null"
        class="btn"
        style="padding: 0.25rem 0.5rem; font-size: 0.85rem;"
        title="Descartar imagen"
      >✕</button>
    </div>
  </template>

  <!-- Input area (sticky bottom of the column) -->
  <div class="mt-2 panel p-2 md:p-3">
    <!-- Toolbar (mobile-first: wrap, big touch targets) -->
    <div class="flex flex-wrap gap-1 mb-2">
      <!-- Webcam laptop + screenshot + voz a Whisper: TODOS requieren VPN
           (la captura corre en la laptop o la transcripción usa el daemon).
           Disabled cuando el dispositivo está offline. -->
      <button
        type="button"
        @click="captureCamera()"
        :disabled="capturing || pending || !online"
        class="btn"
        style="min-height: 2.5rem; min-width: 2.75rem;"
        :title="online ? 'Foto webcam (requiere VPN)' : 'Foto webcam — sin conexión'"
        :style="!online ? 'opacity: 0.4' : ''"
      >
        <span x-show="capturing !== 'camera'">📷</span>
        <span x-show="capturing === 'camera'" x-cloak>⏳</span>
      </button>
      <button
        type="button"
        @click="captureScreen()"
        :disabled="capturing || pending || !online"
        class="btn"
        style="min-height: 2.5rem; min-width: 2.75rem;"
        :title="online ? 'Captura de pantalla (laptop)' : 'Captura de pantalla — sin conexión'"
        :style="!online ? 'opacity: 0.4' : ''"
      >
        <span x-show="capturing !== 'screen'">🖥</span>
        <span x-show="capturing === 'screen'" x-cloak>⏳</span>
      </button>
      <!-- Pixel camera (PWA on phone). Uses Web getUserMedia to capture from
           the device this PWA is running on. Different from the 📷 button
           above which captures from the LAPTOP webcam. -->
      <button
        type="button"
        @click="capturePhoneCamera()"
        :disabled="capturing || pending"
        class="btn"
        style="min-height: 2.5rem; min-width: 2.75rem;"
        title="Cámara del dispositivo (Pixel)"
      >
        <span x-show="capturing !== 'phone-camera'">📱</span>
        <span x-show="capturing === 'phone-camera'" x-cloak>⏳</span>
      </button>
      <!-- Geolocation toggle. When ON, the next chat message will include
           lat/lng so the backend can geo-tag finance/event entries. -->
      <button
        type="button"
        @click="toggleLocation()"
        :disabled="pending"
        class="btn"
        :style="locationOn
          ? 'min-height: 2.5rem; min-width: 2.75rem; background: rgba(102,204,255,0.2); border-color: var(--blue);'
          : 'min-height: 2.5rem; min-width: 2.75rem;'"
        :title="locationOn ? 'Ubicación ON — adjuntar lat/lng al próximo mensaje' : 'Ubicación OFF — clic para activar'"
      >
        <span x-text="locationOn ? '📍' : '📵'"></span>
      </button>
      <!-- Mic: graba con MediaRecorder local pero la transcripción la hace
           Whisper en la laptop. Requiere VPN. -->
      <button
        type="button"
        @mousedown.prevent="startRecording()"
        @mouseup.prevent="stopRecording()"
        @mouseleave="stopRecording()"
        @touchstart.prevent="startRecording()"
        @touchend.prevent="stopRecording()"
        @touchcancel="stopRecording()"
        :disabled="pending || transcribing || !online"
        class="btn"
        :style="recording
          ? 'min-height: 2.5rem; min-width: 2.75rem; background: rgba(238,51,51,0.25); border-color: var(--red);'
          : (!online ? 'min-height: 2.5rem; min-width: 2.75rem; opacity: 0.4' : 'min-height: 2.5rem; min-width: 2.75rem;')"
        :title="!online ? 'Micrófono — sin conexión a Whisper' : (recording ? 'Soltá para transcribir' : 'Mantén presionado para grabar')"
      >
        <span x-show="!recording && !transcribing">🎤</span>
        <span x-show="recording" x-cloak>● REC</span>
        <span x-show="transcribing && !recording" x-cloak>⏳</span>
      </button>
      <!-- TTS: Piper synth corre en laptop, requiere VPN. -->
      <button
        type="button"
        @click="toggleSpeak()"
        :disabled="pending || !online"
        class="btn"
        :style="speakOn
          ? 'min-height: 2.5rem; min-width: 2.75rem; background: rgba(102,204,255,0.2); border-color: var(--blue);'
          : (!online ? 'min-height: 2.5rem; min-width: 2.75rem; opacity: 0.4' : 'min-height: 2.5rem; min-width: 2.75rem;')"
        :title="!online ? 'Voz TTS — sin conexión a Piper' : (speakOn ? 'Voz activada — clic para silenciar' : 'Voz desactivada — clic para activar')"
      >
        <span x-text="speakOn ? '🔊' : '🔇'"></span>
      </button>
      <!-- Logging mode toggle. ON = data-entry (nano agents, no internet).
           OFF (default) = free conversation with the big brain. -->
      <button
        type="button"
        @click="toggleLoggingMode()"
        :disabled="pending"
        class="btn"
        :style="loggingMode
          ? 'min-height: 2.5rem; min-width: 2.75rem; background: rgba(255,107,157,0.2); border-color: var(--pink, #ff6b9d);'
          : 'min-height: 2.5rem; min-width: 2.75rem;'"
        :title="loggingMode
          ? 'Modo registro ON — guardando datos (nano). Clic para cambiar a charla.'
          : 'Modo charla — hablando con Axi. Clic para cambiar a registro de datos.'"
      >
        <span x-text="loggingMode ? '💾' : '💬'"></span>
      </button>
    </div>
    <!-- Mode hint strip -->
    <div x-show="loggingMode" x-cloak
         class="text-xs muted mb-1 px-1"
         style="color: var(--pink, #ff6b9d);">
      Modo registro — los nano-agentes guardan tus datos. Sin internet.
    </div>

    <form @submit.prevent="send()" class="flex gap-2 items-end">
      <textarea
        x-ref="input"
        x-model="draft"
        @keydown.enter.prevent="onEnter($event)"
        @input="autogrow()"
        rows="2"
        placeholder="Escribe a Axi… (Enter = enviar · Shift+Enter = salto de línea)"
        class="flex-1 panel2 px-3 py-3 text-sm md:text-base resize-none leading-relaxed"
        style="border-radius: 0.5rem; max-height: 14rem; min-height: 3.75rem;"
        :disabled="pending"
      ></textarea>
      <button
        type="submit"
        class="btn btn-primary self-stretch px-4"
        style="min-height: 2.75rem; min-width: 3.5rem;"
        :disabled="pending || (!draft.trim() && !pendingImage)"
      >
        <span x-show="!pending">Enviar</span>
        <span x-show="pending" x-cloak>…</span>
      </button>
    </form>
  </div>
</div>

<script>
function chatApp() {
  return {
    messages: [],
    draft: '',
    pending: false,
    loading: true,
    error: null,
    lastLatencyMs: null,
    loggingMode: false,   // true = registro de datos; false = charla libre

    // Multimodal state
    pendingImage: null,    // base64 PNG to attach to next /api/chat/ask
    capturing: null,       // 'screen' | 'camera' | 'phone-camera' | null
    recording: false,      // mic active
    transcribing: false,   // POST /api/chat/transcribe in flight
    speakOn: false,        // persists in localStorage
    locationOn: false,     // when true, attach lat/lng to next message
    _pendingLocation: null,  // {lat, lng, accuracy_m} captured at send time
    _mediaRecorder: null,
    _audioChunks: [],
    _audioStream: null,
    _audioMime: 'audio/webm',

    // Offline state
    online: true,            // navigator.onLine cached
    queuedCount: 0,          // how many messages waiting in IDB
    _idbName: 'axi-offline',
    _idbVersion: 1,
    _queueStore: 'chat_queue',

    async init() {
      try {
        const stored = localStorage.getItem('axi_chat_speak');
        this.speakOn = stored === '1';
        const locStored = localStorage.getItem('axi_chat_location');
        this.locationOn = locStored === '1';
        const logStored = localStorage.getItem('axi_chat_logging_mode');
        this.loggingMode = logStored === '1';
      } catch (e) { /* private mode etc. */ }
      await this.loadHistory();
      // CRITICAL: restore any pending/error items from IDB queue as
      // bubbles. If the user closed the app while messages were queued
      // (or sync failed), they reappear here. Never silently lose data.
      await this._restoreQueueBubbles();
      this.scrollToBottom();
      // Best-effort badge refresh on page load (foreground) so the icon
      // stays accurate even between push events.
      this.refreshBadge();
      // Refresh badge every time the tab comes back to foreground.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) this.refreshBadge();
      });

      // online flag reflects "can I reach the backend right now". Combines
      // navigator.onLine (device has any network) with AXI_REACHABLE
      // (laptop is reachable through VPN). Both must be true.
      this.online = navigator.onLine !== false && window.AXI_REACHABLE !== false;
      const _syncOnline = () => {
        this.online = navigator.onLine !== false && window.AXI_REACHABLE !== false;
        if (this.online) this._tryDrainQueue();
      };
      window.addEventListener('online', _syncOnline);
      window.addEventListener('offline', _syncOnline);

      // Mark that chat handles its own reconnect — global handler in
      // _base.html will skip the auto-reload so the user doesn't lose
      // text they're composing.
      window.AXI_HANDLES_RECONNECT = true;
      // Re-load history every time reachability becomes true, and update
      // the online flag. Without this, the chat would stay frozen as
      // "Sin conexión" until the user manually reloaded.
      window.addEventListener('axi-reachability', (e) => {
        this.online = navigator.onLine !== false && e.detail.reachable !== false;
        if (e.detail.reachable === true) {
          this.loadHistory().then(() => this._restoreQueueBubbles());
          this._tryDrainQueue();
        }
      });
      await this._refreshQueuedCount();
      // Drain on load. If the reachability probe resolved BEFORE the
      // listener above was registered (fast VPN: probe starts at script
      // parse, init() is still awaiting loadHistory), the 'axi-reachability'
      // event was missed and will never re-fire — and the 'online' event
      // never fires when device connectivity never changed. Without this
      // nudge, queued messages stay stuck until the user toggles airplane
      // mode. Background Sync alone can't recover either: the browser
      // drops the sync registration after a few failed retries while the
      // laptop is off.
      if (window.AXI_REACHABLE === true) this._tryDrainQueue();

      // Listen for SW messages (sync results).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', (event) => {
          const m = event.data || {};
          if (m.type === 'sync-sent') {
            // Replace pending bubble's text with the now-confirmed user msg
            // and append Axi's response.
            this._onSyncSent(m.tempId, m.answer, m.latency_ms);
          } else if (m.type === 'sync-error') {
            this._onSyncError(m.tempId, m.error);
          } else if (m.type === 'sync-retry') {
            // Still offline — leave bubble in queued state.
          }
        });
      }
    },

    // ─── IndexedDB helpers ────────────────────────────────────────────

    _openIdb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(this._idbName, this._idbVersion);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(this._queueStore)) {
            db.createObjectStore(this._queueStore, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    },

    async _idbPut(item) {
      const db = await this._openIdb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([this._queueStore], 'readwrite');
        tx.objectStore(this._queueStore).put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },

    async _idbAll() {
      const db = await this._openIdb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([this._queueStore], 'readonly');
        const req = tx.objectStore(this._queueStore).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    },

    async _refreshQueuedCount() {
      try {
        const all = await this._idbAll();
        this.queuedCount = all.filter(x => x.status === 'queued').length;
      } catch (e) { this.queuedCount = 0; }
    },

    async _restoreQueueBubbles() {
      // Show any persisted-but-unsent messages as bubbles at the bottom
      // of the conversation. Status reflects what happened to them:
      //   'queued' → still waiting for sync
      //   'error'  → permanent server reject; user can manually retry
      try {
        const all = await this._idbAll();
        const sorted = all.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
        for (const item of sorted) {
          // Don't add a bubble if one with this id is already in the
          // local messages array (e.g. just got enqueued this session).
          if (this.messages.find(m => m.id === item.id + 'u')) continue;
          this.messages.push({
            id: item.id + 'u',
            role: 'user',
            text: item.text || '(imagen)',
            image_b64: item.image_b64 || null,
            queued: true,
            status: item.status,
            errorMsg: item.error || null,
          });
        }
        this.queuedCount = all.filter(x => x.status === 'queued').length;
      } catch (e) { /* IDB unavailable — proceed without */ }
    },

    async retryQueued(tempId) {
      // User-triggered retry from a bubble marked 'error'. Re-mark as
      // 'queued' in IDB and register sync.
      try {
        const all = await this._idbAll();
        const item = all.find(i => i.id === tempId);
        if (!item) return;
        await this._idbPut({ ...item, status: 'queued', error: null });
        const bubble = this.messages.find(m => m.id === tempId + 'u');
        if (bubble) { bubble.status = 'queued'; bubble.errorMsg = null; }
        await this._refreshQueuedCount();
        const reg = await navigator.serviceWorker.ready;
        if ('sync' in reg) await reg.sync.register('chat-queue');
        if (this.online) await this._tryDrainQueue();
      } catch (e) { /* ignored */ }
    },

    async _enqueueChat(text, image_b64, location) {
      // Persist the unsent message so background sync can drain it later.
      const id = 'q' + Date.now() + Math.random().toString(36).slice(2, 8);
      await this._idbPut({
        id, text, image_b64: image_b64 || null,
        location: location || null,
        status: 'queued',
        created_at: new Date().toISOString(),
      });
      await this._refreshQueuedCount();
      // Register sync (browser fires when reconnected).
      try {
        const reg = await navigator.serviceWorker.ready;
        if ('sync' in reg) await reg.sync.register('chat-queue');
      } catch (e) { /* sync unsupported — manual drain will still try */ }
      return id;
    },

    async _tryDrainQueue() {
      // Manual nudge to the SW to drain now (faster than waiting for
      // OS-fired sync, which can take minutes).
      try {
        const reg = await navigator.serviceWorker.ready;
        if (reg.active) reg.active.postMessage({ type: 'drain-chat-queue' });
      } catch (e) {}
    },

    _onSyncSent(tempId, answer, latency_ms) {
      // Find the pending bubble by tempId, mark it as sent, append response.
      const u = this.messages.find(m => m.id === tempId + 'u');
      if (u) {
        u.status = 'sent';
        delete u.queued;
      }
      this.messages.push({
        id: tempId + 'a', role: 'axi', text: answer,
      });
      this.lastLatencyMs = latency_ms;
      this._refreshQueuedCount();
      if (navigator.vibrate) navigator.vibrate(30);
      this.$nextTick(() => this.scrollToBottom());
    },

    _onSyncError(tempId, error) {
      const u = this.messages.find(m => m.id === tempId + 'u');
      if (u) {
        u.status = 'error';
        u.errorMsg = error;
      }
      this._refreshQueuedCount();
    },

    async refreshBadge() {
      try {
        const r = await fetch('/api/badge/count');
        if (!r.ok || !('setAppBadge' in navigator)) return;
        const { count } = await r.json();
        if (count > 0) await navigator.setAppBadge(count);
        else await navigator.clearAppBadge();
      } catch (e) { /* badging API unavailable on this platform */ }
    },

    toggleLocation() {
      this.locationOn = !this.locationOn;
      try { localStorage.setItem('axi_chat_location', this.locationOn ? '1' : '0'); } catch(e) {}
      if (this.locationOn && navigator.vibrate) navigator.vibrate(30);
    },

    async _captureLocationOnce() {
      // Get a fresh GPS fix when the user sends a message with location on.
      // 10s timeout so a flaky GPS doesn't block the send.
      if (!this.locationOn || !navigator.geolocation) return null;
      return new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy_m: pos.coords.accuracy,
          }),
          () => resolve(null),  // permission denied / no fix
          { timeout: 10000, maximumAge: 60000, enableHighAccuracy: false },
        );
      });
    },

    async capturePhoneCamera() {
      // Live capture from the device this PWA is running on (Pixel camera
      // when installed on Android). Uses getUserMedia + a hidden video
      // element to grab one frame, then stops the stream.
      if (this.capturing) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        this.error = 'Tu navegador no soporta acceso a la cámara.';
        return;
      }
      this.capturing = 'phone-camera';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },  // back camera on phones
          audio: false,
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        // Wait a moment so the camera adjusts exposure
        await new Promise(r => setTimeout(r, 250));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        stream.getTracks().forEach(t => t.stop());
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        this.pendingImage = dataUrl.split(',')[1];   // strip "data:image/jpeg;base64,"
        if (navigator.vibrate) navigator.vibrate(40);
      } catch (e) {
        this.error = 'No se pudo capturar: ' + (e.message || e);
      } finally {
        this.capturing = null;
      }
    },

    async loadHistory() {
      this.loading = true;
      // Skip the fetch entirely if we already know the backend is
      // unreachable (probe ran in _base.html). The page renders the
      // queued-bubble restore + empty thread without waiting.
      const reachable = await window.axiAwaitReachable();
      if (!reachable) {
        this.loading = false;
        return;
      }
      try {
        const ctrl = new AbortController();
        const timeout = setTimeout(() => ctrl.abort(), 5000);
        const r = await fetch('/api/chat/history?limit=50', { signal: ctrl.signal });
        clearTimeout(timeout);
        if (!r.ok) throw new Error('history ' + r.status);
        const rows = await r.json();
        const out = [];
        for (const row of rows) {
          out.push({ id: 'h' + row.id + 'u', role: 'user', text: row.user_text });
          out.push({ id: 'h' + row.id + 'a', role: 'axi', text: row.axi_text });
        }
        this.messages = out;
      } catch (e) {
        // Network failure mid-session — keep empty history, user can
        // still send (gets queued).
      } finally {
        this.loading = false;
      }
    },

    onEnter(ev) {
      if (ev.shiftKey) {
        const ta = this.$refs.input;
        const start = ta.selectionStart, end = ta.selectionEnd;
        this.draft = this.draft.slice(0, start) + '\n' + this.draft.slice(end);
        this.$nextTick(() => {
          ta.selectionStart = ta.selectionEnd = start + 1;
          this.autogrow();
        });
        return;
      }
      this.send();
    },

    autogrow() {
      const ta = this.$refs.input;
      if (!ta) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 6 * 24 + 16) + 'px';
    },

    toggleSpeak() {
      this.speakOn = !this.speakOn;
      try { localStorage.setItem('axi_chat_speak', this.speakOn ? '1' : '0'); } catch (e) {}
    },

    toggleLoggingMode() {
      this.loggingMode = !this.loggingMode;
      try { localStorage.setItem('axi_chat_logging_mode', this.loggingMode ? '1' : '0'); } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(30);
    },

    async captureScreen() {
      if (this.capturing) return;
      this.capturing = 'screen';
      this.error = null;
      try {
        const r = await fetch('/api/chat/capture-screen', { method: 'POST' });
        if (!r.ok) {
          const detail = await r.text();
          throw new Error('HTTP ' + r.status + ': ' + detail);
        }
        const data = await r.json();
        this.pendingImage = data.image_b64;
      } catch (e) {
        this.error = 'No pude capturar pantalla: ' + e.message;
      } finally {
        this.capturing = null;
      }
    },

    async captureCamera() {
      if (this.capturing) return;
      this.capturing = 'camera';
      this.error = null;
      try {
        const r = await fetch('/api/chat/capture-camera', { method: 'POST' });
        if (!r.ok) {
          const detail = await r.text();
          throw new Error('HTTP ' + r.status + ': ' + detail);
        }
        const data = await r.json();
        this.pendingImage = data.image_b64;
      } catch (e) {
        this.error = 'No pude capturar cámara: ' + e.message;
      } finally {
        this.capturing = null;
      }
    },

    async startRecording() {
      if (this.recording || this.transcribing) return;
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        this.error = 'Este navegador no soporta grabación de audio.';
        return;
      }
      try {
        this._audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        this.error = 'No pude acceder al micrófono: ' + e.message;
        return;
      }
      // Prefer webm/opus — it's what Chrome/Firefox produce natively and
      // ffmpeg decodes without extra deps.
      let mime = 'audio/webm;codecs=opus';
      if (!MediaRecorder.isTypeSupported(mime)) {
        mime = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mime)) mime = '';
      }
      this._audioMime = mime || 'audio/webm';
      try {
        this._mediaRecorder = mime
          ? new MediaRecorder(this._audioStream, { mimeType: mime })
          : new MediaRecorder(this._audioStream);
      } catch (e) {
        this.error = 'No pude iniciar MediaRecorder: ' + e.message;
        this._releaseStream();
        return;
      }
      this._audioChunks = [];
      this._mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) this._audioChunks.push(ev.data);
      };
      this._mediaRecorder.onstop = () => this._finishRecording();
      this._mediaRecorder.start();
      this.recording = true;
    },

    stopRecording() {
      if (!this.recording) return;
      this.recording = false;
      try { this._mediaRecorder && this._mediaRecorder.stop(); } catch (e) {}
    },

    _releaseStream() {
      try {
        if (this._audioStream) {
          this._audioStream.getTracks().forEach(t => t.stop());
        }
      } catch (e) {}
      this._audioStream = null;
    },

    async _finishRecording() {
      this._releaseStream();
      const chunks = this._audioChunks;
      this._audioChunks = [];
      if (!chunks.length) return;
      const blob = new Blob(chunks, { type: this._audioMime });
      this.transcribing = true;
      this.error = null;
      try {
        const b64 = await this._blobToB64(blob);
        const r = await fetch('/api/chat/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audio_b64: b64, ext: 'webm' }),
        });
        if (!r.ok) {
          const detail = await r.text();
          throw new Error('HTTP ' + r.status + ': ' + detail);
        }
        const data = await r.json();
        const text = (data.text || '').trim();
        if (text) {
          // Append (don't clobber) — user might have typed before recording.
          this.draft = this.draft ? (this.draft + ' ' + text) : text;
          this.$nextTick(() => this.autogrow());
        }
      } catch (e) {
        this.error = 'Transcripción falló: ' + e.message;
      } finally {
        this.transcribing = false;
      }
    },

    _blobToB64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          // result is data URL: "data:<mime>;base64,<b64>"
          const s = String(reader.result || '');
          const i = s.indexOf(',');
          resolve(i >= 0 ? s.slice(i + 1) : s);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    },

    async send() {
      const text = this.draft.trim();
      const image_b64 = this.pendingImage;
      if (!text && !image_b64) return;
      if (this.pending) return;
      this.error = null;
      const tempId = 'p' + Date.now();
      // Push optimistic user bubble (carries the image for visual continuity).
      this.messages.push({
        id: tempId + 'u',
        role: 'user',
        text: text || (image_b64 ? '(imagen)' : ''),
        image_b64: image_b64 || null,
      });
      this.draft = '';
      this.pendingImage = null;
      this.$nextTick(() => { this.autogrow(); this.scrollToBottom(); });
      this.pending = true;
      // Best-effort location capture before the request — non-blocking on
      // failure so a refused permission or slow GPS doesn't break sends.
      const location = await this._captureLocationOnce();

      // If we're known-offline OR the request fails, queue the message in
      // IndexedDB and register Background Sync. The SW will drain the
      // queue when network is restored and call back via postMessage.
      const queueOnFailure = async (err) => {
        // Use the optimistic bubble's id as a stable tempId so we can find
        // it later when sync completes.
        const queuedTempId = await this._enqueueChat(text, image_b64, location);
        const u = this.messages.find(m => m.id === tempId + 'u');
        if (u) {
          u.id = queuedTempId + 'u';
          u.queued = true;
          u.status = 'queued';
        }
        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      };

      if (!this.online) {
        await queueOnFailure(new Error('offline'));
        this.pending = false;
        this.$nextTick(() => this.scrollToBottom());
        return;
      }

      try {
        const r = await fetch('/api/chat/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            image_b64: image_b64 || null,
            speak: this.speakOn,
            location: location || undefined,
            client_ts: new Date().toISOString(),
            logging_mode: this.loggingMode,
          }),
        });
        if (!r.ok) {
          const detail = await r.text();
          throw new Error('HTTP ' + r.status + ': ' + detail);
        }
        const data = await r.json();
        this.lastLatencyMs = data.latency_ms;
        this.messages.push({
          id: tempId + 'a',
          role: 'axi',
          text: data.answer,
          audio_b64: data.audio_b64 || null,
        });
        // Auto-play the synthesized audio (when speak toggle was on). Plays
        // through the BROWSER speakers — laptop or phone speakers depending
        // on which device opened the dashboard. Phone-friendly.
        if (data.audio_b64) {
          try {
            const audio = new Audio('data:audio/wav;base64,' + data.audio_b64);
            audio.play().catch((err) => {
              // Some browsers block autoplay without prior user interaction —
              // the inline <audio> control inside the bubble lets the user
              // tap play manually.
              console.warn('autoplay blocked:', err);
            });
          } catch (e) { /* not fatal */ }
        }
        try {
          const store = Alpine.$data(document.querySelector('main'));
          if (store && store.refresh) store.refresh();
        } catch (e) { /* not fatal */ }
        // Subtle haptic feedback when a response lands — only on mobile
        // (laptop browsers ignore vibrate()).
        if (navigator.vibrate) navigator.vibrate(30);
        // Refresh the app icon badge in case this call resolved a
        // pending reflection or generated a new insight.
        this.refreshBadge();
      } catch (e) {
        // Network error → queue for background sync and inform the user.
        // The bubble we already pushed stays visible with "encolado" status.
        const isNetwork = (
          e instanceof TypeError ||
          /failed to fetch|network/i.test(e.message || '')
        );
        if (isNetwork) {
          await queueOnFailure(e);
          this.online = false;  // mirror state — onLine sometimes lies
        } else {
          // Real server error (4xx/5xx, validation, etc.) — surface and
          // mark the bubble accordingly.
          this.error = 'No pude obtener respuesta: ' + e.message;
          const u = this.messages.find(m => m.id === tempId + 'u');
          if (u) { u.status = 'error'; u.errorMsg = e.message; }
          if (navigator.vibrate) navigator.vibrate([60, 50, 60]);
        }
      } finally {
        this.pending = false;
        this.$nextTick(() => this.scrollToBottom());
      }
    },

    scrollToBottom() {
      const el = this.$refs.thread;
      if (el) el.scrollTop = el.scrollHeight;
    },
  };
}
</script>
{% endblock %}
