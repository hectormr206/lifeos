{% extends "_base.html" %}
{% block nav_home %}active{% endblock %}

{% block content %}
<template x-if="$store.snap">
  <div class="space-y-6">

    <!-- ─── header strip: big state + clock + quick actions ─── -->
    <section class="panel p-6 flex flex-wrap items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <span class="state-dot pulse" :class="'state-' + $store.snap.state.split(':')[0]" style="width:1.5rem;height:1.5rem"></span>
        <div>
          <div class="text-2xl font-semibold capitalize" x-text="stateLabel($store.snap.state)"></div>
          <div class="muted text-sm" x-text="$store.snap.now.human"></div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-4xl font-mono" x-text="$store.snap.now.time"></div>
        <div class="muted text-xs" x-text="$store.snap.now.tz"></div>
      </div>
    </section>

    <!-- ─── Axi living avatar ─────────────────────────────────────────── -->
    <section class="panel p-4 flex justify-center" x-data="avatarWidget()">

      <!-- Inline axolotl SVG — organs are stable <g id> groups bound by Alpine.
           viewBox 0 0 64 80 (taller than the mark to include a soft chest).
           Palette: gills #FF6B9D/#FFA6C4, body --pink, brain halo --teal,
           eyes #14131F + white catchlight, blush #FF4D88@.55.
           Layer order (back→front): brain halo, gills/ears, body, blush,
           heart, left eye (screen), right eye (webcam), mouth. -->
      <svg id="axi-avatar" viewBox="0 0 64 80" width="240" height="300"
           xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Axi — agente vivo"
           style="overflow:visible">

        <!-- 1. Brain halo — soft teal glow above the head (symbolic, not anatomical) -->
        <g id="organ-brain" class="organ"
           :class="organClass($store.snap.services['llama-server'])"
           @click="open = open === 'brain' ? null : 'brain'"
           style="cursor:pointer">
          <ellipse cx="32" cy="12" rx="13" ry="5.5"
                   fill="var(--teal)" opacity="0.22" style="filter:blur(4px)"/>
          <ellipse cx="32" cy="12" rx="7.5" ry="3"
                   fill="var(--teal)" opacity="0.42" style="filter:blur(2px)"/>
        </g>

        <!-- Outline backing — white sticker rim for the STATIC parts only
             (feet, body, head). Gills, tail and hands carry their own rim so
             it travels with them when they animate. -->
        <g fill="#FFF1F5" stroke="#FFF1F5" stroke-width="2.6" stroke-linejoin="round">
          <ellipse cx="26" cy="67" rx="3.6" ry="2.7"/>
          <ellipse cx="38" cy="67" rx="3.6" ry="2.7"/>
          <ellipse cx="32" cy="56" rx="11.5" ry="11.5"/>
          <ellipse cx="32" cy="38" rx="16.5" ry="14"/>
        </g>

        <!-- 2. Tail — own white rim + dark outline; gently wags via .axi-tail -->
        <g class="axi-tail" style="transform-origin:42px 60px">
          <path d="M40 57 Q52 54 54 63 Q52 70 45 67 Q41 62 40 57 Z"
                fill="#FFF1F5" stroke="#FFF1F5" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M40 57 Q52 54 54 63 Q52 70 45 67 Q41 62 40 57 Z"
                fill="#FF6B9D" stroke="#241019" stroke-width="0.7" stroke-linejoin="round"/>
          <path d="M44 60 Q50 59 51 65" stroke="#E0558A" stroke-width="1"
                fill="none" stroke-linecap="round" opacity="0.8"/>
        </g>

        <!-- 3. Gills / ears — 3 frills each side, fanning out from the head sides -->
        <g id="organ-ears" class="organ"
           :class="organClass($store.snap.services['axi-whisper'])"
           @click="open = open === 'ears' ? null : 'ears'"
           style="cursor:pointer">
          <!-- each gill: a FEATHER — pink spine + filaments fading to teal tip,
               echoing a real axolotl's plume while encoding the LifeOS brand
               duality (pink Axi -> teal LifeOS). Defined once via <use>. -->
          <defs>
            <ellipse id="axi-gill-bg" cx="0" cy="-8.5" rx="3.8" ry="10.6"/>
            <g id="axi-gill">
              <!-- white sticker rim FIRST so it moves with the gill when it floats -->
              <ellipse cx="0" cy="-8.5" rx="3.8" ry="10.6" fill="#FFF1F5" stroke="#FFF1F5" stroke-width="2.6" stroke-linejoin="round"/>
              <!-- soft pink frond w/ dark outline; teal tip has a THINNER dark line -->
              <ellipse cx="0" cy="-8.5" rx="3.8" ry="10.6" fill="#FF6B9D" stroke="#241019" stroke-width="0.6"/>
              <path d="M0 -16.2 Q-3.2 -12 -2.6 -7.2 Q0 -8.6 2.6 -7.2 Q3.2 -12 0 -16.2 Z" fill="#00D4AA" stroke="#241019" stroke-width="0.42" stroke-linejoin="round"/>
              <ellipse cx="-0.4" cy="-8.8" rx="1.6" ry="5" fill="#FFA6C4" opacity="0.65"/>
              <ellipse cx="-0.8" cy="-13.2" rx="0.8" ry="2.2" fill="#FFFFFF" opacity="0.6"/>
            </g>
          </defs>
          <use href="#axi-gill" transform="translate(23,32) rotate(-42) scale(0.84)"/>
          <use href="#axi-gill" transform="translate(20,37) rotate(-63) scale(0.9)"/>
          <use href="#axi-gill" transform="translate(20,43) rotate(-84) scale(0.84)"/>
          <use href="#axi-gill" transform="translate(41,32) rotate(42) scale(0.84)"/>
          <use href="#axi-gill" transform="translate(44,37) rotate(63) scale(0.9)"/>
          <use href="#axi-gill" transform="translate(44,43) rotate(84) scale(0.84)"/>
        </g>

        <!-- 4. Body — chubby belly, little arms and feet -->
        <!-- Hands (manos) = ydotoold — arm stubs at the body sides, drawn BEHIND the
             body so they merge into the silhouette; only the outer part sticks out
             (still its own click target). Reaching slightly down and out. -->
        <g id="organ-hands" class="organ"
           :class="organClass($store.snap.services['ydotoold'])"
           @click="open = open === 'hands' ? null : 'hands'"
           style="cursor:pointer">
          <g fill="#FFF1F5" stroke="#FFF1F5" stroke-width="2.6" stroke-linejoin="round">
            <ellipse cx="22" cy="53" rx="3" ry="4.3" transform="rotate(32 22 53)"/>
            <ellipse cx="42" cy="53" rx="3" ry="4.3" transform="rotate(-32 42 53)"/>
          </g>
          <ellipse cx="22" cy="53" rx="3" ry="4.3" fill="#FF6B9D" stroke="#241019" stroke-width="0.7" transform="rotate(32 22 53)"/>
          <ellipse cx="42" cy="53" rx="3" ry="4.3" fill="#FF6B9D" stroke="#241019" stroke-width="0.7" transform="rotate(-32 42 53)"/>
        </g>
        <ellipse cx="26" cy="67" rx="3.6" ry="2.7" fill="#FF6B9D" stroke="#241019" stroke-width="0.7"/>
        <ellipse cx="38" cy="67" rx="3.6" ry="2.7" fill="#FF6B9D" stroke="#241019" stroke-width="0.7"/>
        <ellipse cx="32" cy="56" rx="11.5" ry="11.5" fill="#FF6B9D" stroke="#241019" stroke-width="0.7"/>
        <ellipse cx="32" cy="58" rx="7" ry="7.6" fill="#FFC2D6" opacity="0.7" stroke="#241019" stroke-width="0.45"/>

        <!-- 5. Head — broad rounded axolotl head (dark outline delimits it from the body) -->
        <ellipse cx="32" cy="38" rx="16.5" ry="14" fill="#FF6B9D" stroke="#241019" stroke-width="0.7"/>
        <!-- freckles / motas — authentic axolotl speckles -->
        <g fill="#FF4D88" opacity="0.4">
          <circle cx="27" cy="31" r="0.6"/><circle cx="31" cy="29.6" r="0.5"/>
          <circle cx="36" cy="30.6" r="0.6"/><circle cx="24.5" cy="34" r="0.5"/>
          <circle cx="39" cy="33.6" r="0.55"/><circle cx="33.5" cy="32.6" r="0.45"/>
        </g>

        <!-- 6. Blush -->
        <circle cx="20" cy="42" r="2.9" fill="#FF4D88" opacity="0.5"/>
        <circle cx="44" cy="42" r="2.9" fill="#FF4D88" opacity="0.5"/>

        <!-- 7. Heart (on belly — symbolic rounded heart) -->
        <g id="organ-heart" class="organ"
           :class="organClass($store.snap.services['axi-heartbeat'])"
           @click="open = open === 'heart' ? null : 'heart'"
           style="cursor:pointer; transform-origin: 32px 58px">
          <circle cx="29.4" cy="57" r="2.9" fill="#FF4D88"/>
          <circle cx="34.6" cy="57" r="2.9" fill="#FF4D88"/>
          <path d="M26.3 58.2 Q32 64.5 37.7 58.2" fill="#FF4D88"/>
          <circle cx="30.1" cy="56" r="0.95" fill="rgba(255,255,255,0.5)"/>
        </g>

        <!-- 8. Left eye = screen capture -->
        <g id="eye-screen" class="organ eye"
           :class="eyeClass($store.snap.eyes &amp;&amp; $store.snap.eyes.screen)"
           @click="captureEye('screen')"
           style="cursor:pointer; transform-origin: 26px 38px">
          <circle cx="26" cy="38" r="3.4" fill="#14131F"/>
          <circle cx="26.9" cy="37.0" r="1.1" fill="#FFFFFF"/>
        </g>

        <!-- 9. Right eye = webcam -->
        <g id="eye-webcam" class="organ eye"
           :class="eyeClass($store.snap.eyes &amp;&amp; $store.snap.eyes.webcam)"
           @click="captureEye('webcam')"
           style="cursor:pointer; transform-origin: 38px 38px">
          <circle cx="38" cy="38" r="3.4" fill="#14131F"/>
          <circle cx="38.9" cy="37.0" r="1.1" fill="#FFFFFF"/>
        </g>

        <!-- 10. Mouth — wide happy axolotl smile -->
        <g id="organ-mouth" class="organ"
           :class="organClass($store.snap.services['axi-voice'])"
           @click="open = open === 'mouth' ? null : 'mouth'"
           style="cursor:pointer; transform-origin: 32px 44px">
          <path d="M25 43 Q32 49.5 39 43" stroke="#14131F" stroke-width="2.3" stroke-linecap="round" fill="none"/>
        </g>
      </svg>

      <!-- ── Organ popovers ──────────────────────────────────────────── -->

      <!-- Heart popover -->
      <div id="popover-heart" x-show="open === 'heart'" @click.outside="open = null"
           @keydown.escape.window="open = null"
           class="panel2 p-3 text-sm absolute z-50 mt-2"
           style="min-width:180px; display:none">
        <div class="font-semibold mb-1" style="color:var(--pink)">❤ Corazón</div>
        <div class="muted text-xs">Servicio: <span x-text="$store.snap.services['axi-heartbeat']"></span></div>
      </div>

      <!-- Brain popover -->
      <div id="popover-brain" x-show="open === 'brain'" @click.outside="open = null"
           @keydown.escape.window="open = null"
           class="panel2 p-3 text-sm absolute z-50 mt-2"
           style="min-width:220px; display:none">
        <div class="font-semibold mb-1" style="color:var(--teal)">🧠 Cerebro (LLM)</div>
        <div class="muted text-xs">Modelo: <span x-text="$store.snap.models &amp;&amp; $store.snap.models.mode || '—'"></span></div>
        <div class="muted text-xs">VRAM: <span x-text="$store.snap.vram &amp;&amp; ($store.snap.vram.used_mb / 1024).toFixed(1) + ' GB' || '—'"></span> usada</div>
      </div>

      <!-- Ears popover -->
      <div id="popover-ears" x-show="open === 'ears'" @click.outside="open = null"
           @keydown.escape.window="open = null"
           class="panel2 p-3 text-sm absolute z-50 mt-2"
           style="min-width:180px; display:none">
        <div class="font-semibold mb-1" style="color:var(--pink)">👂 Oídos (Whisper)</div>
        <div class="muted text-xs">Servicio: <span x-text="$store.snap.services['axi-whisper']"></span></div>
      </div>

      <!-- Hands popover -->
      <div id="popover-hands" x-show="open === 'hands'" @click.outside="open = null"
           @keydown.escape.window="open = null"
           class="panel2 p-3 text-sm absolute z-50 mt-2"
           style="min-width:180px; display:none">
        <div class="font-semibold mb-1" style="color:var(--pink)">🤚 Manos (ydotoold)</div>
        <div class="muted text-xs">Cómo Axi actúa: inyección de teclas</div>
        <div class="muted text-xs">Servicio: <span x-text="$store.snap.services['ydotoold']"></span></div>
      </div>

      <!-- Mouth popover -->
      <div id="popover-mouth" x-show="open === 'mouth'" @click.outside="open = null"
           @keydown.escape.window="open = null"
           class="panel2 p-3 text-sm absolute z-50 mt-2"
           style="min-width:180px; display:none">
        <div class="font-semibold mb-1" style="color:var(--pink)">💬 Boca (voz)</div>
        <div class="muted text-xs">Servicio: <span x-text="$store.snap.services['axi-voice']"></span></div>
      </div>

      <!-- Eye capture popover (shared for both eyes) -->
      <div id="popover-eye" x-show="open === 'eye-screen' || open === 'eye-webcam'"
           @click.outside="open = null" @keydown.escape.window="open = null"
           class="panel2 p-3 text-sm absolute z-50 mt-2"
           style="min-width:240px; display:none">
        <div class="font-semibold mb-2" style="color:var(--teal)"
             x-text="open === 'eye-webcam' ? '📷 Lo que Axi ve (cámara)' : '🖥 Lo que Axi ve (pantalla)'"></div>
        <div x-show="eyeLoading" class="muted text-xs">Capturando...</div>
        <img x-show="eyeImg" :src="'data:image/png;base64,' + eyeImg"
             alt="Lo que Axi ve ahora" style="max-width:220px; border-radius:0.5rem; margin-top:0.5rem"/>
        <div x-show="eyeImg" class="muted text-xs mt-1">Lo que Axi ve ahora</div>
        <div x-show="eyeError" x-text="eyeError" class="text-xs" style="color:var(--amber)"></div>
      </div>
    </section>

    <!-- ─── quick actions ─── -->
    <section class="panel p-4">
      <div class="text-sm muted mb-3">Acciones rápidas</div>
      <div class="flex flex-wrap gap-2">
        <!-- btn-primary is applied dynamically: highlight only when Axi is in
             an active capture/process state, not as a permanent style. -->
        <button class="btn" :class="{'btn-primary': isBusy()}" @click="cmd('toggle')">🎤 Dictar / detener</button>
        <button class="btn" @click="cmd('ask')">👁 Preguntar con pantalla</button>
        <button class="btn" @click="cmd('look')">📷 Preguntar con cámara</button>
        <template x-if="!$store.snap.meeting.active">
          <button class="btn" @click="cmd('meeting_start')">🎙 Iniciar reunión</button>
        </template>
        <template x-if="$store.snap.meeting.active">
          <button class="btn" @click="cmd('meeting_stop')" style="border-color: var(--red); color: var(--red);">⏹ Detener reunión</button>
        </template>
        <button class="btn ml-auto" @click="cmd('clear')">🧹 Conversación nueva</button>
      </div>
      <template x-if="$store.snap.meeting.active">
        <div class="mt-3 p-3 panel2 text-sm">
          🎙 <strong>Reunión activa</strong> #<span x-text="$store.snap.meeting.id"></span>
          · <span x-text="formatDuration($store.snap.meeting.duration_s)"></span>
          · mic <span x-text="$store.snap.meeting.mic"></span>
          · sys <span x-text="$store.snap.meeting.sys"></span>
          · screens <span x-text="$store.snap.meeting.screens"></span>
        </div>
      </template>
    </section>

    <!-- ─── service health + system stats ─── -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="panel p-4">
        <div class="text-sm muted mb-3">Services</div>
        <div class="space-y-2 text-sm">
          <template x-for="[name, state] in Object.entries($store.snap.services)" :key="name">
            <div class="flex justify-between">
              <span x-text="name"></span>
              <span :style="state === 'active' ? 'color: var(--green)' : 'color: var(--red)'" x-text="state"></span>
            </div>
          </template>
        </div>
      </div>

      <div class="panel p-4">
        <div class="text-sm muted mb-3">VRAM
          <span class="muted text-xs" x-text="$store.snap.vram.name || ''"></span>
        </div>
        <div class="text-3xl font-mono" x-text="$store.snap.vram.util_pct + '%'"></div>
        <div class="text-xs muted mt-1">
          <span x-text="(($store.snap.vram.used_mb / 1024)|0) + '.' + ((($store.snap.vram.used_mb % 1024) * 10 / 1024)|0) + 'G'"></span>
          /
          <span x-text="(($store.snap.vram.total_mb / 1024)|0) + '.' + ((($store.snap.vram.total_mb % 1024) * 10 / 1024)|0) + 'G'"></span>
        </div>
        <div class="h-2 mt-3 rounded-full" style="background: var(--panel2)">
          <div class="h-2 rounded-full transition-all" :style="'width:' + (100 * $store.snap.vram.used_mb / $store.snap.vram.total_mb) + '%; background: var(--pink)'"></div>
        </div>
      </div>

      <div class="panel p-4">
        <div class="text-sm muted mb-3">CPU / RAM</div>
        <div class="text-sm flex justify-between mb-2">
          <span>CPU</span><span class="font-mono" x-text="$store.snap.cpu_pct + '%'"></span>
        </div>
        <div class="h-2 mb-3 rounded-full" style="background: var(--panel2)">
          <div class="h-2 rounded-full" :style="'width:' + $store.snap.cpu_pct + '%; background: var(--blue)'"></div>
        </div>
        <div class="text-sm flex justify-between mb-2">
          <span>RAM</span><span class="font-mono" x-text="$store.snap.ram.pct + '%'"></span>
        </div>
        <div class="h-2 rounded-full" style="background: var(--panel2)">
          <div class="h-2 rounded-full" :style="'width:' + $store.snap.ram.pct + '%; background: var(--green)'"></div>
        </div>
        <div class="text-xs muted mt-2">
          <span x-text="fmtBytes($store.snap.ram.used)"></span> /
          <span x-text="fmtBytes($store.snap.ram.total)"></span>
        </div>
      </div>
    </section>

    <!-- ─── memory: facts + conversations ─── -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <div class="panel p-4">
        <div class="flex justify-between items-baseline mb-3">
          <div class="font-semibold">Hechos en memoria de largo plazo</div>
          <div class="muted text-xs" x-text="$store.snap.memory.facts_count + ' total'"></div>
        </div>
        <template x-if="$store.snap.recent_facts.length === 0">
          <div class="muted text-sm py-4">Aún no se han extraído hechos. Habla con Axi vía Meta+Shift+Espacio y se irán acumulando aquí.</div>
        </template>
        <div class="space-y-2 text-sm max-h-96 overflow-y-auto">
          <template x-for="f in $store.snap.recent_facts" :key="f.id">
            <div class="panel2 p-3">
              <div x-text="f.label"></div>
              <div class="muted text-xs mt-1">
                <span x-text="f.created_human"></span>
                <span x-show="f.domain" class="ml-2">· <span x-text="f.domain"></span></span>
                <span x-show="f.category" class="ml-2">· <span x-text="f.category"></span></span>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="panel p-4">
        <div class="flex justify-between items-baseline mb-3">
          <div class="font-semibold">Conversaciones recientes</div>
          <div class="muted text-xs" x-text="$store.snap.memory.conversation_turns + ' turnos guardados'"></div>
        </div>
        <template x-if="$store.snap.recent_conversations.length === 0">
          <div class="muted text-sm py-4">No hay conversaciones todavía.</div>
        </template>
        <div class="space-y-3 text-sm max-h-96 overflow-y-auto">
          <template x-for="c in $store.snap.recent_conversations" :key="c.id">
            <div class="panel2 p-3">
              <div class="muted text-xs mb-2" x-text="c.ts_human"></div>
              <div class="mb-1"><strong>Héctor:</strong> <span x-text="c.user"></span></div>
              <div><strong style="color: var(--pink)">Axi:</strong> <span x-text="c.axi"></span></div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- ─── daily digest (P1.3) ─── -->
    <section class="panel p-4" x-data="dailyDigest()" x-init="load(); setInterval(load, 5*60*1000)">
      <div class="flex justify-between items-baseline mb-3">
        <div class="font-semibold">Hoy <span class="muted text-xs" x-text="digest?.date || ''"></span></div>
        <div class="muted text-xs">resumen del día</div>
      </div>
      <template x-if="!digest">
        <div class="muted text-sm py-4">Sin datos todavía.</div>
      </template>
      <template x-if="digest">
        <div>
          <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm">
            <div class="panel2 p-3">
              <div class="muted text-xs">Conversaciones</div>
              <div class="text-xl font-mono" x-text="digest.conversations_count"></div>
            </div>
            <div class="panel2 p-3">
              <div class="muted text-xs">Reuniones</div>
              <div class="text-xl font-mono" x-text="digest.meetings_count"></div>
            </div>
            <div class="panel2 p-3">
              <div class="muted text-xs">Hechos nuevos</div>
              <div class="text-xl font-mono" x-text="digest.facts_added_count"></div>
            </div>
            <div class="panel2 p-3">
              <div class="muted text-xs">Errores</div>
              <div class="text-xl font-mono" :style="digest.events_error_count > 0 ? 'color: var(--amber)' : ''" x-text="digest.events_error_count"></div>
            </div>
            <div class="panel2 p-3">
              <div class="muted text-xs">Críticos</div>
              <div class="text-xl font-mono" :style="digest.events_critical_count > 0 ? 'color: var(--red)' : ''" x-text="digest.events_critical_count"></div>
            </div>
          </div>
          <template x-if="digest.generated_summary">
            <div class="md mt-3" x-html="renderMarkdown(digest.generated_summary)"></div>
          </template>
          <template x-if="digest.top_facts && digest.top_facts.length > 0">
            <div class="mt-3 text-sm">
              <div class="muted text-xs mb-1">Hechos de hoy</div>
              <ul class="list-disc ml-5 space-y-0.5">
                <template x-for="f in digest.top_facts" :key="f.id">
                  <li x-text="f.label"></li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </template>
    </section>

    <!-- ─── brain metrics (P0.2) ─── -->
    <section class="panel p-4" x-data="brainMetrics()" x-init="load(); setInterval(load, 15000)">
      <div class="flex justify-between items-baseline mb-3">
        <div class="font-semibold">Llamadas al cerebro (24 h)</div>
        <div class="muted text-xs">latencia p50/p95 · errores</div>
      </div>
      <template x-if="!summary || summary.count === 0">
        <div class="muted text-sm py-4">Aún no hay métricas registradas.</div>
      </template>
      <template x-if="summary && summary.count > 0">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
          <div class="panel2 p-3">
            <div class="muted text-xs">Llamadas</div>
            <div class="text-xl font-mono" x-text="summary.count"></div>
          </div>
          <div class="panel2 p-3">
            <div class="muted text-xs">p50 latencia</div>
            <div class="text-xl font-mono"><span x-text="summary.p50_latency_ms ?? '—'"></span> <span class="muted text-xs">ms</span></div>
          </div>
          <div class="panel2 p-3">
            <div class="muted text-xs">p95 latencia</div>
            <div class="text-xl font-mono"><span x-text="summary.p95_latency_ms ?? '—'"></span> <span class="muted text-xs">ms</span></div>
          </div>
          <div class="panel2 p-3">
            <div class="muted text-xs">Errores</div>
            <div class="text-xl font-mono" :style="summary.errors > 0 ? 'color: var(--red)' : ''" x-text="summary.errors"></div>
          </div>
        </div>
      </template>
      <template x-if="chartPoints">
        <svg class="mt-3 w-full" :viewBox="'0 0 ' + chartW + ' ' + chartH" preserveAspectRatio="none" style="height:60px; background: var(--panel2); border-radius: 6px;">
          <polyline fill="none" stroke="var(--pink)" stroke-width="1.5" :points="chartPoints"></polyline>
        </svg>
      </template>
    </section>

  </div>
</template>

<template x-if="!$store.snap">
  <div class="text-center py-24 muted">
    <div class="text-2xl mb-2">Conectando con el daemon…</div>
    <div class="text-sm">Si esto persiste, revisá <code>systemctl --user status axi-voice</code></div>
  </div>
</template>

<script>
function isBusy() {
  const s = Alpine.store('snap')?.state;
  return ['recording', 'thinking', 'speaking'].includes(s) || s.startsWith('transcribing');
}

function stateLabel(s) {
  if (s.startsWith('transcribing:')) {
    const pct = parseInt(s.split(':')[1], 10);
    return isNaN(pct) ? 'Transcribiendo' : `Transcribiendo ${pct}%`;
  }
  return ({
    idle: 'Inactivo',
    recording: 'Grabando',
    transcribing: 'Transcribiendo',
    thinking: 'Pensando',
    speaking: 'Hablando',
    meeting: 'Reunión activa',
    unknown: 'Sin conexión',
  })[s] || s;
}

function formatDuration(s) {
  if (!s && s !== 0) return '—';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h + 'h ' + m + 'm';
}

function brainMetrics() {
  return {
    summary: null,
    chartPoints: '',
    chartW: 300,
    chartH: 60,
    async load() {
      try {
        const r = await fetch('/api/metrics/brain?limit=100&since_minutes=1440');
        if (!r.ok) return;
        const data = await r.json();
        this.summary = data.summary;
        // Build polyline of last 30 latencies (oldest left → newest right).
        const recent = data.metrics.slice(0, 30).reverse();
        if (recent.length < 2) { this.chartPoints = ''; return; }
        const lats = recent.map(m => m.latency_ms || 0);
        const max = Math.max(...lats, 1);
        const min = Math.min(...lats);
        const range = Math.max(1, max - min);
        const w = this.chartW, h = this.chartH, pad = 4;
        const pts = lats.map((v, i) => {
          const x = pad + (i * (w - 2*pad)) / (lats.length - 1);
          const y = h - pad - ((v - min) * (h - 2*pad)) / range;
          return x.toFixed(1) + ',' + y.toFixed(1);
        });
        this.chartPoints = pts.join(' ');
      } catch (e) {
        // silent — panel just shows "no data"
      }
    }
  };
}

function dailyDigest() {
  return {
    digest: null,
    async load() {
      try {
        const r = await fetch('/api/digest/today');
        if (r.ok) this.digest = await r.json();
      } catch (e) { /* keep last */ }
    }
  };
}

function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B','K','M','G','T'];
  let i = 0;
  while (b > 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(1) + u[i];
}

/* ── Axi avatar widget — organ click + eye live capture ───────────────── */
function avatarWidget() {
  return {
    open: null,
    eyeImg: null,
    eyeLoading: false,
    eyeError: null,

    /* Returns CSS class string for a service organ based on its is-active state. */
    organClass(s) {
      return s === 'active' ? 'organ--alive' : 'organ--still';
    },

    /* Returns CSS class string for an eye organ based on capability availability. */
    eyeClass(avail) {
      return avail ? 'eye eye--alive' : 'eye organ--still';
    },

    /* Capture a live image from webcam or screen — only called on user click,
       NEVER on init or poll. Handles 503 busy/unavailable gracefully. */
    async captureEye(which) {
      this.open = 'eye-' + which;
      this.eyeImg = null;
      this.eyeError = null;
      this.eyeLoading = true;
      const url = which === 'webcam'
        ? '/api/chat/capture-camera'
        : '/api/chat/capture-screen';
      try {
        const r = await fetch(url, { method: 'POST' });
        if (r.status === 503) {
          const d = await r.json().catch(() => ({}));
          const detail = d.error || d.detail || '';
          if (detail.startsWith('busy') || d.busy) {
            this.eyeError = which === 'webcam'
              ? 'La cámara está en uso por otra app'
              : 'La pantalla no está disponible ahora';
          } else if (detail === 'no-device') {
            this.eyeError = 'No se detectó cámara en este equipo';
          } else {
            this.eyeError = 'No pude capturar ahora mismo';
          }
        } else if (r.ok) {
          const data = await r.json();
          this.eyeImg = data.image_b64 || null;
          if (!this.eyeImg) this.eyeError = 'Imagen vacía';
        } else {
          this.eyeError = 'No pude capturar ahora mismo';
        }
      } catch (e) {
        this.eyeError = 'Sin conexión';
      } finally {
        this.eyeLoading = false;
      }
    },
  };
}
</script>
{% endblock %}
