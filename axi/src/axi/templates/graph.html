{% extends "_base.html" %}
{% block nav_graph %}active{% endblock %}
{% block title %}Grafo de memoria · Axi{% endblock %}

{% block content %}
<div class="space-y-4" x-data="graphPage()" x-init="load()">
  <div class="flex justify-between items-baseline">
    <h1 class="text-2xl font-semibold">Grafo de memoria</h1>
    <div class="text-sm muted">
      <span x-text="nodeCount"></span> nodos · <span x-text="edgeCount"></span> relaciones
    </div>
  </div>

  <template x-if="loading">
    <div class="muted py-12 text-center">Cargando grafo…</div>
  </template>

  <template x-if="!loading && nodeCount === 0">
    <div class="panel p-12 text-center">
      <div class="muted">No hay nodos para visualizar aún.</div>
      <div class="text-sm muted mt-2">
        Habla con Axi y los hechos extraídos aparecerán como neuronas conectadas.
      </div>
    </div>
  </template>

  <template x-if="!loading && nodeCount > 0">
    <div class="panel" style="height: 70vh; position: relative;">
      <div id="cy" style="width:100%; height:100%; border-radius: 0.75rem;"></div>
      <div class="absolute top-4 right-4 panel2 p-3 text-xs space-y-1" style="max-width: 200px">
        <div class="muted">Leyenda</div>
        <div class="flex items-center gap-2"><span class="state-dot" style="background:var(--pink)"></span> Fact</div>
        <div class="flex items-center gap-2"><span class="state-dot" style="background:var(--blue)"></span> Person</div>
        <div class="flex items-center gap-2"><span class="state-dot" style="background:var(--amber)"></span> Event</div>
        <div class="flex items-center gap-2"><span class="state-dot" style="background:var(--green)"></span> Otro</div>
      </div>
    </div>
  </template>

  <template x-if="selectedNode">
    <div class="panel p-4 text-sm">
      <div class="font-semibold" x-text="selectedNode.label"></div>
      <div class="muted text-xs mt-1">
        <span x-text="selectedNode.kind"></span>
        <span x-show="selectedNode.domain && selectedNode.domain !== '—'">
          · <span x-text="selectedNode.domain"></span>
        </span>
      </div>
    </div>
  </template>
</div>

<script src="/static/vendor/cytoscape.min.js"></script>
<script>
function graphPage() {
  return {
    loading: true,
    nodeCount: 0,
    edgeCount: 0,
    cy: null,
    selectedNode: null,
    async load() {
      const r = await fetch('/api/graph');
      const data = r.ok ? await r.json() : { nodes: [], edges: [] };
      this.nodeCount = data.nodes.length;
      this.edgeCount = data.edges.length;
      this.loading = false;
      if (data.nodes.length === 0) return;
      this.$nextTick(() => this.render(data));
    },
    render(data) {
      const KIND_COLOR = {
        fact: '#FF6B9D', person: '#33aaff',
        event: '#ffaa33', medication: '#22cc55',
        symptom: '#ee3333', bp_reading: '#33aaff',
      };
      this.cy = cytoscape({
        container: document.getElementById('cy'),
        elements: { nodes: data.nodes, edges: data.edges },
        style: [
          { selector: 'node', style: {
            'background-color': ele => KIND_COLOR[ele.data('kind')] || '#22cc55',
            'label': 'data(label)',
            'color': '#e6edf3',
            'font-size': '10px',
            'text-valign': 'bottom',
            'text-margin-y': 6,
            'width': 22, 'height': 22,
          }},
          { selector: 'edge', style: {
            'line-color': '#3a3f47',
            'target-arrow-color': '#3a3f47',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'width': 1,
            'label': 'data(kind)',
            'font-size': '8px',
            'color': '#7a8593',
            'text-rotation': 'autorotate',
          }},
        ],
        layout: { name: 'cose', animate: false, padding: 30 },
      });
      this.cy.on('tap', 'node', (e) => {
        this.selectedNode = e.target.data();
      });
    },
  };
}
</script>
{% endblock %}
