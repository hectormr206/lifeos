{% extends "_base.html" %}
{% block nav_reminders %}active{% endblock %}
{% block title %}Recordatorios · Axi{% endblock %}

{% block content %}
<div class="space-y-4" x-data="remindersPage()" x-init="load(); init(); startPolling()" x-destroy="stopPolling()">
  <div class="flex justify-between items-baseline gap-4 flex-wrap">
    <h1 class="text-2xl font-semibold">Recordatorios</h1>
    <div class="flex gap-2 items-center text-sm">
      <button class="btn" @click="enablePush()" x-show="!pushOn" x-cloak>📱 Habilitar push</button>
      <button class="btn" @click="testPush()" x-show="pushOn" x-cloak>📱 Probar push</button>
      <button class="btn" @click="diagnose()" title="Estado de push en este navegador">🔍 Diagnóstico</button>
      <button class="btn" @click="resetSW()" title="Desregistra el SW para forzar reinstalación">♻️ Reset SW</button>
      <select x-model="filter" @change="load()" class="panel2 px-3 py-2 text-sm">
        <option value="pending">Pendientes</option>
        <option value="recent">Recientes (30 días)</option>
      </select>
      <button class="btn" @click="load()">Refrescar</button>
    </div>
  </div>
  <div x-show="pushStatus" x-cloak class="text-sm muted" x-text="pushStatus"></div>

  <!-- Compose (Google Calendar-style) -->
  <div class="panel p-4 space-y-3">
    <h2 class="text-sm font-semibold muted uppercase tracking-wider">Nuevo recordatorio</h2>

    <input type="text" x-model="form.message" placeholder="Mensaje (ej: llamar al dentista)"
           class="panel2 px-3 py-2 text-sm w-full" maxlength="500">

    <div class="flex items-center gap-2 text-sm flex-wrap">
      <span>🕐</span>
      <input type="datetime-local" x-model="form.when_local"
             class="panel2 px-3 py-2 text-sm">
    </div>

    <div class="flex items-center gap-2 text-sm flex-wrap">
      <span>🔁</span>
      <select x-model="form.repeat_choice" @change="onRepeatChange()"
              class="panel2 px-3 py-2 text-sm">
        <option value="none">No se repite</option>
        <option value="daily">Todos los días</option>
        <option value="weekly_same">Cada semana, este día</option>
        <option value="weekdays">Días hábiles (L–V)</option>
        <option value="monthly_day">Mensualmente, este día del mes</option>
        <option value="yearly">Anualmente, esta fecha</option>
        <option value="custom">Personalizada…</option>
      </select>
      <span x-show="form.repeat_choice !== 'none' && form.repeat_choice !== 'custom'"
            x-text="endsSummary()" x-cloak class="text-xs muted"></span>
      <button x-show="form.repeat_choice !== 'none' && form.repeat_choice !== 'custom'"
              @click="openEndsModal = true"
              x-cloak class="text-xs panel2 px-2 py-1 rounded">
        Finalización…
      </button>
    </div>

    <div class="flex items-center justify-between text-sm flex-wrap gap-2">
      <select x-model="form.channel" class="panel2 px-3 py-2 text-sm">
        <option value="push">📱 Push (laptop + Pixel)</option>
        <option value="log">📝 Solo log (test)</option>
      </select>
      <button class="btn btn-primary" @click="create()"
              :disabled="!form.message || !form.when_local">
        Programar
      </button>
    </div>
    <div x-show="error" x-text="error" x-cloak class="text-sm" style="color: var(--red)"></div>
  </div>

  <!-- Custom recurrence modal -->
  <div x-show="openCustomModal" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center"
       style="background: rgba(0,0,0,0.7);"
       @keydown.escape.window="openCustomModal = false">
    <div class="panel p-6 w-full max-w-md mx-4 space-y-4">
      <h3 class="text-lg font-semibold">Recurrencia personalizada</h3>

      <div class="flex items-center gap-2 text-sm">
        <span class="muted">Repetir cada</span>
        <input type="number" min="1" max="99" x-model.number="custom.interval"
               class="panel2 px-3 py-2 w-20 text-sm">
        <select x-model="custom.unit" class="panel2 px-3 py-2 text-sm">
          <option value="day">día(s)</option>
          <option value="week">semana(s)</option>
          <option value="month">mes(es)</option>
          <option value="year">año(s)</option>
        </select>
      </div>

      <div x-show="custom.unit === 'week'" x-cloak class="space-y-2">
        <div class="text-sm muted">Repetir el</div>
        <div class="flex gap-2 flex-wrap">
          <template x-for="(label, idx) in ['L','M','X','J','V','S','D']" :key="idx">
            <button @click="toggleWeekday(idx)"
                    :class="custom.weekdays.includes(idx) ? 'btn-primary' : ''"
                    class="btn-sm w-9 h-9 rounded-full panel2 text-xs"
                    x-text="label"></button>
          </template>
        </div>
      </div>

      <div class="space-y-2">
        <div class="text-sm muted">Finaliza</div>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" value="never" x-model="custom.ends">
          Nunca
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" value="date" x-model="custom.ends">
          El
          <input type="date" x-model="custom.ends_date"
                 :disabled="custom.ends !== 'date'"
                 class="panel2 px-2 py-1 text-sm">
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" value="count" x-model="custom.ends">
          Después de
          <input type="number" min="1" max="999" x-model.number="custom.ends_count"
                 :disabled="custom.ends !== 'count'"
                 class="panel2 px-2 py-1 w-20 text-sm">
          <span class="muted">ocurrencias</span>
        </label>
      </div>

      <div class="flex justify-end gap-2">
        <button @click="openCustomModal = false" class="btn">Cancelar</button>
        <button @click="applyCustomRecurrence()" class="btn btn-primary">Listo</button>
      </div>
    </div>
  </div>

  <!-- End conditions modal (for non-custom presets) -->
  <div x-show="openEndsModal" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center"
       style="background: rgba(0,0,0,0.7);"
       @keydown.escape.window="openEndsModal = false">
    <div class="panel p-6 w-full max-w-md mx-4 space-y-4">
      <h3 class="text-lg font-semibold">Finalización</h3>
      <div class="space-y-2">
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" value="never" x-model="custom.ends">
          Nunca
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" value="date" x-model="custom.ends">
          El
          <input type="date" x-model="custom.ends_date"
                 :disabled="custom.ends !== 'date'"
                 class="panel2 px-2 py-1 text-sm">
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" value="count" x-model="custom.ends">
          Después de
          <input type="number" min="1" max="999" x-model.number="custom.ends_count"
                 :disabled="custom.ends !== 'count'"
                 class="panel2 px-2 py-1 w-20 text-sm">
          <span class="muted">ocurrencias</span>
        </label>
      </div>
      <div class="flex justify-end gap-2">
        <button @click="openEndsModal = false" class="btn">Cancelar</button>
        <button @click="openEndsModal = false" class="btn btn-primary">Listo</button>
      </div>
    </div>
  </div>

  <!-- List -->
  <template x-if="loading">
    <div class="muted py-12 text-center">Cargando…</div>
  </template>
  <template x-if="!loading && rows.length === 0">
    <div class="panel p-12 text-center muted">
      Nada programado. Decile a Axi en el chat: "recordame llamar al dentista mañana a las 9".
    </div>
  </template>

  <div class="grid gap-2" x-show="rows.length > 0">
    <template x-for="r in rows" :key="r.id">
      <div class="panel p-3 flex items-start gap-3">
        <span class="text-xs px-2 py-0.5 rounded-full panel2 uppercase tracking-wider"
              :style="statusStyle(r.status)"
              x-text="r.status"></span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium" x-text="r.message"></div>
          <div class="text-xs muted mt-1">
            <span x-text="fmtWhen(r.when_ts)"></span>
            <span class="mx-1">·</span>
            <span x-text="r.channel"></span>
            <template x-if="r.recurrence">
              <span class="ml-1 px-1.5 py-0.5 panel2 rounded" x-text="'🔁 ' + cronLabel(r.recurrence)"></span>
            </template>
            <template x-if="r.last_fired_at">
              <span class="ml-2 muted" x-text="'última: ' + fmtWhen(r.last_fired_at)"></span>
            </template>
            <template x-if="r.error">
              <span class="ml-2" style="color: var(--red)" x-text="'error: ' + r.error"></span>
            </template>
          </div>
        </div>
        <button x-show="r.status === 'pending'"
                @click="cancel(r.id)"
                class="text-xs panel2 px-2 py-1 rounded hover:brightness-110">
          Cancelar
        </button>
      </div>
    </template>
  </div>
</div>

<script>
function urlBase64ToUint8Array(b64) {
  const padding = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
  return out;
}

function remindersPage() {
  return {
    rows: [],
    filter: 'pending',
    loading: true,
    error: '',
    pushOn: false,
    pushStatus: '',
    form: { message: '', when_local: '', channel: 'push', repeat_choice: 'none' },
    openCustomModal: false,
    openEndsModal: false,
    custom: {
      interval: 1, unit: 'week',
      weekdays: [],       // 0=Monday..6=Sunday  (consistent with JS Date.getDay() - 1)
      ends: 'never',      // 'never' | 'date' | 'count'
      ends_date: '',
      ends_count: 13,
    },
    onRepeatChange() {
      if (this.form.repeat_choice === 'custom') {
        // Pre-seed the modal with the weekday of when_local if any
        if (this.form.when_local) {
          const d = new Date(this.form.when_local);
          if (!isNaN(d)) {
            const wd = (d.getDay() + 6) % 7;  // Mon=0..Sun=6 (our convention)
            this.custom.weekdays = [wd];
          }
        }
        this.openCustomModal = true;
      }
    },
    toggleWeekday(idx) {
      const i = this.custom.weekdays.indexOf(idx);
      if (i === -1) this.custom.weekdays.push(idx);
      else this.custom.weekdays.splice(i, 1);
    },
    applyCustomRecurrence() {
      this.openCustomModal = false;
      // `repeat_choice = 'custom'` — actual cron is computed at submit
    },
    endsSummary() {
      if (this.custom.ends === 'never') return '';
      if (this.custom.ends === 'date') return 'hasta ' + (this.custom.ends_date || '?');
      if (this.custom.ends === 'count') return this.custom.ends_count + ' veces';
      return '';
    },
    // Build the cron string from the picked preset + the user's when_local
    // (we always honor the chosen time-of-day from the datetime input).
    buildRecurrence() {
      const dt = new Date(this.form.when_local);
      if (isNaN(dt.getTime())) return null;
      const HH = dt.getHours();
      const MM = dt.getMinutes();
      const dayOfMonth = dt.getDate();
      const month = dt.getMonth() + 1;
      // JS getDay: Sun=0..Sat=6. Cron: Sun=0..Sat=6 too. Map our internal
      // "Mon=0..Sun=6" weekday index for the custom picker as well.
      const cronWd = dt.getDay();   // Sun=0, Mon=1, ..., Sat=6 (cron compatible)

      switch (this.form.repeat_choice) {
        case 'none':
          return null;
        case 'daily':
          return `${MM} ${HH} * * *`;
        case 'weekly_same':
          return `${MM} ${HH} * * ${cronWd}`;
        case 'weekdays':
          return `${MM} ${HH} * * 1-5`;
        case 'monthly_day':
          return `${MM} ${HH} ${dayOfMonth} * *`;
        case 'yearly':
          return `${MM} ${HH} ${dayOfMonth} ${month} *`;
        case 'custom': {
          if (this.custom.unit === 'day') {
            return `${MM} ${HH} * * *`;
          }
          if (this.custom.unit === 'week') {
            const wds = this.custom.weekdays;
            if (wds.length === 0) return null;
            // Our picker: Mon=0..Sun=6. Cron: Sun=0..Sat=6.
            const cronList = wds.map(i => (i === 6 ? 0 : i + 1)).sort((a,b)=>a-b).join(',');
            return `${MM} ${HH} * * ${cronList}`;
          }
          if (this.custom.unit === 'month') {
            return `${MM} ${HH} ${dayOfMonth} * *`;
          }
          if (this.custom.unit === 'year') {
            return `${MM} ${HH} ${dayOfMonth} ${month} *`;
          }
          return null;
        }
        default:
          return null;
      }
    },
    buildEnds() {
      // Only meaningful when a recurrence is set
      if (this.custom.ends === 'date' && this.custom.ends_date) {
        // 23:59:59 local of that date → ISO
        const d = new Date(this.custom.ends_date + 'T23:59:59');
        if (!isNaN(d.getTime())) return { ends_at: d.toISOString(), occurrences_left: null };
      }
      if (this.custom.ends === 'count' && this.custom.ends_count > 0) {
        return { ends_at: null, occurrences_left: this.custom.ends_count };
      }
      return { ends_at: null, occurrences_left: null };
    },
    _pollHandle: null,
    async init() {
      this.pushOn = await this.checkPushSubscribed();
    },
    startPolling() {
      // Refresh the list every 5s so fired/cancelled reminders disappear
      // (or move to "recent") and freshly-created ones appear without a
      // manual refresh. Cheap: just one small JSON query.
      this.stopPolling();
      this._pollHandle = setInterval(() => this.load(true), 5000);
      // Pause polling when the page is hidden to save resources.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) this.stopPolling();
        else this.startPolling();
      });
    },
    stopPolling() {
      if (this._pollHandle) { clearInterval(this._pollHandle); this._pollHandle = null; }
    },
    async checkPushSubscribed() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        return !!sub;
      } catch (e) { return false; }
    },
    withTimeout(p, ms, label) {
      return Promise.race([
        p,
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout (' + label + ' tardó >' + ms + 'ms)')), ms))
      ]);
    },
    async enablePush() {
      this.pushStatus = '';
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          this.pushStatus = 'Tu navegador no soporta Web Push.'; return;
        }
        if (Notification.permission === 'denied') {
          this.pushStatus = 'Permiso bloqueado. Activalo desde Ajustes del navegador para este sitio.'; return;
        }
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { this.pushStatus = 'Permiso denegado.'; return; }

        // Force re-register with cache-bust so a stale sw.js gets replaced.
        // We do NOT await reg.update() (hangs on Android Chrome when the old
        // sw still controls a client). We register fresh and pick the active.
        this.pushStatus = 'Registrando service worker…';
        const reg = await this.withTimeout(
          navigator.serviceWorker.register('/sw.js?v=' + Date.now(), { scope: '/' }),
          5000, 'register'
        );

        // Wait briefly for an active worker; fall back to installing/waiting.
        this.pushStatus = 'Esperando que el SW se active…';
        const swReady = await this.withTimeout(
          new Promise(resolve => {
            if (reg.active) return resolve(reg.active);
            const candidate = reg.installing || reg.waiting;
            if (candidate) {
              candidate.addEventListener('statechange', () => {
                if (candidate.state === 'activated') resolve(candidate);
              });
            }
            // Also race against the global "ready" promise
            navigator.serviceWorker.ready.then(r => r.active && resolve(r.active));
          }),
          8000, 'activate'
        ).catch(() => null);
        if (!swReady) {
          this.pushStatus = 'El service worker no terminó de activarse. Probá desinstalar la PWA y reinstalar.';
          return;
        }

        this.pushStatus = 'Obteniendo clave VAPID…';
        const keyResp = await this.withTimeout(fetch('/api/push/vapid-public-key'), 5000, 'vapid-key');
        if (!keyResp.ok) throw new Error('VAPID key fetch: ' + keyResp.status);
        const { public_key } = await keyResp.json();

        this.pushStatus = 'Suscribiendo al PushManager…';
        // Use the active registration we just obtained — NOT serviceWorker.ready
        // because that can resolve to the stale one.
        let sub;
        try {
          sub = await this.withTimeout(
            reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(public_key),
            }),
            15000, 'pushManager.subscribe'
          );
        } catch (e) {
          this.pushStatus = 'pushManager.subscribe falló: ' + (e.message || e.name || String(e));
          return;
        }

        this.pushStatus = 'Registrando suscripción en el servidor…';
        const r = await this.withTimeout(fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub.toJSON()),
        }), 5000, 'subscribe POST');
        if (r.ok) {
          this.pushOn = true;
          this.pushStatus = 'Push habilitado ✓';
        } else {
          const txt = await r.text();
          this.pushStatus = 'Servidor rechazó la suscripción (' + r.status + '): ' + txt;
        }
      } catch (e) {
        this.pushStatus = 'Error: ' + (e.message || String(e));
      }
    },
    async resetSW() {
      this.pushStatus = 'Reseteando service worker…';
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) {
          await r.unregister();
        }
        this.pushStatus = 'SW desregistrado. Cerrá la PWA, reabrila, y volvé a tocar "Habilitar push".';
        this.pushOn = false;
      } catch (e) {
        this.pushStatus = 'Error al resetear: ' + (e.message || e);
      }
    },
    async diagnose() {
      const lines = [];
      lines.push('sw support: ' + ('serviceWorker' in navigator));
      lines.push('PushManager: ' + ('PushManager' in window));
      lines.push('Notification.permission: ' + (typeof Notification !== 'undefined' ? Notification.permission : 'n/a'));
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        lines.push('sw registered: ' + !!reg);
        if (reg) {
          lines.push('sw scope: ' + reg.scope);
          lines.push('sw scriptURL: ' + (reg.active ? reg.active.scriptURL : '(no active)'));
          const sub = await reg.pushManager.getSubscription();
          lines.push('local subscription: ' + (sub ? 'YES (' + sub.endpoint.substring(0,60) + '…)' : 'NO'));
        }
      }
      this.pushStatus = lines.join(' | ');
    },
    async testPush() {
      const r = await fetch('/api/push/test', { method: 'POST' });
      const j = await r.json();
      this.pushStatus = `enviadas=${j.sent} falladas=${j.failed} expiradas=${j.gone}`;
    },
    async load(silent = false) {
      if (!silent && this.rows.length === 0) this.loading = true;
      try {
        const r = await fetch('/api/reminders?status=' + this.filter);
        if (r.ok) {
          const data = await r.json();
          this.rows = data.reminders || [];
        }
      } catch (e) { /* network blip — keep showing existing rows */ }
      this.loading = false;
    },
    async create() {
      this.error = '';
      const localDt = new Date(this.form.when_local);
      if (isNaN(localDt.getTime())) {
        this.error = 'Fecha inválida';
        return;
      }
      const recurrence = this.buildRecurrence();
      const ends = recurrence ? this.buildEnds() : { ends_at: null, occurrences_left: null };

      const body = {
        when: localDt.toISOString(),
        message: this.form.message,
        channel: this.form.channel,
        recurrence: recurrence,
        ends_at: ends.ends_at,
        occurrences_left: ends.occurrences_left,
      };
      const r = await fetch('/api/reminders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        const t = await r.text();
        this.error = 'No se pudo programar: ' + t;
        return;
      }
      // Reset form
      this.form.message = '';
      this.form.when_local = '';
      this.form.repeat_choice = 'none';
      this.custom = { interval: 1, unit: 'week', weekdays: [],
                      ends: 'never', ends_date: '', ends_count: 13 };
      this.load();
    },
    async cancel(id) {
      await fetch('/api/reminders/' + id, { method: 'DELETE' });
      this.load();
    },
    cronLabel(cron) {
      const known = {
        '0 9 * * *': 'diario 9:00',
        '0 21 * * *': 'diario 21:00',
        '0 9 * * 1': 'lunes 9:00',
        '0 8 * * 1-5': 'L-V 8:00',
        '0 * * * *': 'cada hora',
        '*/30 * * * *': 'cada 30min',
        '*/15 * * * *': 'cada 15min',
        '* * * * *': 'cada minuto',
      };
      return known[cron] || cron;
    },
    fmtWhen(iso) {
      try {
        return new Date(iso).toLocaleString('es-MX', {
          weekday: 'short', day: 'numeric', month: 'short',
          hour: '2-digit', minute: '2-digit',
        });
      } catch (e) { return iso; }
    },
    statusStyle(s) {
      const colors = {
        pending: 'color: var(--blue); border-color: var(--blue);',
        fired: 'color: var(--green); border-color: var(--green);',
        cancelled: 'color: var(--muted); border-color: var(--border);',
        failed: 'color: white; background: var(--red); border-color: var(--red);',
      };
      return colors[s] || '';
    },
  };
}
</script>
{% endblock %}
