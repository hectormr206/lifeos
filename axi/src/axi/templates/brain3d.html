{% extends "_base.html" %}
{% block title %}Cerebro 3D · Axi{% endblock %}

{% block content %}
<!-- When this page is loaded inside the dashboard's brain modal iframe, the
     modal already provides its own header ("🧠 Cerebro 3D · Cerrar"), so the
     global nav header from _base.html (LifeOS logo, clock, VRAM, menu) is
     redundant and looks like a nested/duplicated header. Hide it when embedded.
     Standalone navigation to /brain3d still shows the full nav. -->
<style>html.embedded body > header { display: none !important; }</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<div class="space-y-4" x-data="brain3dPage()" x-init="load()">

  <!-- ─── header ─── -->
  <div class="flex justify-between items-center flex-wrap gap-2">
    <h1 class="text-2xl font-semibold" x-text="tUi('title')"></h1>

    <!-- ─── search box (Stage 1: knowledge browser) ─── -->
    <div id="graph-search" class="relative flex-1" style="max-width: 340px; min-width: 200px;"
         @click.outside="searchResults = []">
      <input type="search" x-model="searchQuery" @input="searchInput()"
             @keydown.escape="searchResults = []; searchQuery = ''"
             :placeholder="tUi('searchPlaceholder')" autocomplete="off"
             class="w-full px-3 py-1.5 text-sm rounded-lg"
             style="background: var(--panel2); border: 1px solid var(--border, #2a3040); color: inherit; outline: none;">
      <!-- results dropdown -->
      <div x-show="searchResults.length > 0" x-cloak
           class="absolute w-full mt-1 panel2 rounded-lg overflow-hidden"
           style="z-index: 50; max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.45);">
        <template x-for="r in searchResults" :key="r.id">
          <button type="button" @click="selectSearchResult(r)"
                  class="w-full text-left px-3 py-2 text-sm flex items-center justify-between gap-2 hover:opacity-80"
                  style="background: transparent; border: 0; color: inherit; cursor: pointer;">
            <span class="flex items-center gap-1 min-w-0">
              <span x-text="r.label" class="truncate"></span>
              <!-- matched via an alias (not the label): show it muted, e.g. "(Ani)" -->
              <template x-if="r.alias">
                <span class="text-xs muted flex-shrink-0" x-text="'(' + r.alias + ')'"></span>
              </template>
            </span>
            <span class="flex items-center gap-1 flex-shrink-0">
              <!-- server-only hit: not in the loaded scene; clicking fetches its neighborhood -->
              <template x-if="r.remote">
                <span class="text-xs px-1.5 py-0.5 rounded-full muted"
                      style="border: 1px dashed var(--border, #2a3040);"
                      x-text="tUi('notLoaded')"></span>
              </template>
              <span class="text-xs px-1.5 py-0.5 rounded-full"
                    style="background: var(--panel); opacity: .8;" x-text="tLabel(r.kind)"></span>
            </span>
          </button>
        </template>
      </div>
    </div>

    <div class="flex items-center gap-3 text-sm">
      <!-- focus-mode chip: "Enfocado en: <label> ✕" -->
      <template x-if="focusId !== null">
        <button type="button" @click="clearFocus()"
                class="text-xs px-2 py-1 rounded-full flex items-center gap-1"
                style="background: var(--panel2); color: var(--teal, #00D4AA); border: 1px solid var(--teal, #00D4AA); cursor: pointer;">
          <span x-text="tUi('focusedOn') + ' ' + focusLabel"></span>
          <span aria-hidden="true">✕</span>
        </button>
      </template>
      <span class="muted" x-text="nodeCount + ' ' + tUi('nodes') + ' · ' + edgeCount + ' ' + tUi('relations')"></span>
      <!-- Partial indicator: cross-domain edges temporarily unavailable -->
      <template x-if="partial">
        <span class="text-xs px-2 py-0.5 rounded-full" style="background:var(--panel2);color:var(--amber)">
          ⚠ Solo red local (conexiones entre dominios no disponibles)
        </span>
      </template>
    </div>
  </div>

  <!-- ─── filters bar: novedades quick-view + date presets ─── -->
  <template x-if="!loading && nodeCount > 0">
    <div class="flex items-center gap-3 flex-wrap text-sm">
      <!-- "Novedades de la semana" — the pulse of your memory -->
      <button type="button" id="new-week-btn" @click="openNewThisWeek()"
              class="px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5"
              style="background: var(--teal, #00D4AA); color:#06251f; border:0; cursor:pointer;">
        <span aria-hidden="true">✨</span>
        <span x-text="tUi('newThisWeek')"></span>
      </button>
      <!-- date presets (client-side, combines with domain filters via AND) -->
      <div class="flex items-center gap-1 flex-wrap">
        <span class="muted text-xs" x-text="tUi('date') + ':'"></span>
        <template x-for="opt in datePresets" :key="opt.k">
          <button type="button" @click="setDateFilter(opt.k)"
                  class="text-xs px-2 py-1 rounded-full"
                  :style="dateFilter === opt.k
                    ? 'background: var(--teal, #00D4AA); color:#06251f; border:0; cursor:pointer;'
                    : 'background: var(--panel2); color:inherit; border:1px solid var(--border,#2a3040); cursor:pointer;'"
                  x-text="tUi(opt.label)"></button>
        </template>
      </div>
    </div>
  </template>

  <!-- ─── loading state ─── -->
  <template x-if="loading">
    <div class="panel p-12 text-center">
      <div class="muted" x-text="tUi('loading')"></div>
      <div class="muted text-xs mt-2" x-text="tUi('loadingSub')"></div>
    </div>
  </template>

  <!-- ─── empty state ─── -->
  <template x-if="!loading && nodeCount === 0">
    <div class="panel p-12 text-center">
      <div class="muted text-lg" x-text="tUi('empty')"></div>
      <div class="text-sm muted mt-2" x-text="tUi('emptyHint')"></div>
    </div>
  </template>

  <!-- ─── main layout: 3D canvas + sidebar ─── -->
  <template x-if="!loading && nodeCount > 0">
    <div class="flex gap-4" style="height: 75vh; min-height: 400px;">

      <!-- 3D graph canvas -->
      <div class="flex-1 panel" style="position:relative; overflow:hidden; border-radius:0.75rem;">
        <div id="brain3d-graph" style="width:100%; height:100%;"></div>

        <!-- Legend overlay — each row is an INTERACTIVE domain toggle. -->
        <div class="absolute top-3 left-3 panel2 p-2 text-xs space-y-1" style="max-width:170px; border-radius:0.5rem;">
          <div class="flex items-center justify-between mb-1">
            <span class="muted font-semibold" x-text="tUi('domainLegend')"></span>
            <button type="button" @click="resetFilters()"
                    class="text-xs px-1.5 py-0.5 rounded"
                    style="background:var(--panel);border:0;color:inherit;cursor:pointer;"
                    x-text="tUi('filterAll')"></button>
          </div>
          <template x-for="[domain, color] in Object.entries(DOMAIN_COLOR)" :key="domain">
            <button type="button" @click="toggleDomain(domain)"
                    class="flex items-center gap-2 w-full text-left"
                    style="background:transparent;border:0;color:inherit;cursor:pointer;padding:0;"
                    :style="hiddenDomains[domain] ? 'opacity:0.35' : 'opacity:1'"
                    :aria-pressed="!hiddenDomains[domain]">
              <span style="width:10px;height:10px;border-radius:50%;flex-shrink:0;"
                    :style="'background:' + (hiddenDomains[domain] ? 'transparent' : color) + ';border:1px solid ' + color"></span>
              <span x-text="tLabel(domain)"></span>
              <span class="ml-auto" x-show="hiddenDomains[domain]" aria-hidden="true">✕</span>
            </button>
          </template>
          <!-- In focus mode the palette is overridden by relevance, so hint it. -->
          <template x-if="focusId !== null">
            <div class="muted pt-1 mt-1" style="border-top:1px solid var(--border,#2a3040)"
                 x-text="tUi('focusHint')"></div>
          </template>
        </div>

        <!-- Instructions hint -->
        <div class="absolute bottom-3 left-3 muted text-xs panel2 p-1.5" style="border-radius:0.5rem; opacity:0.8;"
             x-text="tUi('controls')"></div>
      </div>

      <!-- ─── node sidebar ─── -->
      <div id="node-sidebar" class="panel p-4 text-sm flex-shrink-0"
           style="width: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem;">

        <template x-if="!selectedNode">
          <div class="muted text-center py-8">
            <div style="font-size:2rem">🧠</div>
            <div class="mt-2" x-text="tUi('clickNode')"></div>
          </div>
        </template>

        <template x-if="selectedNode">
          <div>
            <!-- Node header -->
            <div class="font-semibold text-base mb-1" x-text="selectedNode.label"></div>
            <div class="flex flex-wrap gap-1 mb-2">
              <span class="text-xs px-2 py-0.5 rounded-full"
                    style="background: var(--panel2);" x-text="tLabel(selectedNode.kind)"></span>
              <template x-if="selectedNode.domain">
                <span class="text-xs px-2 py-0.5 rounded-full"
                      style="background: var(--panel2);" x-text="tLabel(selectedNode.domain)"></span>
              </template>
            </div>
            <div class="muted text-xs space-y-0.5">
              <div x-show="detail && detail.node && detail.node.created_at">
                <span class="font-medium" x-text="tUi('createdLabel') + ':'"></span>
                <span x-text="detail && detail.node ? fmtDate(detail.node.created_at) : ''"></span>
              </div>
              <div x-show="selectedNode.occurred_at != null">
                <span class="font-medium" x-text="tUi('date') + ':'"></span>
                <span x-text="selectedNode.occurred_at ? fmtDate(selectedNode.occurred_at) : '—'"></span>
              </div>
            </div>

            <template x-if="detailLoading">
              <div class="muted text-xs mt-3" x-text="tUi('loadingDetail')"></div>
            </template>

            <template x-if="!detailLoading && detail">
              <div>
                <!-- ─── RELACIONES: typed human edges ─── -->
                <template x-if="detail.relations.length > 0">
                  <div class="mt-4">
                    <div class="font-semibold text-xs muted mb-2">
                      <span x-text="tUi('relationsTitle')"></span> (<span x-text="detail.relations.length"></span>)
                    </div>
                    <div class="space-y-1.5 max-h-48 overflow-y-auto">
                      <template x-for="(rel, i) in detail.relations" :key="i">
                        <div class="relation-row panel2 p-2 text-xs rounded flex items-start justify-between gap-2">
                          <!-- human-readable direction: "Héctor —primo→ Rodrigo" -->
                          <template x-if="rel.direction === 'out'">
                            <span>
                              <span x-text="selectedNode.label"></span>
                              <span class="muted" x-text="' —' + tEdge(rel.kind).replace(/_/g, ' ') + '→ '"></span>
                              <a href="#" @click.prevent="navigateTo(rel.other_id)"
                                 class="font-medium" style="color: var(--teal, #00D4AA); text-decoration: underline;"
                                 x-text="rel.other_label"></a>
                            </span>
                          </template>
                          <template x-if="rel.direction === 'in'">
                            <span>
                              <a href="#" @click.prevent="navigateTo(rel.other_id)"
                                 class="font-medium" style="color: var(--teal, #00D4AA); text-decoration: underline;"
                                 x-text="rel.other_label"></a>
                              <span class="muted" x-text="' —' + tEdge(rel.kind).replace(/_/g, ' ') + '→ '"></span>
                              <span x-text="selectedNode.label"></span>
                            </span>
                          </template>
                          <!-- forget this relationship (edge): low-stakes, rides the undo window (no confirm) -->
                          <template x-if="rel.edge_id != null">
                            <button type="button" class="forget-relation-btn flex-shrink-0"
                                    @click="forgetRelation(rel)"
                                    :title="tUi('forgetRelation')" :aria-label="tUi('forgetRelation')"
                                    style="background:transparent; border:0; color:var(--muted,#888); cursor:pointer; line-height:1; padding:0 2px; opacity:.7;"
                                    aria-hidden="false">✕</button>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- ─── HECHOS: connected fact nodes ─── -->
                <template x-if="detail.facts.length > 0">
                  <div class="mt-4">
                    <div class="font-semibold text-xs muted mb-2">
                      <span x-text="tUi('factsTitle')"></span> (<span x-text="detail.facts.length"></span>)
                    </div>
                    <div class="space-y-1.5 max-h-48 overflow-y-auto">
                      <template x-for="f in detail.facts" :key="f.id">
                        <div class="panel2 p-2 text-xs rounded">
                          <div x-text="f.label"></div>
                          <div class="muted mt-0.5" x-text="f.created_at ? fmtDate(f.created_at) : ''"></div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- ─── PROCEDENCIA: conversation snippets ─── -->
                <template x-if="detail.conversations.length > 0">
                  <div class="mt-4">
                    <div class="font-semibold text-xs muted mb-2" x-text="tUi('provenanceTitle')"></div>
                    <div class="space-y-1.5 max-h-40 overflow-y-auto">
                      <template x-for="cv in detail.conversations" :key="cv.id">
                        <div class="panel2 p-2 text-xs rounded">
                          <div class="italic" x-text="'“' + cv.user_text_snippet + '”'"></div>
                          <div class="muted mt-0.5" x-text="cv.ts ? fmtDate(cv.ts) : ''"></div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <template x-if="detail.relations.length === 0 && detail.facts.length === 0 && detail.conversations.length === 0">
                  <div class="muted text-xs mt-3" x-text="tUi('noDetail')"></div>
                </template>

                <!-- ─── fusionar (merge duplicate) ─── -->
                <!-- Hidden for the hub + conversations: those can never be merged. -->
                <template x-if="detail.node && detail.node.kind !== 'conversation' && !(detail.node.data && detail.node.data.role === 'user')">
                  <div class="mt-4">
                    <template x-if="!mergeMode">
                      <button type="button" id="merge-node-btn" @click="enterMergeMode()"
                              class="w-full px-3 py-1.5 text-sm rounded-lg font-medium"
                              style="background: var(--panel2); color: var(--teal, #00D4AA); border: 1px solid var(--teal, #00D4AA); cursor: pointer;"
                              x-text="tUi('mergeWith')"></button>
                    </template>
                    <template x-if="mergeMode">
                      <div class="panel2 p-2 rounded space-y-2">
                        <div class="muted text-xs" x-text="tUi('mergePickHint')"></div>
                        <!-- partner search (reuses the accent-insensitive matcher) -->
                        <div class="relative">
                          <input type="search" x-model="mergeSearchQuery" @input="mergeSearchInput()"
                                 :placeholder="tUi('mergeSearchPlaceholder')" autocomplete="off"
                                 class="w-full px-2 py-1 text-xs rounded"
                                 style="background: var(--panel); border: 1px solid var(--border, #2a3040); color: inherit; outline: none;">
                          <div x-show="mergeSearchResults.length > 0"
                               class="mt-1 panel rounded overflow-hidden"
                               style="max-height:160px; overflow-y:auto;">
                            <template x-for="mr in mergeSearchResults" :key="mr.id">
                              <button type="button" @click="selectMergeResult(mr)"
                                      class="w-full text-left px-2 py-1 text-xs hover:opacity-80"
                                      style="background:transparent; border:0; color:inherit; cursor:pointer;">
                                <span x-text="mr.label"></span>
                                <span class="muted" x-text="' · ' + tLabel(mr.kind)"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                        <!-- pending state: which one survives -->
                        <template x-if="mergePartner">
                          <div class="text-xs space-y-1">
                            <div x-text="tUi('mergePending')
                              .replace('{dup}', (mergeSwap ? selectedNode.label : mergePartner.label))
                              .replace('{canonical}', (mergeSwap ? mergePartner.label : selectedNode.label))"></div>
                            <div class="font-medium" style="color: var(--teal, #00D4AA);">
                              <span x-text="tUi('mergeSurvivor')"></span>
                              <span x-text="mergeSwap ? mergePartner.label : selectedNode.label"></span>
                            </div>
                            <button type="button" @click="toggleMergeSwap()"
                                    class="text-xs underline"
                                    style="background:0; border:0; color:inherit; cursor:pointer; padding:0;"
                                    x-text="tUi('mergeSwap')"></button>
                          </div>
                        </template>
                        <div class="flex gap-2">
                          <button type="button" id="confirm-merge-btn" @click="confirmMerge()"
                                  :disabled="!mergePartner"
                                  class="flex-1 px-2 py-1 text-xs rounded font-medium"
                                  :style="mergePartner
                                    ? 'background: var(--teal, #00D4AA); color:#06251f; border:0; cursor:pointer;'
                                    : 'background: var(--panel); color: var(--muted, #888); border:0; cursor:not-allowed; opacity:.6;'"
                                  x-text="tUi('mergeDo')"></button>
                          <button type="button" @click="cancelMerge()"
                                  class="px-2 py-1 text-xs rounded"
                                  style="background: var(--panel); color: inherit; border: 1px solid var(--border, #2a3040); cursor: pointer;"
                                  x-text="tUi('mergeCancel')"></button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- ─── forget node ─── -->
                <button type="button" id="forget-node-btn" @click="forgetNode()"
                        class="w-full mt-4 px-3 py-1.5 text-sm rounded-lg font-medium"
                        style="background: rgba(220, 60, 60, .15); color: #ff6b6b; border: 1px solid rgba(220, 60, 60, .4); cursor: pointer;"
                        x-text="tUi('forget')"></button>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ─── novedades de la semana: summary panel (pulse of your memory) ─── -->
  <template x-if="newPanelOpen">
    <div id="new-week-panel"
         class="fixed panel2 p-4 rounded-lg text-sm"
         style="top: 5rem; right: 1.5rem; width: 290px; max-height: 70vh; overflow-y: auto; z-index: 95; box-shadow: 0 8px 24px rgba(0,0,0,.5); border: 1px solid var(--border, #2a3040);">
      <div class="flex justify-between items-center mb-2">
        <div class="font-semibold" x-text="tUi('newThisWeekTitle')"></div>
        <button type="button" @click="closeNewPanel()"
                class="text-xs px-2 py-0.5 rounded"
                style="background: var(--panel); border:0; color:inherit; cursor:pointer;"
                x-text="tUi('close')"></button>
      </div>
      <template x-if="newItems.length === 0">
        <div class="muted text-xs py-4 text-center" x-text="tUi('newThisWeekEmpty')"></div>
      </template>
      <template x-if="newItems.length > 0">
        <div>
          <div class="muted text-xs mb-2">
            <span x-text="newItems.length"></span> <span x-text="tUi('nodes')"></span>
          </div>
          <!-- counts by domain -->
          <div class="flex flex-wrap gap-1 mb-3">
            <template x-for="cc in newCounts" :key="cc.domain">
              <span class="text-xs px-2 py-0.5 rounded-full" style="background: var(--panel);">
                <span x-text="tLabel(cc.domain)"></span>: <span x-text="cc.count"></span>
              </span>
            </template>
          </div>
          <!-- labels added in the last 7 days (clickable → focus) -->
          <div class="space-y-1">
            <template x-for="it in newItems" :key="it.id">
              <button type="button" @click="focusOn(it.id); closeNewPanel();"
                      class="w-full text-left panel p-2 rounded text-xs hover:opacity-80 flex items-center gap-2"
                      style="border:0; color:inherit; cursor:pointer;">
                <span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;"
                      :style="'background:' + (DOMAIN_COLOR[it.domain] || DOMAIN_COLOR['default'])"></span>
                <span class="truncate" x-text="it.label"></span>
              </button>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ─── undo bar: deferred-delete grace window (Gmail "undo send" pattern) ─── -->
  <template x-if="pendingUndo">
    <div id="undo-bar"
         class="fixed left-1/2 bottom-6 panel2 px-4 py-2 rounded-lg flex items-center gap-3 text-sm"
         style="transform: translateX(-50%); z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5); border: 1px solid var(--border, #2a3040);">
      <span x-text="pendingUndo.message"></span>
      <button type="button" id="undo-delete-btn" @click="undoDelete()"
              class="px-2 py-1 rounded font-medium"
              style="background: var(--teal, #00D4AA); color: #06251f; border: 0; cursor: pointer;">
        <span x-text="tUi('undo')"></span>
        <span x-text="'(' + pendingUndo.secondsLeft + ')'"></span>
      </button>
    </div>
  </template>
</div>

<!-- Vendored 3d-force-graph (no CDN) — bundles Three.js internally -->
<script src="/static/vendor/3d-force-graph.min.js"></script>

<script>
// HTML-escape helper — prevents stored XSS when node labels are injected as HTML.
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// UI language injected by the server from the 'language' config key.
// 'es-MX' → 'es', 'en-US' → 'en'. Defaults to 'es'.
const LANG = '{{ lang | default("es") }}';

// IANA timezone injected by the server from config.timezone.
// Used for toLocaleDateString() so displayed dates match the user's local calendar day.
const TZ = '{{ tz | default("UTC") }}';

// Domain-to-color map — consistent palette across all renders.
// Keys are canonical English identifiers; displayed text uses tLabel/tEdge.
const DOMAIN_COLOR = {
  relationships: '#FF6B9D',  // pink
  health:        '#22cc55',  // green
  finance:       '#ffaa33',  // amber
  conversation:  '#33aaff',  // blue
  fact:          '#00D4AA',  // teal
  event:         '#ee55ff',  // purple
  meeting:       '#ff8844',  // orange
  exercise:      '#44ddff',  // cyan
  learning:      '#bbff44',  // lime
  spirituality:  '#ff44aa',  // rose
  default:       '#888888',  // grey
};

// Focus-mode overlay colors. In FOCUS MODE the domain palette is overridden so
// relevance to the focused node is unmistakable (the full universe view keeps
// the domain palette untouched).
const FOCUS_TEAL = '#00D4AA';  // brand teal — the focused node/link anchor
const FOCUS_DIM  = '#3a4048';  // dim gray — 2nd-hop context, de-emphasized

// i18n label maps for domain/kind keys and edge kind keys.
// Add a new locale by extending with a new top-level key.
// Unknown keys fall back to the raw canonical key (graceful degradation).
const LABELS = {
  es: {
    // Domains + kinds
    relationships: 'Relaciones',
    health:        'Salud',
    finance:       'Finanzas',
    conversation:  'Conversación',
    fact:          'Hecho',
    event:         'Evento',
    'lifeos-events': 'Evento',
    meeting:       'Reunión',
    exercise:      'Ejercicio',
    learning:      'Aprendizaje',
    spirituality:  'Espiritualidad',
    person:        'Persona',
    default:       'General',
    // Edge kinds
    'similar-to':       'Similar a',
    'same-day':         'Mismo día',
    'happened-at':      'Ocurrió en',
    'involves-person':  'Involucra a',
    'mentioned_in':     'Mencionado en',
    'has_setup':        'Configuración',
    // Static UI chrome strings
    ui: {
      title:        'Cerebro 3D',
      nodes:        'nodos',
      relations:    'relaciones',
      loading:      'Cargando grafo 3D…',

/**
 * Translate a domain or node kind key to the current UI language.
 * Falls back to the raw key when no translation exists (future-safe).
 */
function tLabel(key) {
  if (!key) return key;
  const map = LABELS[LANG] || LABELS['es'];
  return map[key] !== undefined ? map[key] : key;
}

/**
 * Translate an edge kind key to the current UI language.
 * Falls back to the raw key when no translation exists.
 */
function tEdge(key) {
  if (!key) return key;
  const map = LABELS[LANG] || LABELS['es'];
  return map[key] !== undefined ? map[key] : key;
}

/**
 * Translate a static UI chrome string key to the current UI language.
 * Falls back to the es value, then to the raw key (graceful degradation).
 */
function tUi(key) {
  if (!key) return key;
  const ui = (LABELS[LANG] || LABELS['es']).ui || LABELS['es'].ui || {};
  return ui[key] !== undefined ? ui[key] : (LABELS['es'].ui || {})[key] || key;
}

// Normalize for case/accent-insensitive search: "Médico" → "medico".
function normText(s) {
  return String(s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

// Entity kinds are real "things" in the graph (person, place, …) as opposed to
// the fact/conversation TEXT BLOBS. Search ranks entities ABOVE blobs within a
// score tier so e.g. searching "Ani" surfaces the person "Ana Ríos"
// instead of a fact sentence that merely mentions her.
const _ENTITY_KINDS = new Set(['person', 'place', 'org', 'medication', 'condition', 'thing']);
function isEntityKind(kind) { return _ENTITY_KINDS.has(kind); }

function brain3dPage() {
  return {
    loading: true,
    nodeCount: 0,
    edgeCount: 0,
    partial: false,
    selectedNode: null,
    // Search state
    searchQuery: '',
    searchResults: [],
    _searchSeq: 0,          // monotonic id; guards against stale server responses
    _searchDebounce: null,  // pending setTimeout for the debounced server search
    // Focus mode state
    focusId: null,
    focusLabel: '',
    _focusNeighbors: new Set(),   // 1-hop neighbor ids of focusId (relevance recolor)
    _focusKeep: null,             // Set of ids in the focused subgraph (or null = full universe)
    // ── Stage 2: filters (client-side, over the loaded universe) ──
    hiddenDomains: {},            // reactive: domainKey -> true when that domain is toggled OFF
    dateFilter: 'all',            // 'all' | 'today' | 'week' | 'month'
    datePresets: [
      { k: 'all',   label: 'dateAll' },
      { k: 'today', label: 'dateToday' },
      { k: 'week',  label: 'dateWeek' },
      { k: 'month', label: 'dateMonth' },
    ],
    // ── Stage 2: novedades de la semana ──
    newPanelOpen: false,
    newItems: [],                 // [{id, label, domain}] added in the last 7 days
    newCounts: [],                // [{domain, count}]
    // ── Stage 2: merge (fuse duplicates) ──
    mergeMode: false,             // detail panel is in "pick a partner" mode
    mergePartner: null,           // {id, label, kind} chosen partner
    mergeSwap: false,             // when true, the survivor is the partner (not the panel node)
    mergeSearchQuery: '',
    mergeSearchResults: [],
    // Generic deferred-action / undo grace window state (node / edge / merge)
    pendingUndo: null,            // reactive: { type, message, secondsLeft } (drives undo bar)
    _pending: null,               // machinery: { type, restore, commit, timerId, tickId }
    // Detail panel state (from /api/graph/node/{id})
    detail: null,
    detailLoading: false,
    _graphData: null,
    _graph: null,
    _gfNodes: [],
    _gfLinks: [],
    _nodeById: {},
    _adj: {},        // node id → Set of neighbor ids (client-side, for 2-hop focus)
    DOMAIN_COLOR,    // expose for Alpine x-for

    async load() {
      this.loading = true;
      this.selectedNode = null;
      try {
        const resp = await fetch('/api/graph/full');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        this._graphData = data;
        this.nodeCount = data.nodes.length;
        this.edgeCount = data.edges.length;
        this.partial = !!data.partial;
        this.loading = false;
        if (data.nodes.length > 0) {
          this.$nextTick(() => this._render(data));
        }
      } catch (e) {
        console.error('[brain3d] fetch failed:', e);
        this.loading = false;
      }
    },

    fmtDate(epoch) {
      try {
        return new Date(epoch * 1000).toLocaleDateString(
          LANG === 'en' ? 'en-US' : 'es-ES', { timeZone: TZ });
      } catch (e) { return ''; }
    },

    _render(data) {
      const container = document.getElementById('brain3d-graph');
      if (!container || typeof ForceGraph3D === 'undefined') return;

      // Convert /api/graph/full format to 3d-force-graph format.
      const nodeById = {};
      const gfNodes = data.nodes.map(n => {
        // Color by domain when set; most nodes (conversations/facts) carry a
        // kind but no domain, so fall back to kind, then to the grey default.
        const color = DOMAIN_COLOR[n.domain] || DOMAIN_COLOR[n.kind] || DOMAIN_COLOR['default'];
        const gn = {
          id: n.id,
          label: n.label,
          kind: n.kind,
          domain: n.domain,
          has_embedding: n.has_embedding,
          aliases: n.aliases || [],            // alt names for search (e.g. ["Ani"])
          created_at: n.created_at ?? null,    // ingest epoch — drives date filters
          occurred_at: n.occurred_at ?? null,  // real event epoch or null
          color,
        };
        nodeById[n.id] = gn;
        return gn;
      });
      const gfLinks = data.edges.map(e => ({
        id: e.id ?? null,                       // System A edge id (null for System B)
        source: e.source,
        target: e.target,
        kind: e.kind,
        system: e.system,
        // Visual distinction: dashed-style color for similar-to vs explicit edges.
        color: e.kind === 'similar-to' ? '#3a5a6a' : '#5a7a4a',
      }));

      // Adjacency map for client-side 2-hop focus (built BEFORE 3d-force-graph
      // mutates link.source/target from ids into node object refs).
      const adj = {};
      for (const e of data.edges) {
        (adj[e.source] = adj[e.source] || new Set()).add(e.target);
        (adj[e.target] = adj[e.target] || new Set()).add(e.source);
      }

      this._gfNodes = gfNodes;
      this._gfLinks = gfLinks;
      this._nodeById = nodeById;
      this._adj = adj;

      const self = this;

      this._graph = ForceGraph3D()(container)
        .backgroundColor('#0b0e13')
        .showNavInfo(false)
        .nodeLabel(n => `<div style="background:#1a1f2b;color:#e6edf3;padding:4px 8px;border-radius:4px;font-size:12px;max-width:200px">${escHtml(n.label)}</div>`)
        .nodeColor(n => self._nodeColorAcc(n))
        .nodeOpacity(0.9)
        .nodeVal(n => self._nodeValAcc(n))
        .linkColor(l => self._linkColorAcc(l))
        .linkOpacity(0.5)
        .linkWidth(l => self._linkWidthAcc(l))
        .graphData({ nodes: gfNodes, links: gfLinks })
        .onNodeClick(node => {
          // In merge mode a click PICKS the partner instead of re-selecting.
          if (self.mergeMode) self._pickMergePartner(node);
          else self._selectNode(node);
        });

      // 3d-force-graph locks the canvas to the container size at creation. Inside
      // the dashboard's modal iframe the container often isn't at its final size
      // yet (and the window can be resized), so keep the canvas synced to the
      // container — otherwise the graph stays frozen in a tiny strip.
      const syncSize = () => {
        if (!self._graph) return;
        self._graph.width(container.clientWidth).height(container.clientHeight);
      };
      syncSize();
      if (window.ResizeObserver) {
        if (self._resizeObs) self._resizeObs.disconnect();
        self._resizeObs = new ResizeObserver(syncSize);
        self._resizeObs.observe(container);
      } else {
        window.addEventListener('resize', syncSize);
      }
    },

    // ─── search (case/accent-insensitive over labels AND aliases) ───
    // Matches the query against each node's label and its aliases, then RANKS so
    // the richest, most-relevant node wins. Score tiers (best → worst):
    //   4  label exact / startsWith        3  alias exact / startsWith
    //   2  label substring                 1  alias substring
    // Tie-breaker within a tier: entity kinds (_ENTITY_KINDS) rank ABOVE the
    // fact/conversation text blobs — this is what makes "Ani" surface the
    // person "Ana Ríos" above a fact sentence mentioning her.
    // Local ranking helper: score {label, aliases} against a normalized query.
    // Returns {score, matchedAlias} — matchedAlias is set only when an alias
    // (not the label) is the strongest reason this node matched.
    _scoreMatch(label, aliases, q) {
      const nl = normText(label);
      let labelScore = 0;
      if (nl === q || nl.startsWith(q)) labelScore = 4;
      else if (nl.includes(q)) labelScore = 2;
      let aliasScore = 0;
      let matchedAlias = null;
      for (const a of (aliases || [])) {
        const na = normText(a);
        if (!na) continue;
        let s = 0;
        if (na === q || na.startsWith(q)) s = 3;
        else if (na.includes(q)) s = 1;
        if (s > aliasScore) { aliasScore = s; matchedAlias = a; }
      }
      return {
        score: Math.max(labelScore, aliasScore),
        matchedAlias: aliasScore > labelScore ? matchedAlias : null,
      };
    },

    // Instant search over the LOADED universe (the ~500 nodes in the scene).
    _localSearchResults(q) {
      const scored = [];
      for (const n of this._gfNodes) {
        const { score, matchedAlias } = this._scoreMatch(n.label, n.aliases, q);
        if (score === 0) continue;  // no match on label or any alias
        scored.push({
          id: n.id, label: n.label, kind: n.kind, score,
          entity: isEntityKind(n.kind),
          alias: matchedAlias,
          remote: false,            // present in the scene, already positioned
        });
      }
      // score desc, then entity kinds above fact/conversation within the tier.
      scored.sort((a, b) => (b.score - a.score) || (Number(b.entity) - Number(a.entity)));
      return scored;
    },

    searchInput() {
      const raw = this.searchQuery.trim();
      const q = normText(raw);
      // Bump the sequence so any in-flight server response for an OLDER query is
      // ignored when it lands (stale-response guard).
      const seq = ++this._searchSeq;
      if (!q) {
        this.searchResults = [];
        if (this._searchDebounce) { clearTimeout(this._searchDebounce); this._searchDebounce = null; }
        return;
      }
      // 1) Instant LOCAL results (unchanged behavior for the loaded universe).
      const local = this._localSearchResults(q);
      this.searchResults = local.slice(0, 15);
      // 2) Debounced SERVER search finds nodes BEYOND the loaded ~500. It merges
      //    after the local ones; a network failure just keeps the local results.
      if (raw.length < 2) return;
      if (this._searchDebounce) clearTimeout(this._searchDebounce);
      this._searchDebounce = setTimeout(() => this._serverSearch(raw, q, seq, local), 200);
    },

    // Fetch /api/graph/search and MERGE server-only results after the local ones.
    // Server hits that are already loaded are dropped (local wins — it's already
    // positioned in the scene). Out-of-view hits are marked so the user knows a
    // click will fetch their neighborhood (navigateTo → _injectNeighborhood).
    async _serverSearch(raw, q, seq, local) {
      let serverRows;
      try {
        const resp = await fetch('/api/graph/search?q=' + encodeURIComponent(raw) + '&limit=20');
        if (!resp.ok) return;               // keep local results on server error
        serverRows = await resp.json();
      } catch (e) {
        return;                             // network failure must NOT break local search
      }
      if (seq !== this._searchSeq) return;  // stale: the query changed since we fired
      if (!Array.isArray(serverRows)) return;
      const localIds = new Set(local.map(r => r.id));
      const merged = local.slice();         // local first (already positioned)
      for (const s of serverRows) {
        if (localIds.has(s.id)) continue;   // dedupe by id: local wins
        const { matchedAlias } = this._scoreMatch(s.label, s.aliases, q);
        merged.push({
          id: s.id, label: s.label, kind: s.kind,
          entity: isEntityKind(s.kind),
          alias: matchedAlias,
          remote: true,                     // out of view → show a "fuera de vista" tag
        });
      }
      this.searchResults = merged.slice(0, 15);
    },

    async selectSearchResult(r) {
      this.searchResults = [];
      this.searchQuery = '';
      if (this._searchDebounce) { clearTimeout(this._searchDebounce); this._searchDebounce = null; }
      this._searchSeq++;                    // cancel any in-flight server response
      // navigateTo injects the neighborhood for ids not in the loaded universe
      // (server-only results) before focusing; for loaded ids it just focuses.
      await this.navigateTo(r.id);
    },

    // ─── focus mode: selected node + 2-hop neighborhood subgraph ───
    focusOn(nodeId) {
      const node = this._nodeById[nodeId];
      if (!node || !this._graph) return;
      // BFS up to 2 hops over the client-side adjacency of the loaded universe.
      const keep = new Set([nodeId]);
      let frontier = [nodeId];
      for (let hop = 0; hop < 2; hop++) {
        const next = [];
        for (const id of frontier) {
          for (const nb of (this._adj[id] || [])) {
            if (!keep.has(nb)) { keep.add(nb); next.push(nb); }
          }
        }
        frontier = next;
      }
      this.focusId = nodeId;
      this.focusLabel = node.label;
      this._focusKeep = keep;   // subgraph bound; filters still apply within it
      // 1-hop neighbors: "the ones that light up" — reuse the adjacency map.
      this._focusNeighbors = new Set(this._adj[nodeId] || []);
      this._renderGraphData();  // reuses the SAME node/link refs → positions persist
      this._selectNode(node);
      // Fly the camera to the focused node once the re-heated layout settles a bit.
      setTimeout(() => this._flyTo(node), 500);
    },

    clearFocus() {
      this.focusId = null;
      this.focusLabel = '';
      this._focusNeighbors = new Set();
      this._focusKeep = null;
      if (this._graph) {
        this._renderGraphData();
        setTimeout(() => { if (this._graph) this._graph.zoomToFit(800, 40); }, 500);
      }
    },

    // ─── Stage 2: central visible-set computation + graphData swap ───
    // The single place that decides which nodes/links the scene shows, honoring
    // (a) focus subgraph bound and (b) domain + date filters (AND). Always reuses
    // the SAME gfNode/gfLink object refs so 3d-force-graph keeps layout positions.
    _domainKey(n) {
      // Mirror the color fallback so a legend row filters exactly what it colors.
      if (n.domain && DOMAIN_COLOR[n.domain]) return n.domain;
      if (n.kind && DOMAIN_COLOR[n.kind]) return n.kind;
      return 'default';
    },
    _passesDate(n, now) {
      if (this.dateFilter === 'all') return true;
      const ca = n.created_at;
      if (ca == null) return false;   // no timestamp → excluded from date-bounded views
      let win;
      if (this.dateFilter === 'today') win = 24 * 3600;
      else if (this.dateFilter === 'week') win = 7 * 24 * 3600;
      else if (this.dateFilter === 'month') win = 30 * 24 * 3600;
      else return true;
      return ca >= (now - win);
    },
    _visibleNodeIds() {
      const baseIds = (this.focusId !== null) ? this._focusKeep : null;
      const now = Date.now() / 1000;
      const keep = new Set();
      for (const n of this._gfNodes) {
        if (baseIds && !baseIds.has(n.id)) continue;
        if (this.hiddenDomains[this._domainKey(n)]) continue;
        if (!this._passesDate(n, now)) continue;
        keep.add(n.id);
      }
      return keep;
    },
    _renderGraphData() {
      if (!this._graph) return;
      const keep = this._visibleNodeIds();
      const nodes = this._gfNodes.filter(n => keep.has(n.id));
      const links = this._gfLinks.filter(l => {
        const [s, t] = this._linkEnds(l);
        return keep.has(s) && keep.has(t);
      });
      this._graph.graphData({ nodes, links });
      this._refreshVisuals();
    },

    // ─── Stage 2: domain + date filter controls ───
    toggleDomain(domain) {
      // Reassign the object so Alpine's reactivity picks up the change.
      const next = Object.assign({}, this.hiddenDomains);
      if (next[domain]) delete next[domain]; else next[domain] = true;
      this.hiddenDomains = next;
      this._renderGraphData();
    },
    resetFilters() {
      this.hiddenDomains = {};
      this.dateFilter = 'all';
      this._renderGraphData();
    },
    setDateFilter(k) {
      this.dateFilter = k;
      this._renderGraphData();
    },

    // ─── Stage 2: novedades de la semana (last-7-days pulse) ───
    openNewThisWeek() {
      // Apply the "Esta semana" date filter and clear any domain hiding so the
      // full week's pulse is visible, then summarize.
      this.hiddenDomains = {};
      this.dateFilter = 'week';
      this._renderGraphData();
      const cutoff = Date.now() / 1000 - 7 * 24 * 3600;
      const items = [];
      const counts = {};
      for (const n of this._gfNodes) {
        if (n.created_at != null && n.created_at >= cutoff) {
          const dk = this._domainKey(n);
          items.push({ id: n.id, label: n.label, domain: dk });
          counts[dk] = (counts[dk] || 0) + 1;
        }
      }
      this.newItems = items;
      this.newCounts = Object.entries(counts).map(([domain, count]) => ({ domain, count }));
      this.newPanelOpen = true;
    },
    closeNewPanel() {
      this.newPanelOpen = false;
    },

    // Re-setting the accessors forces 3d-force-graph to re-evaluate node/link
    // size + color — used whenever focus state changes (enter/clear/restore).
    _refreshVisuals() {
      if (!this._graph) return;
      this._graph
        .nodeVal(this._graph.nodeVal())
        .nodeColor(this._graph.nodeColor())
        .linkColor(this._graph.linkColor())
        .linkWidth(this._graph.linkWidth());
    },

    // ─── focus-relevance accessors (pure; a recolor is just an accessor swap) ───
    // Full universe (focusId === null) → domain palette untouched.
    // Focus mode → focused node teal, 1-hop neighbors keep their domain color,
    // everything else (2nd hop) dimmed gray + smaller.
    _linkEnds(l) {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return [s, t];
    },
    _nodeColorAcc(n) {
      if (this.focusId === null) return n.color;
      if (n.id === this.focusId) return FOCUS_TEAL;
      if (this._focusNeighbors.has(n.id)) return n.color;
      return FOCUS_DIM;
    },
    _nodeValAcc(n) {
      if (this.focusId === null) return n.has_embedding ? 4 : 2;
      if (n.id === this.focusId) return 14;                 // largest anchor
      if (this._focusNeighbors.has(n.id)) return n.has_embedding ? 4 : 2;
      return 1;                                             // dim context, smaller
    },
    _linkColorAcc(l) {
      if (this.focusId === null) return l.color;
      const [s, t] = this._linkEnds(l);
      if (s === this.focusId || t === this.focusId) return FOCUS_TEAL;
      if (this._focusNeighbors.has(s) && this._focusNeighbors.has(t)) return l.color;
      return FOCUS_DIM;
    },
    _linkWidthAcc(l) {
      const [s, t] = this._linkEnds(l);
      if (this.focusId === null) return l.system === 'B' ? 2 : 1;
      if (s === this.focusId || t === this.focusId) return 3;          // brighter/thicker
      if (this._focusNeighbors.has(s) && this._focusNeighbors.has(t)) return l.system === 'B' ? 2 : 1;
      return 0.5;                                                       // dim context
    },

    // Camera flight toward a node (3d-force-graph cameraPosition pattern):
    // place the camera on the ray origin→node, a fixed distance past the node.
    _flyTo(node) {
      if (!this._graph) return;
      if (node.x == null || node.y == null || node.z == null) {
        this._graph.zoomToFit(800, 60);
        return;
      }
      const dist = 140;
      const len = Math.hypot(node.x, node.y, node.z) || 1;
      const ratio = 1 + dist / len;
      this._graph.cameraPosition(
        { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
        node,       // lookAt
        1200        // transition ms
      );
    },

    // Navigate from a related-node link in the panel: re-center focus on it.
    // If the node is outside the initially-loaded universe (the 500-node cutoff),
    // fetch its 1-hop neighborhood, inject it into the scene, then focus — so the
    // camera flies and the focus-subgraph shows it (Deliverable B).
    async navigateTo(nodeId) {
      if (this._nodeById[nodeId]) {
        this.focusOn(nodeId);
        return;
      }
      await this._injectNeighborhood(nodeId);
      if (this._nodeById[nodeId]) {
        this.focusOn(nodeId);
      } else {
        // Injection failed (e.g. server error) — fall back to detail-only.
        this._selectNode({ id: nodeId, label: '…', kind: '', domain: '', occurred_at: null });
      }
    },

    // ─── Deliverable B: inject a node's 1-hop neighborhood into the scene ───
    // Fetches /api/graph/node/{id}/neighborhood and merges the returned nodes +
    // edges into master data (_gfNodes/_gfLinks), _nodeById, _adj, and the live
    // 3d-force-graph data. Existing nodes/edges are REUSED (matched by id) so we
    // never double-inject and object refs (positions) are preserved. Injected
    // nodes persist for the session.
    async _injectNeighborhood(centerId) {
      let data;
      try {
        const resp = await fetch('/api/graph/node/' + encodeURIComponent(centerId) + '/neighborhood');
        if (!resp.ok) return;
        data = await resp.json();
      } catch (e) {
        console.error('[brain3d] neighborhood fetch failed:', e);
        return;
      }
      let added = false;
      for (const n of (data.nodes || [])) {
        if (this._nodeById[n.id]) continue;   // already loaded — reuse, don't duplicate
        const color = DOMAIN_COLOR[n.domain] || DOMAIN_COLOR[n.kind] || DOMAIN_COLOR['default'];
        const gn = {
          id: n.id, label: n.label, kind: n.kind, domain: n.domain,
          has_embedding: n.has_embedding,
          aliases: n.aliases || [],            // alt names for search (e.g. ["Ani"])
          created_at: n.created_at ?? null,
          occurred_at: n.occurred_at ?? null,
          color,
        };
        this._nodeById[n.id] = gn;
        this._gfNodes.push(gn);
        added = true;
      }
      for (const e of (data.edges || [])) {
        if (e.id != null && this._gfLinks.some(l => l.id === e.id)) continue;  // reuse existing link
        const gl = {
          id: e.id ?? null, source: e.source, target: e.target, kind: e.kind, system: 'A',
          color: e.kind === 'similar-to' ? '#3a5a6a' : '#5a7a4a',
        };
        this._gfLinks.push(gl);
        (this._adj[e.source] = this._adj[e.source] || new Set()).add(e.target);
        (this._adj[e.target] = this._adj[e.target] || new Set()).add(e.source);
        added = true;
      }
      this.nodeCount = this._gfNodes.length;
      this.edgeCount = this._gfLinks.length;
      if (added && this._graph) {
        // Swap in the enlarged master data; focusOn() re-renders the focus subgraph.
        this._graph.graphData({ nodes: this._gfNodes, links: this._gfLinks });
      }
      if (data.truncated) this._toast(tUi('navTruncated'));
    },

    // ─── selection + detail panel (on-demand /api/graph/node/{id}) ───
    async _selectNode(node) {
      // Selecting a (different) node exits any in-progress merge picking.
      this._resetMerge();
      this.selectedNode = node;
      this.detail = null;
      this.detailLoading = true;
      try {
        const resp = await fetch('/api/graph/node/' + encodeURIComponent(node.id));
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const d = await resp.json();
        // Ignore stale responses if the user already clicked another node.
        if (this.selectedNode && this.selectedNode.id === node.id) {
          this.detail = d;
          // Fill panel header from authoritative data (navigateTo stub case).
          this.selectedNode = Object.assign({}, this.selectedNode, {
            label: d.node.label,
            kind: d.node.kind,
            domain: d.node.domain,
            occurred_at: d.node.occurred_at,
          });
        }
      } catch (e) {
        console.error('[brain3d] node detail fetch failed:', e);
        if (this.selectedNode && this.selectedNode.id === node.id) {
          this.detail = { node: node, facts: [], relations: [], conversations: [] };
        }
      } finally {
        if (this.selectedNode && this.selectedNode.id === node.id) {
          this.detailLoading = false;
        }
      }
    },

    // ─── Deliverable 0: generic deferred-action + undo grace window ───
    // ONE state machine drives node-delete, edge-delete AND merge. Each action
    // is applied optimistically to the view, then its real API call is deferred
    // behind an 8s window ("undo send"). Starting any new deferred action commits
    // the previous pending one first, so there is only ever ONE undo bar and no
    // divergent per-action timer code.
    //
    //   _startPending(type, { optimisticApply, restore, commit, message })
    //     optimisticApply() — in-view change (runs now, feels instant)
    //     restore()         — reverse the in-view change (on undo OR commit failure)
    //     commit()          — async; the real API call; resolves { ok, message? }
    //     message           — pre-rendered Spanish text for the undo bar
    //   pendingUndo = { type, message, secondsLeft }  (drives the undo bar)
    //   _pending    = { type, restore, commit, timerId, tickId }
    _startPending(type, opts) {
      // Only ONE pending action at a time: commit the previous one first
      // (fires its API now, then opens the new window).
      if (this._pending) this._commitPending();

      opts.optimisticApply();

      const SECS = 8;
      this.pendingUndo = { type, message: opts.message, secondsLeft: SECS };
      const p = { type, restore: opts.restore, commit: opts.commit, timerId: null, tickId: null };
      p.tickId = setInterval(() => {
        if (!this.pendingUndo) return;
        this.pendingUndo.secondsLeft = Math.max(0, this.pendingUndo.secondsLeft - 1);
      }, 1000);
      p.timerId = setTimeout(() => this._commitPending(), SECS * 1000);
      this._pending = p;
    },

    // User clicked "Deshacer" within the window: restore, never call the API.
    undoDelete() {
      const p = this._pending;
      if (!p) return;
      if (p.timerId) clearTimeout(p.timerId);
      if (p.tickId) clearInterval(p.tickId);
      this._pending = null;
      this.pendingUndo = null;
      p.restore();
      this._toast(this._undoneToast(p.type));
    },

    // Type-specific "undone" toast shown after the user hits Deshacer.
    _undoneToast(type) {
      if (type === 'edge') return tUi('edgeRestored');
      if (type === 'merge') return tUi('mergeUndone');
      return tUi('recovered');
    },

    // Window elapsed (or a new action arrived): NOW run the real API call.
    // Detaches the pending state synchronously first so a leftover timer can
    // never double-fire the API. On refusal/failure the in-view change is
    // restored and the mapped Spanish error is shown (never leave the user
    // thinking it succeeded when the server refused/failed).
    async _commitPending() {
      const p = this._pending;
      if (!p) return;
      if (p.timerId) clearTimeout(p.timerId);
      if (p.tickId) clearInterval(p.tickId);
      this._pending = null;
      this.pendingUndo = null;
      let res;
      try {
        res = await p.commit();
      } catch (e) {
        console.error('[brain3d] pending commit failed:', e);
        res = { ok: false };
      }
      if (!res || !res.ok) {
        p.restore();
        this._toast((res && res.message) || tUi('actionFailed'), 'error');
      }
    },

    // ─── forget (delete) the selected node — rides the generic undo window ───
    // Removes the node from the view instantly but delays the DELETE API call
    // behind the 8s grace window. Sacred data: never a silent hard delete.
    async forgetNode() {
      const node = this.selectedNode;
      if (!node) return;

      // Client-side hub/conversation guard BEFORE the optimistic remove: since
      // the DELETE now fires late, we must not optimistically remove a node the
      // server would refuse. detail.node carries kind + data.role (the button
      // only renders once detail is loaded); fall back to selectedNode.
      const dn = (this.detail && this.detail.node) || node;
      if (dn.kind === 'conversation') { this._toast(tUi('deleteConversation'), 'error'); return; }
      if (dn.data && dn.data.role === 'user') { this._toast(tUi('deleteHub'), 'error'); return; }

      const msg = tUi('confirmDelete').replace('{label}', node.label);
      let ok;
      if (window.axiConfirm) {
        ok = await window.axiConfirm({ message: msg, danger: true });
      } else {
        ok = window.confirm(msg);
      }
      if (!ok) return;

      const self = this;
      let snap = null;
      this._startPending('node', {
        message: tUi('undoDone').replace('{label}', node.label),
        optimisticApply() {
          snap = self._snapshotAndRemove(node);
          self.selectedNode = null;
          self.detail = null;
        },
        restore() { self._restoreSnapshot(snap); },
        async commit() {
          const resp = await fetch('/api/graph/node/' + encodeURIComponent(snap.nodeId), { method: 'DELETE' });
          let body = null;
          try { body = await resp.json(); } catch (e) { body = null; }
          if (resp.ok && body && body.deleted) return { ok: true };
          const reason = body && body.reason;
          let m = tUi('deleteFailed');
          if (reason === 'hub') m = tUi('deleteHub');
          else if (reason === 'conversation') m = tUi('deleteConversation');
          return { ok: false, message: m };
        },
      });
    },

    // ─── Deliverable C: forget a single relationship (edge) ───
    // Low-stakes (an edge, not a node) and it HAS the undo window → no separate
    // confirm dialog. Optimistically removes the link from the scene + the panel
    // row, defers DELETE /api/graph/edge/{id}. Removing an edge never removes
    // either endpoint node.
    forgetRelation(rel) {
      if (!rel || rel.edge_id == null) return;
      const self = this;
      const node = this.selectedNode;
      const detail = this.detail;
      const aId = node ? node.id : null;
      const bId = rel.other_id;
      let linkSnap = null;   // { links:[refs], aId, bId }
      let relSnap = null;    // { rel, index }
      this._startPending('edge', {
        message: tUi('undoEdge'),
        optimisticApply() {
          linkSnap = self._removeEdgeFromScene(rel.edge_id, aId, bId);
          if (detail && Array.isArray(detail.relations)) {
            const idx = detail.relations.indexOf(rel);
            if (idx !== -1) { relSnap = { rel, index: idx }; detail.relations.splice(idx, 1); }
          }
        },
        restore() {
          self._restoreEdgeToScene(linkSnap);
          if (relSnap && detail && Array.isArray(detail.relations)) {
            detail.relations.splice(Math.min(relSnap.index, detail.relations.length), 0, relSnap.rel);
          }
        },
        async commit() {
          const resp = await fetch('/api/graph/edge/' + encodeURIComponent(rel.edge_id), { method: 'DELETE' });
          let body = null;
          try { body = await resp.json(); } catch (e) { body = null; }
          if (resp.ok && body && body.deleted) return { ok: true };
          return { ok: false, message: tUi('edgeForgetFailed') };
        },
      });
    },

    // Remove one edge (by id) from master data + the live scene. Snapshots the
    // removed link ref(s) so restore re-adds the SAME objects. Endpoint nodes are
    // never touched; adjacency between them is dropped only if no other edge
    // still connects them.
    _removeEdgeFromScene(edgeId, aId, bId) {
      const removed = this._gfLinks.filter(l => l.id === edgeId);
      if (removed.length > 0) {
        this._gfLinks = this._gfLinks.filter(l => l.id !== edgeId);
        this.edgeCount = this._gfLinks.length;
        this._dropAdjacencyIfLast(aId, bId);
        if (this._graph) this._renderGraphData();
      }
      return { links: removed, aId, bId };
    },

    // Re-insert a snapshotted edge into master data + scene (same ref → position
    // preserved) and restore adjacency between its endpoints.
    _restoreEdgeToScene(snap) {
      if (!snap) return;
      for (const l of (snap.links || [])) {
        if (!this._gfLinks.some(x => x === l || (l.id != null && x.id === l.id))) this._gfLinks.push(l);
      }
      this.edgeCount = this._gfLinks.length;
      if (snap.aId != null && snap.bId != null) {
        (this._adj[snap.aId] = this._adj[snap.aId] || new Set()).add(snap.bId);
        (this._adj[snap.bId] = this._adj[snap.bId] || new Set()).add(snap.aId);
      }
      if (this._graph) this._renderGraphData();
    },

    // Drop the a↔b adjacency entry only when NO remaining link connects them.
    _dropAdjacencyIfLast(aId, bId) {
      if (aId == null || bId == null) return;
      const stillLinked = this._gfLinks.some(l => {
        const [s, t] = this._linkEnds(l);
        return (s === aId && t === bId) || (s === bId && t === aId);
      });
      if (!stillLinked) {
        if (this._adj[aId]) this._adj[aId].delete(bId);
        if (this._adj[bId]) this._adj[bId].delete(aId);
      }
    },

    // Recompute the whole adjacency map from the current links (used after a
    // structural restore such as merge-undo, where incremental patching is fragile).
    _rebuildAdjacency() {
      const adj = {};
      for (const l of this._gfLinks) {
        const [s, t] = this._linkEnds(l);
        (adj[s] = adj[s] || new Set()).add(t);
        (adj[t] = adj[t] || new Set()).add(s);
      }
      this._adj = adj;
    },

    // Snapshot a node + its edges, then remove them from master data AND the
    // live 3D scene in place. Same node/link object refs are kept in the
    // snapshot so a restore preserves positions and graph state exactly.
    _snapshotAndRemove(node) {
      const nodeId = node.id;
      const linkGone = (l) => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        return s === nodeId || t === nodeId;
      };
      const snap = {
        nodeId,
        label: node.label,
        nodeObj: this._nodeById[nodeId],                     // real ref (positions)
        links: this._gfLinks.filter(linkGone),               // removed link refs
        adjSet: this._adj[nodeId] ? new Set(this._adj[nodeId]) : new Set(),
        neighbors: Array.from(this._adj[nodeId] || []),
      };
      // Master data.
      this._gfNodes = this._gfNodes.filter(n => n.id !== nodeId);
      this._gfLinks = this._gfLinks.filter(l => !linkGone(l));
      delete this._nodeById[nodeId];
      for (const k of Object.keys(this._adj)) this._adj[k].delete(nodeId);
      delete this._adj[nodeId];
      this.nodeCount = this._gfNodes.length;
      this.edgeCount = this._gfLinks.length;
      // Live scene.
      if (this._graph) {
        if (this.focusId === nodeId) {
          // Removed the focused node → drop focus back to the full universe.
          this.focusId = null;
          this.focusLabel = '';
          this._focusNeighbors = new Set();
          this._focusKeep = null;
        } else if (this._focusKeep) {
          this._focusKeep.delete(nodeId);
        }
        this._renderGraphData();  // recompute honoring active filters
      }
      return snap;
    },

    // Re-insert a snapshotted node + its edges into master data and the live
    // scene, using the same object refs so positions/graph state are preserved.
    _restoreSnapshot(snap) {
      if (this._nodeById[snap.nodeId]) return;  // already present — no-op
      this._gfNodes.push(snap.nodeObj);
      this._nodeById[snap.nodeId] = snap.nodeObj;
      for (const l of snap.links) this._gfLinks.push(l);
      this._adj[snap.nodeId] = new Set(snap.adjSet);
      for (const nb of snap.neighbors) {
        (this._adj[nb] = this._adj[nb] || new Set()).add(snap.nodeId);
      }
      this.nodeCount = this._gfNodes.length;
      this.edgeCount = this._gfLinks.length;
      // If this node belonged to the active focus subgraph, put it back in-bounds.
      if (this._focusKeep) this._focusKeep.add(snap.nodeId);
      if (this._graph) this._renderGraphData();  // recompute honoring active filters
    },

    // ─── Stage 2: merge (fuse a duplicate into the selected node) ───
    _resetMerge() {
      this.mergeMode = false;
      this.mergePartner = null;
      this.mergeSwap = false;
      this.mergeSearchQuery = '';
      this.mergeSearchResults = [];
    },
    enterMergeMode() {
      this._resetMerge();
      this.mergeMode = true;
    },
    cancelMerge() {
      this._resetMerge();
    },
    toggleMergeSwap() {
      this.mergeSwap = !this.mergeSwap;
    },
    mergeSearchInput() {
      const q = normText(this.mergeSearchQuery.trim());
      if (!q) { this.mergeSearchResults = []; return; }
      const out = [];
      for (const n of this._gfNodes) {
        if (this.selectedNode && n.id === this.selectedNode.id) continue;  // never itself
        if (normText(n.label).includes(q)) {
          out.push({ id: n.id, label: n.label, kind: n.kind });
          if (out.length >= 12) break;
        }
      }
      this.mergeSearchResults = out;
    },
    selectMergeResult(r) {
      this.mergeSearchResults = [];
      this.mergeSearchQuery = '';
      this._pickMergePartner(this._nodeById[r.id] || r);
    },
    // Validate + set the merge partner (from a search hit or a scene click).
    _pickMergePartner(node) {
      if (!this.selectedNode || !node) return;
      if (node.id === this.selectedNode.id) { this._toast(tUi('mergeSameId'), 'error'); return; }
      const p = this._nodeById[node.id] || node;
      if (p.kind === 'conversation') { this._toast(tUi('mergeConversation'), 'error'); return; }
      if (p.kind !== this.selectedNode.kind) { this._toast(tUi('mergeKindMismatch'), 'error'); return; }
      this.mergePartner = { id: p.id, label: p.label, kind: p.kind };
      this.mergeSearchResults = [];
      this.mergeSearchQuery = '';
    },
    _mergeReasonMsg(reason) {
      switch (reason) {
        case 'kind_mismatch': return tUi('mergeKindMismatch');
        case 'hub':           return tUi('mergeHub');
        case 'conversation':  return tUi('mergeConversation');
        case 'same_id':       return tUi('mergeSameId');
        default:              return tUi('mergeFailed');
      }
    },
    // ─── Deliverable A: merge is now DEFERRED (rides the generic undo window) ───
    // The confirm dialog stays. On confirm we optimistically fold the duplicate
    // into the survivor in-view (repoint links + remove the dup node) and open the
    // undo bar — WITHOUT POSTing. Undo restores the dup exactly; elapse fires the
    // real POST /api/graph/merge. Client-side guards run in _pickMergePartner
    // BEFORE this point so we don't optimistically merge something the server
    // would refuse; the server is still the final safety net (restore on refusal).
    async confirmMerge() {
      if (!this.selectedNode || !this.mergePartner) return;
      const survivor = this.mergeSwap ? this.mergePartner : this.selectedNode;
      const dup = this.mergeSwap ? this.selectedNode : this.mergePartner;
      const msg = tUi('mergeConfirm')
        .replace('{dup}', dup.label)
        .replace('{canonical}', survivor.label);
      let ok;
      if (window.axiConfirm) ok = await window.axiConfirm({ message: msg, danger: true });
      else ok = window.confirm(msg);
      if (!ok) return;

      const self = this;
      const survivorId = survivor.id, dupId = dup.id;
      const survivorLabel = survivor.label, dupLabel = dup.label;
      let snap = null;
      this._resetMerge();
      this._startPending('merge', {
        message: tUi('undoMerge').replace('{dup}', dupLabel).replace('{canonical}', survivorLabel),
        optimisticApply() {
          snap = self._absorbNodeSnapshot(dupId, survivorId);
          const sv = self._nodeById[survivorId];
          if (sv) self._selectNode(sv);   // survivor stays selected
        },
        restore() { self._restoreMergeSnapshot(snap); },
        async commit() {
          const resp = await fetch('/api/graph/merge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ canonical_id: survivorId, duplicate_id: dupId }),
          });
          let body = null;
          try { body = await resp.json(); } catch (e) { body = null; }
          if (resp.ok && body && body.merged) return { ok: true };
          return { ok: false, message: self._mergeReasonMsg(body && body.reason) };
        },
      });
    },

    // Optimistic merge for the undo window: snapshot enough to restore EXACTLY,
    // then fold the dup into the survivor via the existing _absorbNode.
    _absorbNodeSnapshot(dupId, survivorId) {
      // Capture original endpoints of every link touching the dup BEFORE repoint,
      // and a shallow copy of the links array (so self-loops dropped by _absorbNode
      // can be re-added on restore).
      const touched = [];
      for (const l of this._gfLinks) {
        const [s, t] = this._linkEnds(l);
        if (s === dupId || t === dupId) {
          touched.push({ link: l, source: l.source, target: l.target });
        }
      }
      const snap = {
        dupId, survivorId,
        dupNode: this._nodeById[dupId],
        touched,
        origLinks: this._gfLinks.slice(),
        focusId: this.focusId,
        focusLabel: this.focusLabel,
        focusKeep: this._focusKeep ? new Set(this._focusKeep) : null,
        focusNeighbors: new Set(this._focusNeighbors),
      };
      this._absorbNode(dupId, survivorId);   // repoint + drop dup (existing logic)
      return snap;
    },

    // Reverse an optimistic merge: reset repointed links to their original
    // endpoints, re-add the dup node + dropped self-loops, rebuild adjacency,
    // and restore focus state — using the same object refs throughout.
    _restoreMergeSnapshot(snap) {
      if (!snap) return;
      for (const t of snap.touched) {
        t.link.source = t.source;
        t.link.target = t.target;
      }
      this._gfLinks = snap.origLinks;
      if (!this._nodeById[snap.dupId]) {
        this._nodeById[snap.dupId] = snap.dupNode;
        this._gfNodes.push(snap.dupNode);
      }
      this._rebuildAdjacency();
      this.nodeCount = this._gfNodes.length;
      this.edgeCount = this._gfLinks.length;
      this.focusId = snap.focusId;
      this.focusLabel = snap.focusLabel;
      this._focusKeep = snap.focusKeep;
      this._focusNeighbors = snap.focusNeighbors;
      if (this._graph) {
        this._graph.graphData({ nodes: this._gfNodes, links: this._gfLinks });
        this._renderGraphData();
      }
    },
    // Fold the absorbed node into the survivor in the loaded graph: repoint its
    // links onto the survivor, drop it from master data + adjacency, re-render.
    _absorbNode(dupId, survivorId) {
      const survivor = this._nodeById[survivorId];
      const links = [];
      for (const l of this._gfLinks) {
        let s = typeof l.source === 'object' ? l.source.id : l.source;
        let t = typeof l.target === 'object' ? l.target.id : l.target;
        if (s === dupId) { l.source = survivor || survivorId; s = survivorId; }
        if (t === dupId) { l.target = survivor || survivorId; t = survivorId; }
        if (s === t) continue;   // drop self-loops created by the repoint
        links.push(l);
      }
      this._gfLinks = links;
      this._gfNodes = this._gfNodes.filter(n => n.id !== dupId);
      delete this._nodeById[dupId];
      // Adjacency: move the dup's neighbors onto the survivor.
      const dupAdj = this._adj[dupId] || new Set();
      for (const nb of dupAdj) {
        if (this._adj[nb]) {
          this._adj[nb].delete(dupId);
          if (nb !== survivorId) this._adj[nb].add(survivorId);
        }
        if (nb !== survivorId) (this._adj[survivorId] = this._adj[survivorId] || new Set()).add(nb);
      }
      if (this._adj[survivorId]) this._adj[survivorId].delete(survivorId);
      delete this._adj[dupId];
      this.nodeCount = this._gfNodes.length;
      this.edgeCount = this._gfLinks.length;
      // Focus bookkeeping.
      if (this.focusId === dupId) {
        this.focusOn(survivorId);   // re-focus the survivor (recomputes keep/neighbors)
        return;
      }
      if (this._focusKeep && this._focusKeep.has(dupId)) {
        this._focusKeep.delete(dupId);
        this._focusKeep.add(survivorId);
      }
      if (this.focusId !== null) this._focusNeighbors = new Set(this._adj[this.focusId] || []);
      this._renderGraphData();
    },

    _toast(message, type) {
      if (window.axiToast) window.axiToast({ message, type: type || 'info' });
      else console.log('[brain3d]', message);
    },
  };
}
