{% extends "_base.html" %}
{% block title %}Cerebro 3D · Axi{% endblock %}

{% block content %}
<!-- When this page is loaded inside the dashboard's brain modal iframe, the
     modal already provides its own header ("🧠 Cerebro 3D · Cerrar"), so the
     global nav header from _base.html (LifeOS logo, clock, VRAM, menu) is
     redundant and looks like a nested/duplicated header. Hide it when embedded.
     Standalone navigation to /brain3d still shows the full nav. -->
<style>html.embedded body > header { display: none !important; }</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<div class="space-y-4" x-data="brain3dPage()" x-init="load()">

  <!-- ─── header ─── -->
  <div class="flex justify-between items-baseline flex-wrap gap-2">
    <h1 class="text-2xl font-semibold" x-text="tUi('title')"></h1>
    <div class="flex items-center gap-3 text-sm">
      <span class="muted" x-text="nodeCount + ' ' + tUi('nodes') + ' · ' + edgeCount + ' ' + tUi('relations')"></span>
      <!-- Partial indicator: cross-domain edges temporarily unavailable -->
      <template x-if="partial">
        <span class="text-xs px-2 py-0.5 rounded-full" style="background:var(--panel2);color:var(--amber)">
          ⚠ Solo red local (conexiones entre dominios no disponibles)
        </span>
      </template>
    </div>
  </div>

  <!-- ─── loading state ─── -->
  <template x-if="loading">
    <div class="panel p-12 text-center">
      <div class="muted" x-text="tUi('loading')"></div>
      <div class="muted text-xs mt-2" x-text="tUi('loadingSub')"></div>
    </div>
  </template>

  <!-- ─── empty state ─── -->
  <template x-if="!loading && nodeCount === 0">
    <div class="panel p-12 text-center">
      <div class="muted text-lg" x-text="tUi('empty')"></div>
      <div class="text-sm muted mt-2" x-text="tUi('emptyHint')"></div>
    </div>
  </template>

  <!-- ─── main layout: 3D canvas + sidebar ─── -->
  <template x-if="!loading && nodeCount > 0">
    <div class="flex gap-4" style="height: 75vh; min-height: 400px;">

      <!-- 3D graph canvas -->
      <div class="flex-1 panel" style="position:relative; overflow:hidden; border-radius:0.75rem;">
        <div id="brain3d-graph" style="width:100%; height:100%;"></div>

        <!-- Legend overlay -->
        <div class="absolute top-3 left-3 panel2 p-2 text-xs space-y-1" style="max-width:160px; border-radius:0.5rem;">
          <div class="muted font-semibold mb-1" x-text="tUi('domainLegend')"></div>
          <template x-for="[domain, color] in Object.entries(DOMAIN_COLOR)" :key="domain">
            <div class="flex items-center gap-2">
              <span style="width:10px;height:10px;border-radius:50%;flex-shrink:0;"
                    :style="'background:' + color"></span>
              <span x-text="tLabel(domain)"></span>
            </div>
          </template>
        </div>

        <!-- Instructions hint -->
        <div class="absolute bottom-3 left-3 muted text-xs panel2 p-1.5" style="border-radius:0.5rem; opacity:0.8;"
             x-text="tUi('controls')"></div>
      </div>

      <!-- ─── node sidebar ─── -->
      <div id="node-sidebar" class="panel p-4 text-sm flex-shrink-0"
           style="width: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem;">

        <template x-if="!selectedNode">
          <div class="muted text-center py-8">
            <div style="font-size:2rem">🧠</div>
            <div class="mt-2" x-text="tUi('clickNode')"></div>
          </div>
        </template>

        <template x-if="selectedNode">
          <div>
            <!-- Node header -->
            <div class="font-semibold text-base mb-1" x-text="selectedNode.label"></div>
            <div class="muted text-xs space-y-0.5">
              <div>
                <span class="font-medium" x-text="tUi('typeLabel') + ':'"></span>
                <span x-text="tLabel(selectedNode.kind)"></span>
              </div>
              <div x-show="selectedNode.domain">
                <span class="font-medium" x-text="tUi('domainLabel') + ':'"></span>
                <span x-text="tLabel(selectedNode.domain)"></span>
              </div>
              <div>
                <span class="font-medium">Embedding:</span>
                <span x-text="selectedNode.has_embedding ? '✓ ' + tUi('yes') : '—'"></span>
              </div>
            </div>

            <!-- Connected edges -->
            <template x-if="neighborEdges.length > 0">
              <div class="mt-4">
                <div class="font-semibold text-xs muted mb-2"><span x-text="tUi('connections')"></span> (<span x-text="neighborEdges.length"></span>)</div>
                <div class="space-y-1.5 max-h-64 overflow-y-auto">
                  <template x-for="edge in neighborEdges" :key="edge._key">
                    <div class="panel2 p-2 text-xs rounded">
                      <div class="font-medium" x-text="tEdge(edge.kind)"></div>
                      <div class="muted mt-0.5" x-text="edge.direction + ' ' + edge.neighborLabel"></div>
                      <div x-show="edge.system" class="muted text-xs" x-text="tUi('system') + ' ' + edge.system"></div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <template x-if="neighborEdges.length === 0">
              <div class="muted text-xs mt-3">Sin conexiones visibles</div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<!-- Vendored 3d-force-graph (no CDN) — bundles Three.js internally -->
<script src="/static/vendor/3d-force-graph.min.js"></script>

<script>
// HTML-escape helper — prevents stored XSS when node labels are injected as HTML.
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// UI language injected by the server from the 'language' config key.
// 'es-MX' → 'es', 'en-US' → 'en'. Defaults to 'es'.
const LANG = '{{ lang | default("es") }}';

// Domain-to-color map — consistent palette across all renders.
// Keys are canonical English identifiers; displayed text uses tLabel/tEdge.
const DOMAIN_COLOR = {
  relationships: '#FF6B9D',  // pink
  health:        '#22cc55',  // green
  finance:       '#ffaa33',  // amber
  conversation:  '#33aaff',  // blue
  fact:          '#00D4AA',  // teal
  event:         '#ee55ff',  // purple
  meeting:       '#ff8844',  // orange
  exercise:      '#44ddff',  // cyan
  learning:      '#bbff44',  // lime
  spirituality:  '#ff44aa',  // rose
  default:       '#888888',  // grey
};

// i18n label maps for domain/kind keys and edge kind keys.
// Add a new locale by extending with a new top-level key.
// Unknown keys fall back to the raw canonical key (graceful degradation).
const LABELS = {
  es: {
    // Domains + kinds
    relationships: 'Relaciones',
    health:        'Salud',
    finance:       'Finanzas',
    conversation:  'Conversación',
    fact:          'Hecho',
    event:         'Evento',
    'lifeos-events': 'Evento',
    meeting:       'Reunión',
    exercise:      'Ejercicio',
    learning:      'Aprendizaje',
    spirituality:  'Espiritualidad',
    person:        'Persona',
    default:       'General',
    // Edge kinds
    'similar-to':       'Similar a',
    'same-day':         'Mismo día',
    'happened-at':      'Ocurrió en',
    'involves-person':  'Involucra a',
    'mentioned_in':     'Mencionado en',
    'has_setup':        'Configuración',
    // Static UI chrome strings
    ui: {
      title:        'Cerebro 3D',
      nodes:        'nodos',
      relations:    'relaciones',
      loading:      'Cargando grafo 3D…',
      loadingSub:   'Preparando neuronas y conexiones',
      empty:        'No hay nodos para visualizar',
      emptyHint:    'Habla con Axi para que empiece a construir su red de memoria.',
      domainLegend: 'Dominio',
      controls:     'Orbitar: arrastrar · Zoom: scroll · Click: seleccionar nodo',
      clickNode:    'Haz click en un nodo para ver sus detalles',
      typeLabel:    'Tipo',
      domainLabel:  'Dominio',
      yes:          'Sí',
      connections:  'Conexiones',
      system:       'sistema',
    },
  },
  en: {
    // Domains + kinds
    relationships: 'Relationships',
    health:        'Health',
    finance:       'Finance',
    conversation:  'Conversation',
    fact:          'Fact',
    event:         'Event',
    'lifeos-events': 'Event',
    meeting:       'Meeting',
    exercise:      'Exercise',
    learning:      'Learning',
    spirituality:  'Spirituality',
    person:        'Person',
    default:       'General',
    // Edge kinds
    'similar-to':       'Similar to',
    'same-day':         'Same day',
    'happened-at':      'Happened at',
    'involves-person':  'Involves',
    'mentioned_in':     'Mentioned in',
    'has_setup':        'Setup',
    // Static UI chrome strings
    ui: {
      title:        '3D Brain',
      nodes:        'nodes',
      relations:    'connections',
      loading:      'Loading 3D graph…',
      loadingSub:   'Preparing neurons and connections',
      empty:        'No nodes to display',
      emptyHint:    'Talk to Axi so it starts building your memory network.',
      domainLegend: 'Domain',
      controls:     'Orbit: drag · Zoom: scroll · Click: select node',
      clickNode:    'Click a node to see its details',
      typeLabel:    'Type',
      domainLabel:  'Domain',
      yes:          'Yes',
      connections:  'Connections',
      system:       'system',
    },
  },
};

/**
 * Translate a domain or node kind key to the current UI language.
 * Falls back to the raw key when no translation exists (future-safe).
 */
function tLabel(key) {
  if (!key) return key;
  const map = LABELS[LANG] || LABELS['es'];
  return map[key] !== undefined ? map[key] : key;
}

/**
 * Translate an edge kind key to the current UI language.
 * Falls back to the raw key when no translation exists.
 */
function tEdge(key) {
  if (!key) return key;
  const map = LABELS[LANG] || LABELS['es'];
  return map[key] !== undefined ? map[key] : key;
}

/**
 * Translate a static UI chrome string key to the current UI language.
 * Falls back to the es value, then to the raw key (graceful degradation).
 */
function tUi(key) {
  if (!key) return key;
  const ui = (LABELS[LANG] || LABELS['es']).ui || LABELS['es'].ui || {};
  return ui[key] !== undefined ? ui[key] : (LABELS['es'].ui || {})[key] || key;
}

function brain3dPage() {
  return {
    loading: true,
    nodeCount: 0,
    edgeCount: 0,
    partial: false,
    selectedNode: null,
    neighborEdges: [],
    _graphData: null,
    _graph: null,
    DOMAIN_COLOR,  // expose for Alpine x-for

    async load() {
      this.loading = true;
      this.selectedNode = null;
      try {
        const resp = await fetch('/api/graph/full');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        this._graphData = data;
        this.nodeCount = data.nodes.length;
        this.edgeCount = data.edges.length;
        this.partial = !!data.partial;
        this.loading = false;
        if (data.nodes.length > 0) {
          this.$nextTick(() => this._render(data));
        }
      } catch (e) {
        console.error('[brain3d] fetch failed:', e);
        this.loading = false;
      }
    },

    _render(data) {
      const container = document.getElementById('brain3d-graph');
      if (!container || typeof ForceGraph3D === 'undefined') return;

      // Convert /api/graph/full format to 3d-force-graph format.
      const nodeById = {};
      const gfNodes = data.nodes.map(n => {
        // Color by domain when set; most nodes (conversations/facts) carry a
        // kind but no domain, so fall back to kind, then to the grey default.
        const color = DOMAIN_COLOR[n.domain] || DOMAIN_COLOR[n.kind] || DOMAIN_COLOR['default'];
        const gn = { id: n.id, label: n.label, kind: n.kind, domain: n.domain, has_embedding: n.has_embedding, color };
        nodeById[n.id] = gn;
        return gn;
      });
      const gfLinks = data.edges.map(e => ({
        source: e.source,
        target: e.target,
        kind: e.kind,
        system: e.system,
        // Visual distinction: dashed-style color for similar-to vs explicit edges.
        color: e.kind === 'similar-to' ? '#3a5a6a' : '#5a7a4a',
      }));

      const self = this;

      this._graph = ForceGraph3D()(container)
        .backgroundColor('#0b0e13')
        .showNavInfo(false)
        .nodeLabel(n => `<div style="background:#1a1f2b;color:#e6edf3;padding:4px 8px;border-radius:4px;font-size:12px;max-width:200px">${escHtml(n.label)}</div>`)
        .nodeColor(n => n.color)
        .nodeOpacity(0.9)
        .nodeVal(n => n.has_embedding ? 4 : 2)
        .linkColor(l => l.color)
        .linkOpacity(0.5)
        .linkWidth(l => l.system === 'B' ? 2 : 1)
        .graphData({ nodes: gfNodes, links: gfLinks })
        .onNodeClick(node => {
          self._selectNode(node, data.edges, nodeById);
        });

      // 3d-force-graph locks the canvas to the container size at creation. Inside
      // the dashboard's modal iframe the container often isn't at its final size
      // yet (and the window can be resized), so keep the canvas synced to the
      // container — otherwise the graph stays frozen in a tiny strip.
      const syncSize = () => {
        if (!self._graph) return;
        self._graph.width(container.clientWidth).height(container.clientHeight);
      };
      syncSize();
      if (window.ResizeObserver) {
        if (self._resizeObs) self._resizeObs.disconnect();
        self._resizeObs = new ResizeObserver(syncSize);
        self._resizeObs.observe(container);
      } else {
        window.addEventListener('resize', syncSize);
      }
    },

    _selectNode(node, edges, nodeById) {
      this.selectedNode = node;
      // Build neighbor edge list.
      const nid = node.id;
      this.neighborEdges = edges
        .filter(e => e.source === nid || e.target === nid)
        .map((e, i) => {
          const isOutbound = e.source === nid;
          const neighborId = isOutbound ? e.target : e.source;
          const neighbor = nodeById[neighborId];
          return {
            _key: i,
            kind: e.kind,
            system: e.system,
            direction: isOutbound ? '→' : '←',
            neighborLabel: neighbor ? neighbor.label : String(neighborId),
          };
        });
    },
  };
}
</script>
{% endblock %}
