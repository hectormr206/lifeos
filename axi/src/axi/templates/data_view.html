{% extends "_base.html" %}
{% block title %}{{ name }} — datos · Axi{% endblock %}

{% block content %}
<div x-data="dataView()" x-init="load()" class="max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-3 gap-2">
    <div class="font-semibold text-base md:text-lg">
      {{ name }}
      <span class="muted text-sm" x-show="!loading" x-cloak x-text="'· ' + entries.length + ' registro(s)'"></span>
    </div>
    <a href="/chat" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">+ Agregar (chat)</a>
  </div>

  <template x-if="error">
    <div class="text-sm px-3 py-2 rounded-lg mb-2"
         style="background: rgba(238,51,51,0.1); color: var(--red); border: 1px solid var(--red)"
         x-text="error"></div>
  </template>

  <template x-if="loading">
    <div class="muted text-sm text-center py-8">Cargando registros…</div>
  </template>

  <template x-if="!loading && entries.length === 0">
    <div class="muted text-sm text-center py-8">
      Todavía no hay registros de {{ name }}. Contale a Axi en el chat y aparecen acá.
    </div>
  </template>

  <div class="space-y-2">
    <template x-for="e in entries" :key="e.id">
      <div class="panel p-3 flex items-start justify-between gap-3">
        <div class="min-w-0 flex-1">
          <div class="muted text-xs mb-0.5">
            <span x-text="e.date"></span>
            <span x-show="e.kind" x-text="' · ' + e.kind"></span>
          </div>
          <!-- Normal title display -->
          <template x-if="editId !== e.id">
            <div>
              <div class="text-sm md:text-base break-words" x-text="e.title || '(sin título)'"></div>
              <template x-if="e.summary">
                <div class="text-xs mt-0.5" style="color: var(--blue);" x-text="e.summary"></div>
              </template>
            </div>
          </template>
          <!-- Inline title-only edit (when this entry has no edit_fields) -->
          <template x-if="editId === e.id && !(e.edit_fields && e.edit_fields.length)">
            <div class="flex items-center gap-1 mt-0.5">
              <input type="text" x-model="draftTitle"
                     @keydown.enter="save(e)"
                     @keydown.escape="cancelEdit()"
                     class="border rounded px-2 py-0.5 text-sm flex-1"
                     style="border-color: var(--border); background: var(--surface); color: inherit;"
                     :id="'edit-' + e.id"
                     x-effect="editId === e.id && $nextTick(() => { const el = document.getElementById('edit-' + e.id); if (el) el.focus(); })" />
              <button type="button" @click="save(e)"
                      class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.78rem;">Guardar</button>
              <button type="button" @click="cancelEdit()"
                      class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.78rem;">Cancelar</button>
            </div>
          </template>
          <!-- Multi-field edit form (when this entry declares edit_fields) -->
          <template x-if="editId === e.id && e.edit_fields && e.edit_fields.length">
            <div class="mt-1 space-y-1.5">
              <template x-for="f in e.edit_fields" :key="f.key">
                <div class="flex flex-col gap-0.5">
                  <label class="text-xs muted" x-text="f.label"></label>
                  <input :type="f.type === 'number' ? 'number' : 'text'"
                         x-model="editDraft[f.key]"
                         class="border rounded px-2 py-0.5 text-sm w-full"
                         style="border-color: var(--border); background: var(--surface); color: inherit;" />
                </div>
              </template>
              <div class="flex gap-1 mt-1">
                <button type="button" @click="save(e)"
                        class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.78rem;">Guardar</button>
                <button type="button" @click="cancelEdit()"
                        class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.78rem;">Cancelar</button>
              </div>
            </div>
          </template>
        </div>
        <div class="shrink-0 flex items-center gap-1">
          <!-- Edit button (hidden while editing or confirming delete) -->
          <template x-if="editId !== e.id && confirmId !== e.id">
            <button type="button" @click="startEdit(e)"
                    class="btn" style="padding: 0.3rem 0.55rem; font-size: 0.9rem;"
                    title="Editar título">✏</button>
          </template>
          <!-- Delete with confirmation (hidden while editing) -->
          <template x-if="editId !== e.id">
            <div>
              <template x-if="confirmId !== e.id">
                <button type="button" @click="confirmId = e.id"
                        class="btn" style="padding: 0.3rem 0.55rem; font-size: 0.9rem;"
                        title="Borrar">🗑</button>
              </template>
              <template x-if="confirmId === e.id">
                <div class="flex items-center gap-1">
                  <span class="text-xs muted">¿Borrar?</span>
                  <button type="button" @click="del(e)"
                          class="btn" style="padding: 0.25rem 0.55rem; font-size: 0.8rem; background: rgba(238,51,51,0.2); border-color: var(--red);"
                  >Sí</button>
                  <button type="button" @click="confirmId = null"
                          class="btn" style="padding: 0.25rem 0.55rem; font-size: 0.8rem;"
                  >No</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
function dataView() {
  return {
    domain: '{{ domain }}',
    entries: [],
    loading: true,
    confirmId: null,
    editId: null,
    draftTitle: '',
    editFields: null,
    editDraft: {},
    error: null,

    async load() {
      this.loading = true;
      this.error = null;
      try {
        const r = await fetch('/api/data/' + this.domain + '?limit=200');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        this.entries = d.entries || [];
        this.editFields = d.edit_fields || null;
      } catch (e) {
        this.error = 'No pude cargar los registros: ' + (e.message || e);
      } finally {
        this.loading = false;
      }
    },

    startEdit(e) {
      this.editId = e.id;
      this.confirmId = null;
      // edit_fields is PER-ENTRY (health's vital fields differ by type).
      if (e.edit_fields && e.edit_fields.length) {
        this.editDraft = { ...(e.fields || {}) };
      } else {
        this.draftTitle = e.title || '';
      }
    },

    cancelEdit() {
      this.editId = null;
      this.draftTitle = '';
      this.editDraft = {};
    },

    async save(e) {
      if (e.edit_fields && e.edit_fields.length) {
        // Multi-field save
        const changes = {};
        for (const f of e.edit_fields) {
          changes[f.key] = f.type === 'number'
            ? (this.editDraft[f.key] !== '' && this.editDraft[f.key] !== undefined ? Number(this.editDraft[f.key]) : 0)
            : (this.editDraft[f.key] || '');
        }
        if ('title' in changes && !String(changes.title).trim()) {
          this.error = 'El título no puede estar vacío.'; return;
        }
        try {
          const r = await fetch('/api/data/' + this.domain + '/' + encodeURIComponent(e.id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(changes),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          await this.load();
        } catch (err) {
          this.error = 'No pude guardar: ' + (err.message || err);
        } finally {
          this.editId = null;
          this.editDraft = {};
        }
      } else {
        // Title-only save (original behavior)
        const newTitle = this.draftTitle.trim();
        if (!newTitle) { this.error = 'El título no puede estar vacío.'; return; }
        try {
          const r = await fetch('/api/data/' + this.domain + '/' + encodeURIComponent(e.id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          // Update in place
          const idx = this.entries.findIndex(x => x.id === e.id);
          if (idx !== -1) this.entries[idx] = { ...this.entries[idx], title: newTitle };
        } catch (err) {
          this.error = 'No pude guardar: ' + (err.message || err);
        } finally {
          this.editId = null;
          this.draftTitle = '';
        }
      }
    },

    async del(e) {
      try {
        const r = await fetch('/api/data/' + this.domain + '/' + encodeURIComponent(e.id), { method: 'DELETE' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        this.entries = this.entries.filter(x => x.id !== e.id);
        if (navigator.vibrate) navigator.vibrate(30);
      } catch (err) {
        this.error = 'No pude borrar: ' + (err.message || err);
      } finally {
        this.confirmId = null;
      }
    },
  };
}
</script>
{% endblock %}
