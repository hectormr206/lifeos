{% extends "_base.html" %}
{% block title %}Desarrollo · Axi{% endblock %}

{% block content %}
<div x-data="devEnvs()" x-init="init()" class="max-w-4xl mx-auto">

  <div class="flex items-center justify-between mb-4 gap-2">
    <div>
      <h1 class="text-xl font-semibold">🛠️ Desarrollo</h1>
      <p class="muted text-xs mt-0.5">Ambientes donde Axi construye, probás aislado, y recién después desplegás.</p>
    </div>
    <div class="flex gap-2">
      <button type="button" @click="load()" class="btn" style="padding: 0.35rem 0.8rem; font-size: 0.85rem;"
              :disabled="loading">↺</button>
      <button type="button" @click="openCreate()" class="btn btn-primary"
              style="padding: 0.35rem 0.9rem; font-size: 0.9rem;">+ Nuevo</button>
    </div>
  </div>

  <template x-if="error">
    <div class="text-sm px-3 py-2 rounded-lg mb-3"
         style="background: rgba(238,51,51,0.1); color: var(--red); border: 1px solid var(--red)"
         x-text="error"></div>
  </template>

  <template x-if="loading && envs.length === 0">
    <div class="muted text-sm text-center py-10">Cargando ambientes…</div>
  </template>

  <template x-if="!loading && envs.length === 0">
    <div class="muted text-sm text-center py-10">
      No hay ambientes todavía. Tocá <span class="font-semibold">+ Nuevo</span> y contale a Axi qué construir.
    </div>
  </template>

  <!-- Cards -->
  <div class="grid gap-3 sm:grid-cols-2">
    <template x-for="e in envs" :key="e.env_id">
      <div class="panel p-4 flex flex-col">

        <div class="flex items-start justify-between gap-2 mb-1">
          <div class="font-semibold text-sm md:text-base break-words flex-1 min-w-0"
               x-text="e.title || e.goal || '(sin título)'"></div>
          <span class="shrink-0 px-2 py-0.5 rounded text-xs font-mono"
                :style="badgeStyle(e.card_status)" x-text="statusLabel(e.card_status)"></span>
        </div>

        <div class="muted text-xs mb-2" x-show="e.created_at" x-text="fmtDate(e.created_at)"></div>

        <div class="text-sm mb-3 break-words" x-text="e.description || e.goal"></div>

        <!-- developing spinner -->
        <template x-if="e.card_status === 'developing'">
          <div class="text-xs muted mb-2 flex items-center gap-2">
            <span class="inline-block animate-pulse">●</span>
            <span x-text="'Axi está construyendo' + (e.rounds_done ? (' · ronda ' + e.rounds_done) : '') + '…'"></span>
          </div>
        </template>

        <!-- needs_human -->
        <template x-if="e.card_status === 'needs_human'">
          <div class="text-xs mb-3 px-3 py-2 rounded"
               style="background: rgba(245,158,11,0.1); border: 1px solid var(--amber); color: var(--amber)">
            <span class="font-semibold">Requiere revisión: </span><span x-text="e.escalation_reason"></span>
          </div>
        </template>

        <!-- error -->
        <template x-if="e.card_status === 'error' && e.error">
          <div class="text-xs mb-3 px-3 py-2 rounded"
               style="background: rgba(238,51,51,0.1); border: 1px solid var(--red); color: var(--red)"
               x-text="e.error"></div>
        </template>

        <!-- instance running banner -->
        <template x-if="e.instance && e.instance.status === 'running'">
          <div class="text-xs mb-2 px-3 py-1.5 rounded flex items-center gap-2"
               style="background: rgba(0,180,160,0.1); border: 1px solid var(--teal); color: var(--teal)">
            <span>▶ Instancia en</span>
            <span class="font-mono" x-text="e.instance.url"></span>
          </div>
        </template>

        <!-- deployed banner -->
        <template x-if="e.card_status === 'deployed'">
          <div class="text-xs mb-2 px-3 py-2 rounded"
               style="background: rgba(0,180,160,0.1); border: 1px solid var(--teal); color: var(--teal)">
            🚀 Desplegado a <span class="font-mono" x-text="e.deployed_target || 'main'"></span>.
            En la laptop: <span class="font-mono">git pull &amp;&amp; systemctl --user restart axi-dashboard axi-voice</span>
          </div>
        </template>

        <div class="flex-1"></div>

        <!-- Actions -->
        <div class="flex flex-wrap gap-2 mt-1">
          <!-- Probar / Abrir UI: available once there's a worktree (ready or needs_human) -->
          <template x-if="['ready','needs_human','deployed'].includes(e.card_status)">
            <button type="button" class="btn btn-primary" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;"
                    @click="openUI(e)" :disabled="busy[e.env_id]">
              <span x-text="(e.instance && e.instance.status === 'running') ? '↗ Abrir UI' : '▶ Probar'"></span>
            </button>
          </template>
          <template x-if="e.instance && e.instance.status === 'running'">
            <button type="button" class="btn" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;"
                    @click="stopInstance(e)" :disabled="busy[e.env_id]">■ Detener</button>
          </template>
          <template x-if="['ready','needs_human'].includes(e.card_status)">
            <button type="button" class="btn" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;"
                    @click="openIterate(e)" :disabled="busy[e.env_id]">↻ Iterar</button>
          </template>
          <template x-if="['ready','needs_human'].includes(e.card_status)">
            <button type="button" class="btn btn-primary"
                    style="padding: 0.3rem 0.7rem; font-size: 0.8rem; background: var(--teal); border-color: var(--teal);"
                    @click="deploy(e)" :disabled="busy[e.env_id]">🚀 Deploy</button>
          </template>
          <template x-if="['ready','needs_human','error'].includes(e.card_status)">
            <button type="button" class="btn" style="padding: 0.3rem 0.7rem; font-size: 0.8rem; color: var(--red);"
                    @click="reject(e)" :disabled="busy[e.env_id]">🗑 Rechazar</button>
          </template>
          <template x-if="['ready','needs_human','deployed'].includes(e.card_status)">
            <button type="button" class="btn" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;"
                    @click="toggleDiff(e)">⟂ Diff</button>
          </template>
        </div>

        <!-- Diff -->
        <template x-if="detail[e.env_id] && detail[e.env_id].open">
          <pre class="mt-3 text-xs overflow-x-auto p-2 rounded"
               style="background: var(--panel2); max-height: 320px;"
               x-text="detail[e.env_id].diff || (detail[e.env_id].loading ? 'Cargando…' : '(sin cambios)')"></pre>
        </template>

      </div>
    </template>
  </div>

  <!-- Create / Iterate modal (one component, two modes) -->
  <template x-if="modal.open">
    <div class="fixed inset-0 flex items-center justify-center p-4" style="z-index: 60; background: rgba(0,0,0,0.7);"
         @click="closeModal()">
      <div class="panel p-4 w-full max-w-lg" @click.stop>
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold"
              x-text="modal.mode === 'iterate' ? 'Iterar sobre el ambiente' : 'Nuevo ambiente de desarrollo'"></h2>
          <button type="button" @click="closeModal()" class="muted">✕</button>
        </div>
        <p class="muted text-xs mb-2"
           x-text="modal.mode === 'iterate'
             ? 'Decile a Axi qué ajustar o agregar. Sigue sobre lo que ya construyó, en el mismo worktree.'
             : 'Contale a Axi qué querés construir. Podés escribir o mantener presionado el micrófono para dictarlo.'"></p>
        <div class="flex items-end gap-2">
          <textarea x-model="modal.text" rows="4"
                    class="flex-1 rounded-lg p-2 text-sm"
                    style="background: var(--panel2); border: 1px solid var(--border); resize: vertical;"
                    :placeholder="modal.mode === 'iterate'
                      ? 'Ej: el botón quedó muy chico, agrandalo y movelo arriba a la derecha…'
                      : 'Ej: agregá un tablero kanban a la vista de Salud con columnas por estado…'"></textarea>
          <button type="button"
                  @mousedown.prevent="startRec()" @mouseup.prevent="stopRec()" @mouseleave="stopRec()"
                  @touchstart.prevent="startRec()" @touchend.prevent="stopRec()" @touchcancel="stopRec()"
                  class="btn btn-primary"
                  :style="recording
                    ? 'border-radius: 9999px; min-height: 2.75rem; min-width: 2.75rem; padding: 0; background: rgba(238,51,51,0.9); border-color: var(--red);'
                    : 'border-radius: 9999px; min-height: 2.75rem; min-width: 2.75rem; padding: 0;'"
                  title="Mantené presionado para dictar">
            <span x-show="!recording && !transcribing">🎤</span>
            <span x-show="recording" x-cloak>●</span>
            <span x-show="transcribing && !recording" x-cloak>⏳</span>
          </button>
        </div>
        <div class="flex justify-end gap-2 mt-3">
          <button type="button" @click="closeModal()" class="btn" style="padding: 0.35rem 0.9rem;">Cancelar</button>
          <button type="button" @click="submitModal()" class="btn btn-primary" style="padding: 0.35rem 0.9rem;"
                  :disabled="modal.busy || !modal.text.trim()">
            <span x-text="modal.busy ? 'Lanzando…' : (modal.mode === 'iterate' ? 'Iterar' : 'Crear ambiente')"></span>
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="/static/recorder.js"></script>
<script>
function devEnvs() {
  return {
    envs: [],
    loading: true,
    error: null,
    // One modal serves both "create" and "iterate" (DRY).
    modal: { open: false, mode: 'create', envId: null, text: '', busy: false },
    recording: false,
    transcribing: false,
    _recorder: null,
    detail: {},
    busy: {},
    _poll: null,

    init() {
      this.load();
      // Poll while anything is still developing so the cards advance on their own.
      this._poll = setInterval(() => {
        if (this.envs.some(e => e.card_status === 'developing')) this.load();
      }, 5000);
    },

    async load() {
      try {
        const r = await fetch('/api/dev-envs');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        this.envs = await r.json();
        this.error = null;
      } catch (e) {
        this.error = 'No pude cargar los ambientes: ' + e.message;
      } finally {
        this.loading = false;
      }
    },

    openCreate() { this.modal = { open: true, mode: 'create', envId: null, text: '', busy: false }; this.error = null; },
    openIterate(e) { this.modal = { open: true, mode: 'iterate', envId: e.env_id, text: '', busy: false }; this.error = null; },
    closeModal() { if (this.recording) this.stopRec(); this.modal = { ...this.modal, open: false }; },

    async submitModal() {
      const text = this.modal.text.trim();
      if (!text) return;
      const isIter = this.modal.mode === 'iterate';
      this.modal = { ...this.modal, busy: true };
      try {
        const url = isIter
          ? '/api/dev-envs/' + encodeURIComponent(this.modal.envId) + '/iterate'
          : '/api/dev-envs';
        const body = isIter ? { prompt: text } : { goal: text };
        const r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) { const d = await r.text(); throw new Error('HTTP ' + r.status + ': ' + d); }
        this.modal = { ...this.modal, open: false };
        await this.load();
      } catch (e) {
        this.error = 'No pude ' + (isIter ? 'iterar' : 'crear el ambiente') + ': ' + e.message;
      } finally {
        this.modal = { ...this.modal, busy: false };
      }
    },

    // ── Voice dictation into the modal text (shared recorder) ─────────────────
    ensureRecorder() {
      if (this._recorder) return;
      this._recorder = window.createSegmentedRecorder({
        onText: (text) => { this.modal.text = this.modal.text ? (this.modal.text + ' ' + text) : text; },
        onError: (msg) => { this.error = msg; },
        onState: ({ recording, transcribing }) => { this.recording = recording; this.transcribing = transcribing; },
      });
    },
    startRec() { if (this.recording || this.transcribing) return; this.ensureRecorder(); this._recorder.start(); },
    stopRec() { if (this._recorder) this._recorder.stop(); },

    // ── Card actions ──────────────────────────────────────────────────────────
    async openUI(e) {
      // If the instance is already running, just open it.
      if (e.instance && e.instance.status === 'running' && e.instance.url) {
        window.open(e.instance.url, '_blank');
        return;
      }
      this.busy = { ...this.busy, [e.env_id]: true };
      try {
        const r = await fetch('/api/dev-envs/' + encodeURIComponent(e.env_id) + '/instance/start', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
        const url = d.instance && d.instance.url;
        await this.load();
        if (url) {
          // Give the dashboard a couple seconds to boot, then open it.
          setTimeout(() => window.open(url, '_blank'), 2500);
        }
      } catch (err) {
        this.error = 'No pude levantar la instancia: ' + err.message;
      } finally {
        this.busy = { ...this.busy, [e.env_id]: false };
      }
    },

    async stopInstance(e) {
      this.busy = { ...this.busy, [e.env_id]: true };
      try {
        await fetch('/api/dev-envs/' + encodeURIComponent(e.env_id) + '/instance/stop', { method: 'POST' });
        await this.load();
      } finally {
        this.busy = { ...this.busy, [e.env_id]: false };
      }
    },

    async deploy(e) {
      if (!confirm('¿Desplegar a producción? Aplica el cambio a main y lo pushea directo (sin PR). ¿Ya lo probaste en la instancia aislada?')) return;
      this.busy = { ...this.busy, [e.env_id]: true };
      try {
        const r = await fetch('/api/dev-envs/' + encodeURIComponent(e.env_id) + '/deploy', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
        await this.load();
        alert(d.restart_hint || 'Desplegado a main.');
      } catch (err) {
        this.error = 'No pude desplegar: ' + err.message;
      } finally {
        this.busy = { ...this.busy, [e.env_id]: false };
      }
    },

    async reject(e) {
      if (!confirm('¿Rechazar y borrar este ambiente? Se elimina el worktree (no toca main).')) return;
      this.busy = { ...this.busy, [e.env_id]: true };
      try {
        const r = await fetch('/api/dev-envs/' + encodeURIComponent(e.env_id) + '/reject', { method: 'POST' });
        if (!r.ok) { const d = await r.text(); throw new Error(d); }
        await this.load();
      } catch (err) {
        this.error = 'No pude rechazar: ' + err.message;
      } finally {
        this.busy = { ...this.busy, [e.env_id]: false };
      }
    },

    async toggleDiff(e) {
      const cur = this.detail[e.env_id] || {};
      if (cur.open) { this.detail = { ...this.detail, [e.env_id]: { ...cur, open: false } }; return; }
      this.detail = { ...this.detail, [e.env_id]: { open: true, loading: true, diff: '' } };
      try {
        const r = await fetch('/api/dev-envs/' + encodeURIComponent(e.env_id));
        const d = await r.json();
        this.detail = { ...this.detail, [e.env_id]: { open: true, loading: false, diff: d.diff || '' } };
      } catch (err) {
        this.detail = { ...this.detail, [e.env_id]: { open: true, loading: false, diff: 'No pude cargar el diff.' } };
      }
    },

    // ── Display helpers ─────────────────────────────────────────────────────────
    statusLabel(cs) {
      return {
        developing: 'Desarrollando…',
        ready: 'Listo para probar',
        needs_human: 'Requiere revisión',
        error: 'Error',
        deploying: 'Desplegando…',
        deployed: 'Desplegado',
        rejected: 'Rechazado',
      }[cs] || cs;
    },
    badgeStyle(cs) {
      const map = {
        developing: ['rgba(96,165,250,0.15)', 'var(--blue, #60a5fa)'],
        ready: ['rgba(0,180,160,0.15)', 'var(--teal)'],
        needs_human: ['rgba(245,158,11,0.15)', 'var(--amber)'],
        error: ['rgba(238,51,51,0.15)', 'var(--red)'],
        deploying: ['rgba(96,165,250,0.15)', 'var(--blue, #60a5fa)'],
        deployed: ['rgba(0,180,160,0.15)', 'var(--teal)'],
        rejected: ['rgba(148,163,184,0.15)', 'var(--muted, #94a3b8)'],
      };
      const [bg, fg] = map[cs] || map.developing;
      return `background: ${bg}; color: ${fg};`;
    },
    fmtDate(s) {
      try { return new Date(s).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }); }
      catch (e) { return s; }
    },
  };
}
</script>
{% endblock %}
