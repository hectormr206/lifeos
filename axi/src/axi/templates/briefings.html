{% extends "_base.html" %}
{% block nav_briefings %}active{% endblock %}
{% block title %}Boletines · Axi{% endblock %}

{% block content %}
<div class="space-y-4" x-data="briefingsPage()" x-init="load(); startPolling()" x-destroy="stopPolling()">
  <div class="flex justify-between items-baseline gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-semibold">Boletines</h1>
      <p class="text-sm muted mt-1">
        Tareas agénticas recurrentes. Cada tarjeta muestra el último resultado.
      </p>
    </div>
    <button class="btn" @click="load()">Refrescar</button>
  </div>

  <template x-if="loading">
    <div class="muted py-12 text-center">Cargando…</div>
  </template>

  <template x-if="!loading && cards.length === 0">
    <div class="panel p-12 text-center muted">
      Todavía no hay boletines. Decile a Axi en el chat:
      "tráeme las 10 noticias tech del día todos los días a las 8".
    </div>
  </template>

  <div class="grid gap-3" x-show="cards.length > 0">
    <template x-for="c in cards" :key="c.id">
      <div class="panel p-4 space-y-3" :id="c.id">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div class="min-w-0">
            <h2 class="text-lg font-semibold"
                x-text="(c.result && c.result.title) ? c.result.title : c.action_prompt"></h2>
            <div class="text-xs muted mt-1">
              <span x-text="c.action_prompt"></span>
              <template x-if="c.recurrence">
                <span class="ml-1 px-1.5 py-0.5 panel2 rounded" x-text="'🔁 ' + c.recurrence"></span>
              </template>
            </div>
          </div>
          <div class="text-xs muted whitespace-nowrap">
            <template x-if="c.last_result_at">
              <span x-text="'Actualizado: ' + fmtWhen(c.last_result_at)"></span>
            </template>
            <template x-if="!c.last_result_at">
              <span class="muted">Aún no se ejecutó</span>
            </template>
          </div>
        </div>

        <template x-if="c.result && c.result.summary">
          <p class="text-sm" x-text="c.result.summary"></p>
        </template>

        <template x-if="visibleItems(c).length > 0">
          <ul class="space-y-3">
            <template x-for="(it, idx) in visibleItems(c)" :key="idx">
              <!-- Each item carries its own open/close state for the two expandable sections -->
              <li class="text-sm border-l-2 pl-3 space-y-1"
                  style="border-color: var(--border)"
                  x-data="{ showDetail: false, showHN: false }">

                <!-- Title in Spanish (falls back to original title, then URL) -->
                <div class="font-medium" style="color: var(--teal)"
                     x-text="it.title_es || it.title || it.url"></div>

                <!-- Concise summary -->
                <template x-if="it.summary">
                  <div class="muted text-xs" x-text="it.summary"></div>
                </template>

                <!-- Detailed summary toggle -->
                <template x-if="it.detailed_summary">
                  <div>
                    <button @click="showDetail = !showDetail"
                            class="text-xs hover:underline"
                            style="color: var(--muted)">
                      <span x-text="showDetail ? '▲ Ocultar resumen detallado' : '▼ Ver resumen detallado'"></span>
                    </button>
                    <div x-show="showDetail" x-transition
                         class="mt-1 text-xs panel2 rounded p-2 leading-relaxed"
                         x-text="it.detailed_summary"></div>
                  </div>
                </template>

                <!-- Links row: article + HN discussion -->
                <div class="flex flex-wrap gap-x-4 gap-y-0.5 text-xs mt-1">
                  <template x-if="it.url">
                    <a :href="it.url" target="_blank" rel="noopener noreferrer"
                       class="hover:underline" style="color: var(--teal)">
                      Ver noticia completa →
                    </a>
                  </template>
                  <template x-if="it.hn_url">
                    <a :href="it.hn_url" target="_blank" rel="noopener noreferrer"
                       class="hover:underline" style="color: var(--amber)">
                      Discusión en HN →
                    </a>
                  </template>
                </div>

                <!-- HN comments summary toggle -->
                <template x-if="it.hn_comments_summary">
                  <div>
                    <button @click="showHN = !showHN"
                            class="text-xs hover:underline"
                            style="color: var(--amber)">
                      <span x-text="showHN ? '▲ Ocultar opiniones de HN' : '▼ Ver opiniones de HN'"></span>
                    </button>
                    <div x-show="showHN" x-transition
                         class="mt-1 text-xs panel2 rounded p-2 leading-relaxed muted"
                         x-text="it.hn_comments_summary"></div>
                  </div>
                </template>

              </li>
            </template>
          </ul>
        </template>

        <template x-if="c.last_result_at && visibleItems(c).length === 0">
          <p class="text-sm muted" x-text="(c.result && c.result.markdown) ? c.result.markdown : 'Sin resultados estructurados.'"></p>
        </template>
      </div>
    </template>
  </div>
</div>

<script>
function briefingsPage() {
  return {
    cards: [],
    loading: true,
    _pollHandle: null,
    _didHashScroll: false,
    // Keep items that have at least one real link (article or HN discussion).
    // Items with no valid URL at all are omitted; items with only an hn_url are shown.
    visibleItems(c) {
      const items = (c && c.result && c.result.items) || [];
      return items.filter(it => it && (it.url || it.hn_url)).slice(0, 10);
    },
    async load() {
      try {
        const r = await fetch('/api/briefings');
        if (r.ok) {
          const data = await r.json();
          const next = data.briefings || [];
          // Only swap the array when the content actually changed. The list
          // polls every 15s; re-assigning identical data would tear down and
          // rebuild the DOM, yanking the reader's scroll back to the top of the
          // list on mobile mid-read. No change → no re-render → scroll stays put.
          if (JSON.stringify(next) !== JSON.stringify(this.cards)) {
            this.cards = next;
          }
          // If the URL carries a card anchor, scroll to it — but only ONCE, on
          // the first load. Doing it on every poll would repeatedly jump the
          // scroll back to that card while the user is reading.
          if (location.hash && !this._didHashScroll) {
            this._didHashScroll = true;
            this.$nextTick(() => {
              const el = document.getElementById(location.hash.slice(1));
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
          }
        }
      } catch (e) { /* network blip — keep showing existing cards */ }
      this.loading = false;
    },
    startPolling() {
      this.stopPolling();
      this._pollHandle = setInterval(() => this.load(), 15000);
    },
    stopPolling() {
      if (this._pollHandle) { clearInterval(this._pollHandle); this._pollHandle = null; }
    },
    fmtWhen(iso) {
      try {
        return new Date(iso).toLocaleString('es-MX', {
          weekday: 'short', day: 'numeric', month: 'short',
          hour: '2-digit', minute: '2-digit',
        });
      } catch (e) { return iso; }
    },
  };
}
</script>
{% endblock %}
