{% extends "_base.html" %}
{% block nav_conversations %}active{% endblock %}
{% block title %}Conversaciones · Axi{% endblock %}

{% block content %}
<div class="space-y-6" x-data="conversationsPage()" x-init="init()">
  <div class="flex items-baseline justify-between">
    <h1 class="text-2xl font-semibold">Conversaciones</h1>
    <div class="muted text-sm" x-text="turns.length + ' turnos cargados'"></div>
  </div>

  <div class="panel p-3">
    <input
      type="text"
      placeholder="Buscar (FTS sobre nodos)…"
      class="w-full bg-transparent px-2 py-1 text-sm"
      style="border: 1px solid var(--border); border-radius: 0.4rem;"
      x-model="query"
      @input.debounce.300ms="runSearch()"
    >
    <template x-if="searchResults.length > 0">
      <div class="mt-3 space-y-1 text-sm">
        <div class="muted text-xs">Resultados:</div>
        <template x-for="r in searchResults" :key="r.id">
          <div class="panel2 p-2">
            <span x-text="r.label"></span>
            <span class="muted text-xs ml-2" x-text="r.kind"></span>
          </div>
        </template>
      </div>
    </template>
  </div>

  <template x-if="loading && turns.length === 0">
    <div class="muted py-12 text-center">Cargando…</div>
  </template>

  <template x-if="!loading && turns.length === 0">
    <div class="panel p-12 text-center muted">No hay conversaciones todavía.</div>
  </template>

  <template x-for="group in grouped" :key="group.label">
    <section class="space-y-2">
      <h2 class="text-lg font-semibold mt-4" style="color: var(--pink)" x-text="group.label"></h2>
      <template x-for="t in group.turns" :key="t.id">
        <div class="panel p-3">
          <div class="muted text-xs mb-1" x-text="formatTime(t.ts)"></div>
          <div class="mb-1"><strong x-text="t.user_text"></strong></div>
          <div><span x-text="t.axi_text"></span></div>
          <template x-if="t.fact_ids && t.fact_ids.length > 0">
            <div class="mt-2 flex gap-1 flex-wrap">
              <template x-for="fid in t.fact_ids" :key="fid">
                <span class="text-xs px-2 py-0.5 rounded-full panel2"
                      style="color: var(--blue)"
                      x-text="'fact #' + fid"></span>
              </template>
            </div>
          </template>
        </div>
      </template>
    </section>
  </template>

  <div class="text-center pt-4" x-show="turns.length > 0 && hasMore">
    <button class="btn" @click="loadMore()" :disabled="loading" x-text="loading ? 'Cargando…' : 'Cargar más'"></button>
  </div>
</div>

<script>
function conversationsPage() {
  return {
    turns: [],
    loading: false,
    hasMore: true,
    query: '',
    searchResults: [],
    pageSize: 50,
    async load(beforeTs) {
      this.loading = true;
      try {
        const params = new URLSearchParams({ limit: this.pageSize });
        if (beforeTs) params.set('before_ts', beforeTs);
        const r = await fetch('/api/conversations?' + params);
        if (!r.ok) return;
        const data = await r.json();
        if (data.length < this.pageSize) this.hasMore = false;
        if (beforeTs) this.turns.push(...data);
        else this.turns = data;
      } finally {
        this.loading = false;
      }
    },
    init() { this.load(); },
    loadMore() {
      const last = this.turns[this.turns.length - 1];
      if (!last) return;
      this.load(last.ts);
    },
    async runSearch() {
      const q = this.query.trim();
      if (!q) { this.searchResults = []; return; }
      try {
        const r = await fetch('/api/search?q=' + encodeURIComponent(q));
        this.searchResults = r.ok ? await r.json() : [];
      } catch (e) { this.searchResults = []; }
    },
    formatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    },
    get grouped() {
      const out = [];
      const groups = {};
      for (const t of this.turns) {
        const d = new Date(t.ts * 1000);
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);
        let label;
        if (d.toDateString() === today.toDateString()) label = 'Hoy';
        else if (d.toDateString() === yesterday.toDateString()) label = 'Ayer';
        else label = d.toISOString().slice(0, 10);
        if (!groups[label]) {
          groups[label] = { label, turns: [] };
          out.push(groups[label]);
        }
        groups[label].turns.push(t);
      }
      return out;
    },
  };
}
</script>
{% endblock %}
