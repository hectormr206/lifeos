{% extends "_base.html" %}
{% block nav_config %}active{% endblock %}
{% block title %}Config · Axi{% endblock %}

{% block content %}
<div class="space-y-6" x-data="configPage()" x-init="load()">
  <h1 class="text-2xl font-semibold">Configuración</h1>
  <p class="muted text-sm">
    Los campos se generan desde el JSON Schema en <code>/api/config/schema</code>.
    Algunos cambios (Whisper, tray) requieren reiniciar el daemon.
  </p>

  <template x-if="loading">
    <div class="muted py-12 text-center">Cargando…</div>
  </template>

  <template x-if="!loading">
    <div class="space-y-4">
      <div class="panel p-6 space-y-4">
        <template x-for="key in fieldOrder" :key="key">
          <div>
            <label class="block text-sm muted mb-1">
              <code x-text="key"></code>
              <span class="ml-2" x-text="schema.properties[key].description || ''"></span>
            </label>

            <!-- Boolean -->
            <template x-if="schema.properties[key].type === 'boolean'">
              <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" x-model="cfg[key]" />
                <span class="text-sm muted" x-text="cfg[key] ? 'habilitado' : 'deshabilitado'"></span>
              </label>
            </template>

            <!-- Enum -->
            <template x-if="schema.properties[key].enum">
              <select x-model="cfg[key]" class="panel2 px-3 py-2 w-full">
                <template x-for="opt in schema.properties[key].enum" :key="opt">
                  <option x-text="opt" :value="opt"></option>
                </template>
              </select>
            </template>

            <!-- Integer / Number -->
            <template x-if="(schema.properties[key].type === 'integer' || schema.properties[key].type === 'number') && !schema.properties[key].enum">
              <input type="number"
                     x-model.number="cfg[key]"
                     :step="schema.properties[key].type === 'integer' ? 1 : 'any'"
                     :min="schema.properties[key].minimum"
                     :max="schema.properties[key].maximum"
                     class="panel2 px-3 py-2 w-full" />
            </template>

            <!-- String -->
            <template x-if="schema.properties[key].type === 'string' && !schema.properties[key].enum">
              <input type="text" x-model="cfg[key]" class="panel2 px-3 py-2 w-full" />
            </template>

            <div class="text-xs muted mt-1"
                 x-show="schema.properties[key].minimum !== undefined || schema.properties[key].maximum !== undefined">
              <span x-show="schema.properties[key].minimum !== undefined">min: <span x-text="schema.properties[key].minimum"></span></span>
              <span x-show="schema.properties[key].maximum !== undefined" class="ml-2">max: <span x-text="schema.properties[key].maximum"></span></span>
            </div>
          </div>
        </template>
      </div>

      <div class="flex justify-end gap-3">
        <button class="btn" @click="load()">Cancelar</button>
        <button class="btn btn-primary" @click="save()" :disabled="saving">
          <span x-show="!saving">Guardar</span>
          <span x-show="saving">Guardando…</span>
        </button>
      </div>

      <template x-if="message">
        <div class="panel p-3 text-sm"
             :style="messageError ? 'border-color: var(--red); color: var(--red)' : 'border-color: var(--green); color: var(--green)'">
          <span x-text="message"></span>
          <template x-if="fieldError">
            <div class="mt-1">
              campo: <code x-text="fieldError"></code>
              · valor: <code x-text="valueError"></code>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
</div>

<script>
function configPage() {
  return {
    cfg: {},
    schema: { properties: {} },
    fieldOrder: [],
    loading: true,
    saving: false,
    message: '',
    messageError: false,
    fieldError: '',
    valueError: '',
    async load() {
      this.loading = true;
      this.message = '';
      this.fieldError = '';
      this.valueError = '';
      const [cfgRes, schemaRes] = await Promise.all([
        fetch('/api/config'),
        fetch('/api/config/schema'),
      ]);
      this.cfg = cfgRes.ok ? await cfgRes.json() : {};
      this.schema = schemaRes.ok ? await schemaRes.json() : { properties: {} };
      this.fieldOrder = Object.keys(this.schema.properties || {});
      this.loading = false;
    },
    async save() {
      this.saving = true;
      this.fieldError = '';
      this.valueError = '';
      try {
        const r = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.cfg),
        });
        if (r.ok) {
          this.message = 'Guardado. Algunos cambios requieren reiniciar el daemon.';
          this.messageError = false;
        } else {
          const body = await r.json().catch(() => ({}));
          const detail = body.detail || {};
          this.message = 'Error de validación: ' + (detail.error || r.status);
          this.fieldError = detail.field || '';
          this.valueError = detail.value || '';
          this.messageError = true;
        }
      } catch (e) {
        this.message = 'Error de red: ' + e;
        this.messageError = true;
      }
      this.saving = false;
    },
  };
}
</script>
{% endblock %}
