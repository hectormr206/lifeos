<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>{% block title %}Axi Dashboard{% endblock %}</title>
  <!-- PWA: manifest + theme color + apple-touch-icon. Service worker is
       registered at the bottom; it makes the page installable on Chrome. -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#cc66ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/axi-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/axi-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/axi-512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --panel2: #1c2129;
      --border: #2a2f37; --text: #e6edf3; --muted: #8b95a4;
      --pink: #cc66ff; --green: #22cc55; --amber: #ffaa33;
      --blue: #33aaff; --purple: #aa33ff; --red: #ee3333;
    }
    html, body { background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    body { overflow-x: hidden; }  /* never show horizontal scrollbar at viewport level */
    [x-cloak] { display: none !important; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 0.75rem; }
    .panel2 { background: var(--panel2); border: 1px solid var(--border); border-radius: 0.5rem; }
    .muted { color: var(--muted); }
    .nav-link { padding: 0.5rem 1rem; border-radius: 0.5rem; }
    .nav-link.active { background: var(--panel2); color: var(--pink); }
    .nav-link:hover { background: var(--panel2); }
    .state-dot { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 50%; vertical-align: middle; }
    .state-idle { background: #8888aa; }
    .state-recording { background: var(--green); }
    .state-transcribing { background: var(--amber); }
    .state-thinking { background: var(--blue); }
    .state-speaking { background: #ff55aa; }
    .state-meeting { background: var(--purple); }
    .state-unknown { background: #666; }
    .event-critical-dot { background: var(--red); box-shadow: 0 0 0 2px rgba(238,51,51,0.35); cursor: pointer; }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; background: var(--panel2); border: 1px solid var(--border); transition: background 0.15s; cursor: pointer; outline: none; }
    .btn:hover { background: #252b35; }
    .btn:focus { outline: none; }
    .btn:focus-visible { box-shadow: 0 0 0 2px rgba(204,102,255,0.4); }
    .btn-primary { background: rgba(204,102,255,0.15); border-color: var(--pink); color: var(--pink); }
    .btn-primary:hover { background: rgba(204,102,255,0.25); }
    /* Remove the persistent blue focus halo Chromium leaves on buttons after click */
    button:focus, a:focus { outline: none; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--pink); outline-offset: 1px; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.5 } }
    /* Markdown rendering inside .md (meeting summaries, notes, etc.). Kept
       simple — matches the panel typography rather than fighting it. */
    .md h1, .md h2, .md h3 { font-weight: 600; color: var(--text); margin-top: 1rem; margin-bottom: 0.5rem; }
    .md h1 { font-size: 1.5rem; }
    .md h2 { font-size: 1.15rem; color: var(--pink); border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
    .md h3 { font-size: 1rem; color: var(--muted); }
    .md p { margin: 0.5rem 0; line-height: 1.5; }
    .md ul, .md ol { margin: 0.5rem 0 0.5rem 1.25rem; line-height: 1.5; }
    .md ul { list-style: disc; }
    .md ol { list-style: decimal; }
    .md li { margin: 0.15rem 0; }
    .md li input[type="checkbox"] { margin-right: 0.4rem; transform: translateY(2px); }
    .md code { background: var(--panel2); padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
    .md pre { background: var(--panel2); padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.85em; }
    .md pre code { background: transparent; padding: 0; }
    .md blockquote { border-left: 3px solid var(--border); padding-left: 0.75rem; color: var(--muted); margin: 0.5rem 0; }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 1rem 0; }
    .md strong { color: var(--text); }
    .md a { color: var(--blue); text-decoration: underline; }
    .md table { border-collapse: collapse; margin: 0.5rem 0; }
    .md th, .md td { border: 1px solid var(--border); padding: 0.35rem 0.6rem; }
    .md th { background: var(--panel2); }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b sticky top-0 z-40" style="border-color: var(--border); background: var(--panel)" x-data="{ navOpen: false }">
    <div class="max-w-7xl mx-auto px-3 md:px-6 py-2 md:py-3 flex items-center justify-between gap-2 md:gap-4">
      <div class="flex items-center gap-2 md:gap-3 min-w-0">
        <span class="state-dot" :class="'state-' + ($store.snap?.state || 'unknown')" x-data></span>
        <a href="/events"
           x-data
           x-show="($store.snap?.unread_critical_events || 0) > 0"
           x-cloak
           class="state-dot event-critical-dot pulse"
           :title="'Eventos críticos sin leer: ' + ($store.snap?.unread_critical_events || 0)"></a>
        <span class="font-semibold text-lg">Axi</span>
        <span class="muted text-sm" x-data x-text="$store.snap?.now?.time || '—'">—</span>
        <!-- P2.4 — Whisper restart-pending pill. Shown when the user changed
             whisper_model_name / whisper_beam_size / whisper_initial_prompt
             from /config; reminds them to restart the daemon via the tray. -->
        <a href="/config"
           x-data
           x-show="$store.snap?.whisper_restart_pending"
           x-cloak
           class="px-2 py-0.5 rounded-full text-xs font-medium"
           style="background: rgba(255,170,51,0.15); color: var(--amber); border: 1px solid var(--amber);"
           title="Click en la bandeja → Reiniciar daemon para aplicar cambios de Whisper">
          🔄 Reinicio pendiente
        </a>
        <!-- P-vpn — dashboard restart-pending pill when host/port change. -->
        <a href="/config"
           x-data
           x-show="$store.snap?.dashboard_restart_pending"
           x-cloak
           class="hidden sm:inline px-2 py-0.5 rounded-full text-xs font-medium"
           style="background: rgba(51,170,255,0.15); color: var(--blue); border: 1px solid var(--blue);"
           title="Cambiaste el host/puerto del dashboard. Ejecuta: systemctl --user restart axi-dashboard.service">
          🔁 Reinicio dashboard
        </a>
      </div>

      <!-- Model placement widget. Compact chip in the header bar; click
           to expand a popover showing per-process VRAM/RAM placement.
           Hidden below xl — at md-lg the chip + 9-item nav don't fit on one
           row, so we hide it. Mobile drawer + xl viewport keep their copies. -->
      <div x-data="{ open: false }" class="relative hidden xl:block">
        <button
          @click="open = !open"
          class="flex items-center gap-2 px-3 py-1.5 rounded-lg panel2 text-sm hover:brightness-110 transition whitespace-nowrap"
          x-data
        >
          <span class="muted">modo</span>
          <span class="font-medium" x-text="$store.snap?.models?.mode || '—'">—</span>
          <span class="muted">·</span>
          <span class="muted">VRAM</span>
          <span
            class="font-medium"
            x-text="(($store.snap?.vram?.used_mb ?? 0) / 1024).toFixed(1) + '/' + (($store.snap?.vram?.total_mb ?? 0) / 1024).toFixed(0) + ' GB'"
          >—</span>
          <svg class="w-3 h-3 muted" :class="open ? 'rotate-180' : ''" viewBox="0 0 12 12" fill="currentColor">
            <path d="M3 4.5l3 3 3-3"/>
          </svg>
        </button>

        <div
          x-show="open"
          x-cloak
          @click.outside="open = false"
          @keydown.escape.window="open = false"
          x-transition.opacity
          class="absolute right-0 mt-2 panel p-4 z-50 min-w-[20rem] shadow-xl"
        >
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-semibold">Ubicación de modelos</span>
            <span
              class="text-xs px-2 py-0.5 rounded-full panel2 muted"
              x-text="$store.snap?.models?.mode || '—'"
            >—</span>
          </div>

          <!-- GPU section -->
          <div class="mb-3">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs muted uppercase tracking-wider">GPU · VRAM</span>
              <span
                class="text-xs muted"
                x-text="(($store.snap?.vram?.used_mb ?? 0) / 1024).toFixed(2) + ' / ' + (($store.snap?.vram?.total_mb ?? 0) / 1024).toFixed(1) + ' GB'"
              >—</span>
            </div>
            <div class="h-1.5 rounded-full panel2 overflow-hidden mb-2">
              <div
                class="h-full"
                style="background: linear-gradient(90deg, var(--pink), var(--purple));"
                :style="'width: ' + (($store.snap?.vram?.total_mb ? ($store.snap?.vram?.used_mb / $store.snap?.vram?.total_mb * 100) : 0)) + '%'"
              ></div>
            </div>
            <template x-if="!($store.snap?.models?.gpu?.length)">
              <div class="text-xs muted italic py-1">Sin modelos en GPU</div>
            </template>
            <template x-for="p in ($store.snap?.models?.gpu || [])" :key="p.pid">
              <div class="flex justify-between items-baseline gap-3 text-sm py-0.5">
                <span x-text="p.name"></span>
                <span class="muted text-xs tabular-nums" x-text="(p.vram_mb / 1024).toFixed(2) + ' GB'"></span>
              </div>
            </template>
          </div>

          <!-- CPU/RAM section -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs muted uppercase tracking-wider">CPU · RAM</span>
              <span
                class="text-xs muted"
                x-text="(($store.snap?.ram?.used / 1024 / 1024 / 1024) || 0).toFixed(1) + ' / ' + (($store.snap?.ram?.total / 1024 / 1024 / 1024) || 0).toFixed(0) + ' GB'"
              >—</span>
            </div>
            <template x-if="!($store.snap?.models?.ram?.length)">
              <div class="text-xs muted italic py-1">Sin procesos axi en RAM</div>
            </template>
            <template x-for="p in ($store.snap?.models?.ram || [])" :key="p.pid">
              <div class="flex justify-between items-baseline gap-3 text-sm py-0.5">
                <span x-text="p.name"></span>
                <span class="muted text-xs tabular-nums" x-text="(p.rss_mb < 1024 ? p.rss_mb + ' MB' : (p.rss_mb / 1024).toFixed(2) + ' GB')"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Mini VRAM pill for md–lg (where the full chip is hidden). Acts
           as a compact at-a-glance indicator and links to /models. -->
      <a href="/models"
         class="hidden md:inline-flex xl:hidden items-center gap-1.5 px-2.5 py-1 rounded-lg panel2 text-xs whitespace-nowrap hover:brightness-110 transition"
         x-data
         :title="'modo ' + ($store.snap?.models?.mode || '?') + ' · click para abrir /models'">
        <span class="muted">VRAM</span>
        <span class="font-medium tabular-nums"
              x-text="(($store.snap?.vram?.used_mb ?? 0) / 1024).toFixed(1) + '/' + (($store.snap?.vram?.total_mb ?? 0) / 1024).toFixed(0)">—</span>
      </a>

      <!-- Desktop nav. Compact spacing on md, comfortable on lg+. -->
      <nav class="hidden md:flex items-center gap-0 lg:gap-1 text-xs lg:text-sm whitespace-nowrap">
        <a href="/" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_home %}{% endblock %}">Home</a>
        <a href="/chat" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_chat %}{% endblock %}">💬 Chat</a>
        <a href="/conversations" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_conversations %}{% endblock %}">Conversaciones</a>
        <a href="/events" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_events %}{% endblock %}">Eventos</a>
        <a href="/memory" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_memory %}{% endblock %}">Memoria</a>
        <a href="/models" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_models %}{% endblock %}">🧠 Modelos</a>
        <a href="/meetings" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_meetings %}{% endblock %}">Reuniones</a>
        <a href="/graph" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_graph %}{% endblock %}">Grafo</a>
        <a href="/config" class="nav-link px-2 lg:px-4 py-1.5 {% block nav_config %}{% endblock %}">Config</a>
      </nav>

      <!-- Mobile hamburger -->
      <button
        type="button"
        @click="navOpen = !navOpen"
        class="md:hidden p-2 rounded-lg panel2 text-base"
        aria-label="Abrir menú"
        style="min-width: 2.75rem; min-height: 2.75rem;"
      >
        <span x-show="!navOpen">☰</span>
        <span x-show="navOpen" x-cloak>✕</span>
      </button>
    </div>

    <!-- Mobile drawer -->
    <div
      x-show="navOpen"
      x-cloak
      x-transition.opacity
      class="md:hidden border-t"
      style="border-color: var(--border); background: var(--panel)"
      @click.outside="navOpen = false"
    >
      <nav class="flex flex-col text-base">
        <a href="/" class="px-4 py-3 nav-link">Home</a>
        <a href="/chat" class="px-4 py-3 nav-link">💬 Chat</a>
        <a href="/conversations" class="px-4 py-3 nav-link">Conversaciones</a>
        <a href="/events" class="px-4 py-3 nav-link">Eventos</a>
        <a href="/memory" class="px-4 py-3 nav-link">Memoria</a>
        <a href="/models" class="px-4 py-3 nav-link">🧠 Modelos</a>
        <a href="/meetings" class="px-4 py-3 nav-link">Reuniones</a>
        <a href="/graph" class="px-4 py-3 nav-link">Grafo</a>
        <a href="/config" class="px-4 py-3 nav-link">Config</a>
        <div class="px-4 py-3 border-t flex items-center justify-between text-xs muted" style="border-color: var(--border)">
          <span>modo: <span x-data x-text="$store.snap?.models?.mode || '—'"></span></span>
          <span>VRAM <span x-data x-text="(($store.snap?.vram?.used_mb ?? 0) / 1024).toFixed(1) + '/' + (($store.snap?.vram?.total_mb ?? 0) / 1024).toFixed(0) + ' GB'"></span></span>
        </div>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 md:px-6 py-3 md:py-6" x-data="dashboardStore()">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Global Alpine store used by header + page-specific data sections.
    // refresh() runs on a 1s interval; if the daemon is briefly unreachable
    // (restart, etc.) the last good snapshot stays visible — no flicker.
    document.addEventListener('alpine:init', () => {
      Alpine.store('snap', null);
    });

    // PWA: register the service worker. The SW is intentionally minimal —
    // it does no caching; Chrome only needs a registered SW to show "Install".
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {/* offline ok */});
      });
    }

    // Markdown → HTML helper. Used by meeting summaries, fact details, etc.
    // GitHub-flavored markdown (task lists, tables) is enabled. Marked
    // escapes raw HTML inputs by default, so LLM output cannot inject scripts.
    function renderMarkdown(text) {
      if (!text) return '';
      try {
        return marked.parse(text, { gfm: true, breaks: true });
      } catch (e) {
        return text;
      }
    }

    function dashboardStore() {
      return {
        async refresh() {
          try {
            const r = await fetch('/api/snapshot');
            if (r.ok) Alpine.store('snap', await r.json());
          } catch (e) { /* keep last good snapshot */ }
        },
        async cmd(name) {
          await fetch('/api/cmd/' + name, { method: 'POST' });
          this.refresh();
        },
        init() {
          this.refresh();
          setInterval(() => this.refresh(), {{ dashboard_poll_ms() }});
        },
      };
    }
  </script>
</body>
</html>
