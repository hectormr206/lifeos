[project]
name = "lifeos"
version = "0.1.0"
description = "LifeOS — personal life system: structured life-domain stores, scheduling, push notifications, and decision engine. Axi is the conversational face."
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "ulid-py>=1.1",
    "dateparser>=1.2",
    "pywebpush>=2.0",
    "cryptography>=42",
    "sqlcipher3-wheels>=0.5",
    "freezegun>=1.5.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "freezegun>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeos"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
