name: CI

# Parity CI matrix (sdd/mobile-app M0). Path-filtered so an engine change
# runs engine jobs and a mobile change runs mobile jobs — no platform can
# silently lag: the contract drift-guard makes an out-of-date generated
# client fail the build. The `mobile` job is added when `mobile/` exists.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast parity gate: the /api/v1 OpenAPI contract must match the committed
  # artifact the Dart client is generated from. Deterministic, sub-second —
  # fails fast when a v1 route changes without regenerating the contract.
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # pyaudio (a core engine dep) builds against portaudio's C headers,
      # which a bare runner lacks (this laptop already has them).
      - name: Install system build deps (portaudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: OpenAPI /api/v1 contract drift-guard
        working-directory: axi
        run: uv run --python 3.12 pytest tests/test_openapi_contract.py -q

  # REQUIRED gate: the mobile/API surface this SDD builds on — headless-safe
  # suites, must stay green on every change.
  mobile-surface-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # pyaudio (a core engine dep) builds against portaudio's C headers,
      # which a bare runner lacks (this laptop already has them).
      - name: Install system build deps (portaudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: pytest (mobile/API surface)
        working-directory: axi
        run: >
          uv run --python 3.12 pytest -q
          tests/test_v1_alias_middleware.py tests/test_devices_store.py
          tests/test_api_auth_middleware.py tests/test_capabilities.py
          tests/test_pairing.py tests/test_pair_endpoint.py
          tests/test_devices_admin.py tests/test_openapi_contract.py
          tests/test_oplog.py tests/test_config_schema.py

  # OBSERVABILITY (non-blocking): the full engine suite on a bare runner.
  # First real run: 2878 passed / 56 failed — all failures are tests coupled
  # to the laptop environment (audio stack, local tz, hardware). Tracked
  # debt: an env-marker pass (@pytest.mark.hardware or equivalent) will make
  # this job required. Until then it reports but never blocks.
  engine-full-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install system build deps (portaudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: pytest (full suite, non-blocking)
        working-directory: axi
        run: >
          uv run --python 3.12 pytest tests/ -q
          --deselect tests/test_briefing.py::test_agentic_forces_final_synthesis
          --deselect tests/test_store.py::test_concurrent_writes_no_corruption
