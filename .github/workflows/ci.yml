name: CI

# Parity CI matrix (sdd/mobile-app M0). Path-filtered so an engine change
# runs engine jobs and a mobile change runs mobile jobs — no platform can
# silently lag: the contract drift-guard makes an out-of-date generated
# client fail the build. The `mobile` job is added when `mobile/` exists.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN: nothing here writes back to the repo.
# The suite asserts local-time formatting (e.g. "20:00 UTC = 14:00 CDT"), which
# matches the host timezone in production. Runner containers default to UTC, so
# the timezone is pinned here rather than left to whichever machine picks up the job.
env:
  TZ: America/Mexico_City

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a branch's in-flight run is free; superseding main's is not.
  # A main run is what the OTA publisher gates on, and a full run takes longer
  # than a busy merge cadence, so cancelling here can leave every commit on
  # main unverified and stop publishing silently — which is exactly what
  # happened on 2026-07-28.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This repository is PUBLIC and every job below runs on a NON-EPHEMERAL
# self-hosted runner — now the `ci` pool (Proxmox + laptop) rather than the
# VPS. Without a guard, anyone could open a pull request from a fork and
# execute arbitrary code on those machines; several steps also invoke sudo.
# Each job therefore carries the same-repository condition below. It is
# repeated per job because the `env` context is not available in a job-level
# `if:`. Fork pull requests stay reviewable; a maintainer runs them by pushing
# the branch to this repository.
#
#   if: github.event_name != 'pull_request'
#       || github.event.pull_request.head.repo.full_name == github.repository

jobs:
  # Fast parity gate: the /api/v1 OpenAPI contract must match the committed
  # artifact the Dart client is generated from. Deterministic, sub-second —
  # fails fast when a v1 route changes without regenerating the contract.
  contract-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # pyaudio (a core engine dep) builds against portaudio's C headers,
      # which a bare runner lacks (this laptop already has them).
      - name: Install system build deps (portaudio)
        run: |
          # Skip when headers are preinstalled (self-hosted runner image).
          if [ ! -e /usr/include/portaudio.h ]; then
            sudo apt-get update && sudo apt-get install -y portaudio19-dev
          fi
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: OpenAPI /api/v1 contract drift-guard
        working-directory: axi
        run: uv run --python 3.12 pytest tests/test_openapi_contract.py -q

  # REQUIRED gate: the mobile/API surface this SDD builds on — headless-safe
  # suites, must stay green on every change.
  mobile-surface-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # pyaudio (a core engine dep) builds against portaudio's C headers,
      # which a bare runner lacks (this laptop already has them).
      - name: Install system build deps (portaudio)
        run: |
          # Skip when headers are preinstalled (self-hosted runner image).
          if [ ! -e /usr/include/portaudio.h ]; then
            sudo apt-get update && sudo apt-get install -y portaudio19-dev
          fi
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: pytest (mobile/API surface)
        working-directory: axi
        run: >
          uv run --python 3.12 pytest -q
          tests/test_v1_alias_middleware.py tests/test_devices_store.py
          tests/test_api_auth_middleware.py tests/test_capabilities.py
          tests/test_pairing.py tests/test_pair_endpoint.py
          tests/test_devices_admin.py tests/test_openapi_contract.py
          tests/test_oplog.py tests/test_config_schema.py

  # REQUIRED gate: the Flutter app — analyze + test on every push. Only needs
  # the Flutter SDK (no Android build, no JVM generator), so it is fast and
  # robust. The engine half of the parity backbone is the contract-drift job;
  # the client half (regenerate mobile/tool/gen-api.sh and diff the committed
  # client) is a documented FOLLOW-UP — it needs the generator toolchain
  # (java + npx openapi-generator + jq + sd) provisioned on the runner first,
  # exactly the kind of "works on my laptop" coupling this CI exists to expose.
  mobile-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # graph_backup_service_test hangs past its 30s budget on the Proxmox runner
    # and passes on the laptop one. Ruled out: core count, sqlite-libs version
    # and disk throughput (both machines measure ~1 GB/s). Root cause unknown,
    # so the job is pinned to the runner where it is reproducibly green.
    runs-on: [self-hosted, laptop]
    steps:
      - uses: actions/checkout@v4
      # Must match the VPS-local SDK that mobile-ota-publish builds the shipped
      # APK with, otherwise the gate validates a different Flutter than we ship.
      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: pub get
        working-directory: mobile
        run: flutter pub get
      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: flutter test
        working-directory: mobile
        run: flutter test

  # The full engine suite lives in .github/workflows/engine-suite.yml, not
  # here. It is ~21 minutes of non-blocking observability, and while it sat in
  # this workflow it decided when CI concluded — which is what the OTA
  # publisher gates on, so every release waited on a suite allowed to fail.
