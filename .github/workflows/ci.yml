name: CI

# Parity CI matrix (sdd/mobile-app M0). Path-filtered so an engine change
# runs engine jobs and a mobile change runs mobile jobs — no platform can
# silently lag: the contract drift-guard makes an out-of-date generated
# client fail the build. The `mobile` job is added when `mobile/` exists.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN: nothing here writes back to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a branch's in-flight run is free; superseding main's is not.
  # A main run is what the OTA publisher gates on, and a full run takes longer
  # than a busy merge cadence, so cancelling here can leave every commit on
  # main unverified and stop publishing silently — which is exactly what
  # happened on 2026-07-28.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This repository is PUBLIC and every job below runs on a NON-EPHEMERAL
# self-hosted runner that has passwordless sudo. Without a guard, anyone could
# open a pull request from a fork and execute arbitrary code — as root — on the
# VPS. Each job therefore carries the same-repository condition below. It is
# repeated per job because the `env` context is not available in a job-level
# `if:`. Fork pull requests stay reviewable; a maintainer runs them by pushing
# the branch to this repository.
#
#   if: github.event_name != 'pull_request'
#       || github.event.pull_request.head.repo.full_name == github.repository

jobs:
  # Fast parity gate: the /api/v1 OpenAPI contract must match the committed
  # artifact the Dart client is generated from. Deterministic, sub-second —
  # fails fast when a v1 route changes without regenerating the contract.
  contract-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # pyaudio (a core engine dep) builds against portaudio's C headers,
      # which a bare runner lacks (this laptop already has them).
      - name: Install system build deps (portaudio)
        run: |
          # Skip when headers are preinstalled (self-hosted runner image).
          if [ ! -e /usr/include/portaudio.h ]; then
            sudo apt-get update && sudo apt-get install -y portaudio19-dev
          fi
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: OpenAPI /api/v1 contract drift-guard
        working-directory: axi
        run: uv run --python 3.12 pytest tests/test_openapi_contract.py -q

  # REQUIRED gate: the mobile/API surface this SDD builds on — headless-safe
  # suites, must stay green on every change.
  mobile-surface-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # pyaudio (a core engine dep) builds against portaudio's C headers,
      # which a bare runner lacks (this laptop already has them).
      - name: Install system build deps (portaudio)
        run: |
          # Skip when headers are preinstalled (self-hosted runner image).
          if [ ! -e /usr/include/portaudio.h ]; then
            sudo apt-get update && sudo apt-get install -y portaudio19-dev
          fi
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: pytest (mobile/API surface)
        working-directory: axi
        run: >
          uv run --python 3.12 pytest -q
          tests/test_v1_alias_middleware.py tests/test_devices_store.py
          tests/test_api_auth_middleware.py tests/test_capabilities.py
          tests/test_pairing.py tests/test_pair_endpoint.py
          tests/test_devices_admin.py tests/test_openapi_contract.py
          tests/test_oplog.py tests/test_config_schema.py

  # REQUIRED gate: the Flutter app — analyze + test on every push. Only needs
  # the Flutter SDK (no Android build, no JVM generator), so it is fast and
  # robust. The engine half of the parity backbone is the contract-drift job;
  # the client half (regenerate mobile/tool/gen-api.sh and diff the committed
  # client) is a documented FOLLOW-UP — it needs the generator toolchain
  # (java + npx openapi-generator + jq + sd) provisioned on the runner first,
  # exactly the kind of "works on my laptop" coupling this CI exists to expose.
  mobile-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4
      # Must match the VPS-local SDK that mobile-ota-publish builds the shipped
      # APK with, otherwise the gate validates a different Flutter than we ship.
      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: pub get
        working-directory: mobile
        run: flutter pub get
      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: flutter test
        working-directory: mobile
        run: flutter test

  # OBSERVABILITY (non-blocking): the full engine suite on a bare runner.
  # First real run: 2878 passed / 56 failed — all failures are tests coupled
  # to the laptop environment (audio stack, local tz, hardware). Tracked
  # debt: an env-marker pass (@pytest.mark.hardware or equivalent) will make
  # this job required. Until then it reports but never blocks.
  engine-full-suite:
    # Runs AFTER the required gates rather than beside them. This runner is
    # shared with other repositories on a 12-core box, and four parallel jobs
    # drove the load average to 32, which starved the runner process until it
    # lost contact with GitHub and failed mobile-app mid-analyze. This job is
    # observability, so it is the one that waits. `always()` keeps it running
    # even when a gate above it fails — its whole point is reporting.
    needs: [contract-drift, mobile-surface-tests, mobile-app]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, vps]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install system build deps (portaudio)
        run: |
          # Skip when headers are preinstalled (self-hosted runner image).
          if [ ! -e /usr/include/portaudio.h ]; then
            sudo apt-get update && sudo apt-get install -y portaudio19-dev
          fi
      # Runtime binaries the full suite shells out to. Their absence turns
      # behavioral tests into environment errors ('ffmpeg not installed',
      # FileNotFoundError: 'rg', libGL.so.1), which is noise, not signal.
      #
      # Best-effort on purpose. The runner image may ship without sudo, or
      # without a usable apt: provisioning that fails must degrade to the
      # failures we already have, never take down the whole job at setup.
      - name: Install full-suite runtime deps
        continue-on-error: true
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v rg >/dev/null 2>&1 || missing+=(ripgrep)
          ldconfig -p 2>/dev/null | grep -q 'libGL\.so\.1' || missing+=(libgl1)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All runtime deps already present."
            exit 0
          fi
          echo "Missing: ${missing[*]}"
          if ! command -v sudo >/dev/null 2>&1; then
            echo "::warning::sudo unavailable; leaving ${missing[*]} uninstalled"
            exit 0
          fi
          sudo apt-get update \
            && sudo apt-get install -y "${missing[@]}" \
            || echo "::warning::could not install ${missing[*]}; related tests will fail"
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: pytest (full suite, non-blocking)
        working-directory: axi
        run: >
          uv run --python 3.12 pytest tests/ -q
          --deselect tests/test_briefing.py::test_agentic_forces_final_synthesis
          --deselect tests/test_store.py::test_concurrent_writes_no_corruption

  # OTA publishing deliberately does NOT run here. The jobs above execute in a
  # container that cannot see the host's Flutter SDK, Android SDK, keystore or
  # ~/lifeos-updates — and putting the release keystore within reach of a
  # public repository's CI would expose the key the installed app trusts.
  # Signing and publishing therefore run on the host, driven by the
  # lifeos-ota-autopublish systemd timer, which waits for this workflow to go
  # green on main. See mobile/tools/ota-autopublish.sh.
