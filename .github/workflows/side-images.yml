name: Side Container Images

# Builds and pushes per-service runtime container images used by LifeOS
# services (lifeos-tts, lifeos-llama-embeddings,
# lifeos-lifeosd, lifeos-llama-server, lifeos-simplex-bridge).
#
# These images support the runtime direction and also preserve useful pieces
# from the earlier lean-bootc Quadlet work. They decouple service deploys from
# any monolithic host image — bumping a voice model or daemon binary should not
# require a full OS image refresh.
#
# Trigger semantics:
#   - push to main + per-image path filter → rebuild only the changed image.
#   - workflow_dispatch → rebuild all (manual full sweep).
#   - schedule weekly → catch upstream base image CVEs even when our code
#     hasn't changed.
#
# llama-server is excluded by default because its runtime is BLOCKED on
# nvidia-container-toolkit (Fedora 43 RPM digest issue). The container builds
# fine; production cannot start it. Build is gated behind `build-llama-server`
# input so we don't waste a 30-min CUDA compile every CI cycle.

on:
  push:
    branches:
      - main
    paths:
      - 'containers/**'
      - '.github/workflows/side-images.yml'
  workflow_dispatch:
    inputs:
      build-llama-server:
        description: 'Also build lifeos-llama-server (CUDA, ~30-45 min). Runtime service image path.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # Weekly Monday 05:00 UTC to catch upstream base image CVEs.
    - cron: '0 5 * * 1'

concurrency:
  group: side-images-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-image:
    runs-on: [self-hosted, vps]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lifeos-tts
            # Context is repo root because Phase 6 bakes vendored
            # build-assets/wheels/ (torch 2.4.1+cpu) into the side image
            # build — same wheel dir the legacy bootc kokoro-builder
            # used. The Containerfile's COPY build-assets/wheels/
            # only resolves with repo root as context.
            context: .
            dockerfile: containers/lifeos-tts/Containerfile
            extra: ''
          - name: lifeos-llama-embeddings
            context: containers/lifeos-llama-embeddings
            dockerfile: containers/lifeos-llama-embeddings/Containerfile
            extra: ''
          - name: lifeos-lifeosd
            # Build context is repo root because the Cargo workspace lives
            # there — daemon/Cargo.toml references workspace deps from the
            # root Cargo.toml.
            context: .
            dockerfile: containers/lifeos-lifeosd/Containerfile
            extra: ''
          - name: lifeos-simplex-bridge
            context: containers/lifeos-simplex-bridge
            dockerfile: containers/lifeos-simplex-bridge/Containerfile
            extra: ''
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          podman build \
            -t ghcr.io/${REPO_OWNER}/${{ matrix.name }}:stable \
            -t ghcr.io/${REPO_OWNER}/${{ matrix.name }}:${GITHUB_SHA::8} \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Push image
        run: |
          podman push ghcr.io/${REPO_OWNER}/${{ matrix.name }}:stable
          podman push ghcr.io/${REPO_OWNER}/${{ matrix.name }}:${GITHUB_SHA::8}

  build-llama-server:
    # CUDA compile is ~30-45 min (slightly longer than the previous Vulkan
    # build because nvcc compiles per-arch device code for sm_75..sm_120).
    # The build runs on every push to containers/**, the weekly cron, and on
    # workflow_dispatch (default 'true'). Set the dispatch
    # input to 'false' if you need to skip the long compile for an
    # unrelated container-only change.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build-llama-server == 'true'
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build lifeos-llama-server (CUDA)
        run: |
          podman build \
            -t ghcr.io/${REPO_OWNER}/lifeos-llama-server:stable \
            -t ghcr.io/${REPO_OWNER}/lifeos-llama-server:${GITHUB_SHA::8} \
            -f containers/lifeos-llama-server/Containerfile \
            containers/lifeos-llama-server

      - name: Push image
        run: |
          podman push ghcr.io/${REPO_OWNER}/lifeos-llama-server:stable
          podman push ghcr.io/${REPO_OWNER}/lifeos-llama-server:${GITHUB_SHA::8}
