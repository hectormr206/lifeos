name: Engine suite

# OBSERVABILITY, deliberately OUTSIDE the CI workflow.
#
# This is a ~21-minute run against gates that finish in under five. While it
# lived in CI it decided when that workflow concluded, and the OTA publisher
# only ships a commit whose CI run concluded successfully — so every release
# waited on a suite that is explicitly allowed to fail. Worse, main runs queue
# rather than supersede each other (see ci.yml's concurrency note), so a second
# push sat pending behind the first for over an hour.
#
# It reports on the same commits without gating any of them.
#
# Triggered by CI FINISHING, not by the push. The first attempt at this split
# fired both workflows on the same push, so they ran CONCURRENTLY — worse than
# the ordering it replaced. The shared box reached load 12 and the disk-heavy
# mobile tests timed out at the framework's 30 s default, failing CI and
# stalling the OTA. `needs:` cannot cross workflows; `workflow_run` can.
#
# `branches: [main]` also keeps fork pull requests from triggering it, which
# matters because workflow_run runs in the base repository's context.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Superseding IS right here: this reports on a commit, it does not gate one,
# so only the newest result is interesting.
concurrency:
  group: engine-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-full-suite:
    # workflow_run + `branches: [main]` already excludes fork pull requests.
    # This repository is PUBLIC and the job runs on a non-ephemeral
    # self-hosted runner, so the constraint is deliberate, not incidental.
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch. Report on the exact
          # commit CI ran, or the result describes something else entirely.
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # The runner image is FEDORA, not Debian — `apt-get` does not exist on
      # it. The portaudio step below has always been written against apt and
      # has never once run, because its guard finds the headers preinstalled;
      # that is why nobody noticed. Detect the package manager instead of
      # assuming one.
      - name: Install system build deps (portaudio)
        run: |
          if [ -e /usr/include/portaudio.h ]; then
            echo "portaudio headers already present."
            exit 0
          fi
          if command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y portaudio-devel
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y portaudio19-dev
          else
            echo "::error::no supported package manager found"
            exit 1
          fi
      # Runtime binaries the full suite shells out to; without them, behavioural
      # tests fail as environment errors ('ffmpeg not installed', libGL.so.1),
      # which is noise rather than signal.
      #
      # Best-effort: provisioning that fails must degrade to the failures we
      # already have, never take the whole job down at setup — which is exactly
      # what the previous apt-only version did, in nine seconds.
      - name: Install full-suite runtime deps
        continue-on-error: true
        run: |
          need_ffmpeg=false
          need_gl=false
          command -v ffmpeg >/dev/null 2>&1 || need_ffmpeg=true
          ldconfig -p 2>/dev/null | grep -q 'libGL\.so\.1' || need_gl=true
          if ! $need_ffmpeg && ! $need_gl; then
            echo "All runtime deps already present."
            exit 0
          fi

          if command -v dnf >/dev/null 2>&1; then
            # ffmpeg-free is the Fedora main-repo build; plain `ffmpeg` lives in
            # RPM Fusion, which this image does not enable.
            pkgs=""
            $need_ffmpeg && pkgs="$pkgs ffmpeg-free"
            $need_gl && pkgs="$pkgs mesa-libGL"
            sudo dnf install -y $pkgs \
              || echo "::warning::could not install$pkgs; related tests will fail"
          elif command -v apt-get >/dev/null 2>&1; then
            pkgs=""
            $need_ffmpeg && pkgs="$pkgs ffmpeg"
            $need_gl && pkgs="$pkgs libgl1"
            sudo apt-get update && sudo apt-get install -y $pkgs \
              || echo "::warning::could not install$pkgs; related tests will fail"
          else
            echo "::warning::no package manager found; leaving deps uninstalled"
          fi
      - name: Sync axi deps
        working-directory: axi
        run: uv sync --python 3.12
      - name: pytest (full suite)
        working-directory: axi
        run: >
          uv run --python 3.12 pytest tests/ -q
          --deselect tests/test_briefing.py::test_agentic_forces_final_synthesis
          --deselect tests/test_store.py::test_concurrent_writes_no_corruption
