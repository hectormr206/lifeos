name: runner-selftest
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: [self-hosted, coolify-test]
    steps:
      - name: Runner + podman info
        run: |
          echo "host: $(hostname)"
          podman info --format 'rootless={{.Host.Security.Rootless}} driver={{.Store.GraphDriverName}}'
      - name: Build image
        run: |
          printf 'FROM alpine:3.20\nRUN echo lifeos-coolify-runner-ok > /ok.txt\n' > Containerfile
          podman build -t ghcr.io/hectormr206/lifeos-runner-selftest:probe .
      - name: Login + push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/hectormr206/lifeos-runner-selftest:probe
          echo "pushed ghcr.io/hectormr206/lifeos-runner-selftest:probe"
