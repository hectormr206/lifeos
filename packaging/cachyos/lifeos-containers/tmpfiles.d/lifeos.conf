# tmpfiles.d/lifeos.conf — declarative filesystem setup for LifeOS
#
# T17: Creates /var/lib/lifeos and /run/lifeos with correct ownership.
# Applied at boot by systemd-tmpfiles or manually with:
#   sudo systemd-tmpfiles --create /usr/lib/tmpfiles.d/lifeos.conf
#
# Verification:
#   sudo systemd-tmpfiles --create /usr/lib/tmpfiles.d/lifeos.conf
#   ls -la /var/lib/lifeos /run/lifeos
#   stat -c "%U:%G %a" /var/lib/lifeos  # expect lifeos:lifeos 775
#   stat -c "%U:%G %a" /run/lifeos      # expect lifeos:lifeos 770
#
# Column format: Type Path Mode User Group Age Argument
#
# d = create directory (and all parents) if absent; set mode+ownership each boot.
# /var/lib/lifeos — persistent state (memory.db, models, simplex, runtime profiles).
#   mode 0775: lifeos user + group have rwx; others have rx (readable by $USER
#   if they are added to the lifeos group, which PKGBUILD post_install does).
d /var/lib/lifeos      0775 lifeos lifeos -

# /var/lib/lifeos/models — bind-mounted into Quadlet containers read-only.
#   Inherits group from parent; 0775 lets group members add model files.
d /var/lib/lifeos/models 0775 lifeos lifeos -

# /var/lib/lifeos/simplex — SimpleX bridge state (SQLite DBs).
#   0700: private to lifeos user (matches legacy simplex-chat.service StateDirectory=).
d /var/lib/lifeos/simplex 0700 lifeos lifeos -

# /run/lifeos — ephemeral runtime (UDS socket, lock files).
#   Cleared on reboot by systemd (tmpfs). mode 0770: daemon + group-members only.
#   The daemon's UDS at /run/lifeos/lifeosd.sock uses SO_PEERCRED — no world-read needed.
d /run/lifeos          0770 lifeos lifeos -
