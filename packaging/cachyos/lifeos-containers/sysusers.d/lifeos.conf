# sysusers.d/lifeos.conf — declarative system user for LifeOS
#
# T18: Creates the `lifeos` system user and group used by tmpfiles.d to
# own /var/lib/lifeos and /run/lifeos.
#
# Applied at install time by the PKGBUILD post_install hook, or manually with:
#   sudo systemd-sysusers /usr/lib/sysusers.d/lifeos.conf
#
# Verification:
#   id lifeos   # expect: uid=NNN(lifeos) gid=NNN(lifeos)
#   getent passwd lifeos
#
# Column format: Type Name ID GECOS Home Shell
#
# u = create system user + matching group if absent.
#   - UID/GID: "-" means allocate dynamically in the system range (<1000).
#   - Home: /var/lib/lifeos (matches tmpfiles.d ownership).
#   - Shell: /usr/sbin/nologin (no interactive login — defense-in-depth).
#
# Note: $USER (the human operator) is added to the lifeos group by
# PKGBUILD post_install so they can read /var/lib/lifeos (models, memory.db).
# The daemon (lifeosd) runs as $USER (user-scope systemd unit), not as
# the lifeos system user — the system user is purely for ownership of
# shared paths that are created before user login (tmpfiles.d at boot).
u lifeos - "LifeOS system user" /var/lib/lifeos /usr/sbin/nologin
