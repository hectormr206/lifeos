# Bound the HOST side of this box.
#
# Containers are already capped (4 CPUs each), but everything hectormr runs
# outside them — Claude Code sessions and the builds they launch, tsc, Chrome,
# herdr — was unbounded. So production was limited and development was not,
# and it was development that starved production: observed load 27 on 12 cores,
# with CI failing on 30 s timeouts in tests that take 3 s idle.
#
# CPUQuota SLOWS, MemoryHigh THROTTLES. Neither kills: an OOM kill mid-build
# would trade a slow pipeline for a broken one, and a 20-minute release build
# dying silently is exactly the failure mode this repo keeps relearning.
#
# 600% = 6 of 12 cores for all host-side work, leaving 6 for containers.
# Reversible: delete this file and `systemctl daemon-reload`.
[Slice]
CPUQuota=600%
CPUWeight=50
MemoryHigh=10G
IOWeight=50
