# LifeOS OTA update endpoint — header-gated static serving
# base = https://updates.lifeos.hectormr.com   (subdomain namespaces it, endpoints at ROOT)
server {
    listen 80;
    server_name _;

    add_header Cache-Control "no-store" always;
    server_tokens off;

    # GET /manifest -> manifest.json
    location = /manifest {
        if ($http_x_lifeos_update_key != "24c116f17508c5707b3ae5f8b595374edf572bd657b4a3661ecf84566f328e8d") {
            return 403;
        }
        default_type application/json;
        alias /srv/lifeos/manifest.json;
    }

    # GET /download -> current APK (symlink current.apk -> lifeos-<ver>.apk)
    location = /download {
        if ($http_x_lifeos_update_key != "24c116f17508c5707b3ae5f8b595374edf572bd657b4a3661ecf84566f328e8d") {
            return 403;
        }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        alias /srv/lifeos/current.apk;
    }

    # Public voice-model assets (STT) — immutable public files, no key gate
    location /stt/ {
        alias /srv/lifeos/stt/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Public voice-model assets (TTS/Piper) — immutable public files, no key gate
    location /tts/ {
        alias /srv/lifeos/tts/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Public embedding-model assets — immutable public files, no key gate
    location /embed/ {
        alias /srv/lifeos/embed/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Public brain-model assets — immutable public files, no key gate
    location /model/ {
        alias /srv/lifeos/model/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Desktop (Linux) releases — the tarball and its manifest. Same shape as
    # /model/: public immutable artifacts, integrity guaranteed by the sha256
    # in the manifest rather than by a key gate.
    location /linux/ {
        alias /srv/lifeos/linux/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # health check (no auth) for verification
    location = /healthz { return 200 "ok\n"; }

    # everything else is not found
    location / { return 404; }
}
