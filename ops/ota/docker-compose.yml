# The Coolify service definition for the OTA update server.
#
# SOURCE OF TRUTH is Coolify's own database (services.docker_compose_raw for
# service id 52, uuid l8sw4ookgck4cgw8kwwg8s4w). This file is the reviewed copy:
# it exists so a change to how updates are served has history and can be read
# without shell access to the VPS — the same reason ota-root.conf is vendored.
#
# WHAT CHANGED AND WHY. Both volumes used to be host bind mounts:
#   /home/hectormr/lifeos-updates       -> /srv/lifeos          (23 GB)
#   /home/hectormr/lifeos-ota/ota-root.conf -> nginx config
# The container was managed by Coolify; its state was not. Those paths sat
# outside anything Coolify knew about: no backup, no versioning, and lost with
# the host. They are now a Coolify-created named volume and a file under
# Coolify's own service directory whose content is stored in Coolify's database.
#
# NOTE ON THE VOLUME NAME. Coolify prefixes the compose key with the service
# UUID, so the real volume is `l8sw4ookgck4cgw8kwwg8s4w_lifeos-ota-artifacts`.
# Pre-creating one under the unprefixed name does NOT get adopted — it is
# ignored, and the service comes up serving an empty directory. That cost a
# short outage during the migration; tools/ota-volume.sh pins the real name.
#
# Writes go through tools/ota-volume.sh, never a host path: nginx mounts the
# volume read-only, so the process exposed to the internet cannot modify what
# it serves.
services:
  ota:
    image: 'nginx:alpine'
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    volumes:
      # Coolify-managed named volume, NOT a host path. The old bind pointed at
      # /home/hectormr/lifeos-updates: 23 GB of release artifacts living outside
      # anything Coolify knew about — no backup, no versioning, gone with the host.
      - 'lifeos-ota-artifacts:/srv/lifeos:ro'
      # Config under Coolify's own service directory, with its content stored in
      # Coolify's database so it can be restored and edited from the UI.
      - '/data/coolify/services/l8sw4ookgck4cgw8kwwg8s4w/ota-root.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.lifeos-ota-new.entrypoints=https
      - traefik.http.routers.lifeos-ota-new.rule=Host(`updates.lifeos.hectormr.com`)
      - traefik.http.routers.lifeos-ota-new.tls=true
      - traefik.http.routers.lifeos-ota-new.tls.certresolver=cloudflare
      - traefik.http.routers.lifeos-ota-new.middlewares=lifeos-ota-rl
      - traefik.http.middlewares.lifeos-ota-rl.ratelimit.average=20
      - traefik.http.middlewares.lifeos-ota-rl.ratelimit.burst=40
      - traefik.http.services.lifeos-ota-new.loadbalancer.server.port=80
networks:
  coolify:
    external: true
volumes:
  lifeos-ota-artifacts:
    name: lifeos-ota-artifacts
