# LifeOS OTA update endpoint — header-gated static serving
# base = https://updates.lifeos.hectormr.com   (subdomain namespaces it, endpoints at ROOT)
#
# This host is reachable from the PUBLIC internet, not only through Cloudflare:
# a device that is not on the VPN has to be able to install and update LifeOS,
# and the 2.6 GB brain model cannot be served through Cloudflare's CDN on a
# Free/Pro plan (their Service-Specific Terms let them cut off CDN access for
# "a disproportionate percentage of ... other large files"). Everything below
# is therefore written for an origin that anyone can reach.
#
# THE KEY IS A GUARDRAIL, NOT AUTHENTICATION. It ships inside the APK and the
# Linux installer, so anyone can extract it with `strings`. What it buys:
# drive-by scanners and bots get 403, access becomes deliberate rather than
# accidental, and there is something to ROTATE if abuse shows up. Real
# per-device credentials arrive with the device-identity work in
# `openspec/changes/device-sync-blind-relay/`. Do not describe this as auth.

# One place for the secret, instead of the same literal repeated in every
# location block — a rotation that misses one block is a silent hole.
#
# The bucket size is NOT optional: the key is a 64-char hex string and nginx's
# default bucket (64 bytes) cannot hold it, so the config fails to load with
# "could not build map_hash". Keep this at least as large as the longest key
# if the secret is ever rotated to something longer.
map_hash_bucket_size 128;
map $http_x_lifeos_update_key $lifeos_key_ok {
    default                                                            0;
    "24c116f17508c5707b3ae5f8b595374edf572bd657b4a3661ecf84566f328e8d" 1;
}

# Abuse bounds for a public origin. Deliberately loose: these paths serve a
# 2.6 GB model and a ~330 MB APK, and a limit tight enough to be "safe" would
# break the very downloads this host exists for. `limit_conn` is the one that
# actually matters here — it caps how much of the box one address can occupy.
limit_req_zone  $binary_remote_addr zone=lifeos_ota_req:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=lifeos_ota_conn:10m;

server {
    listen 80;
    server_name _;

    add_header Cache-Control "no-store" always;
    server_tokens off;

    # GET /manifest -> manifest.json
    location = /manifest {
        if ($lifeos_key_ok = 0) { return 403; }
        default_type application/json;
        alias /srv/lifeos/manifest.json;
    }

    # GET /download -> current APK (symlink current.apk -> lifeos-<ver>.apk)
    location = /download {
        if ($lifeos_key_ok = 0) { return 403; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        alias /srv/lifeos/current.apk;
    }

    # Model assets — STT (Whisper), TTS (Piper), embeddings, and the brain model.
    #
    # KEY-GATED as of 2026-08-12. They were open on the reasoning that the app's
    # download gateways did not send the key yet. That reasoning expired: all
    # four gateways send `X-LifeOS-Update-Key` on every DownloadTask
    # (`background_downloader_{stt,tts,embed}_model_gateway.dart`,
    # `vps_brain_model_gateway.dart`), and the brain gateway now sends it on the
    # manifest fetch too — it did not, and gating this path before that fix
    # would have turned the brain update check into a permanent silent 403,
    # because `fetchManifest` swallows DioException into `null` by design.
    #
    # `limit_req ... nodelay` with a burst well above the ~10 requests a full
    # first-run download makes: the point is to stop a flood, not to throttle a
    # legitimate device that fetches seven files back to back.
    location /stt/ {
        if ($lifeos_key_ok = 0) { return 403; }
        limit_req  zone=lifeos_ota_req burst=30 nodelay;
        limit_conn lifeos_ota_conn 6;
        alias /srv/lifeos/stt/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /tts/ {
        if ($lifeos_key_ok = 0) { return 403; }
        limit_req  zone=lifeos_ota_req burst=30 nodelay;
        limit_conn lifeos_ota_conn 6;
        alias /srv/lifeos/tts/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /embed/ {
        if ($lifeos_key_ok = 0) { return 403; }
        limit_req  zone=lifeos_ota_req burst=30 nodelay;
        limit_conn lifeos_ota_conn 6;
        alias /srv/lifeos/embed/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The 2.6 GB brain model. `limit_conn` is the real protection here — one
    # address cannot hold more than a handful of these transfers open at once.
    location /model/ {
        if ($lifeos_key_ok = 0) { return 403; }
        limit_req  zone=lifeos_ota_req burst=30 nodelay;
        limit_conn lifeos_ota_conn 6;
        alias /srv/lifeos/model/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Desktop (Linux) releases — the tarball, its manifest, and the installer.
    #
    # KEY-GATED. It used to be open on the reasoning that the sha256 in the
    # manifest guarantees integrity, which is true and is not the point:
    # integrity is not access. This path serves executable release bundles, and
    # every client that reads it already sends the key — install-linux.sh passes
    # it on every fetch. (The model paths above are gated now too; this comment
    # used to say they were not.)
    # The bootstrap installer itself stays OPEN, deliberately. It is fetched by
    # `curl | sh` BEFORE the machine has any key — gating it makes the documented
    # first-install command impossible, since that curl has no key to send. The
    # script carries no secret: the key is supplied by the human running it.
    location = /linux/install-linux.sh {
        alias /srv/lifeos/linux/install-linux.sh;
        default_type text/x-shellscript;
        add_header Cache-Control "no-cache" always;
    }

    location /linux/ {
        if ($lifeos_key_ok = 0) { return 403; }
        alias /srv/lifeos/linux/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # health check (no auth) for verification
    location = /healthz { return 200 "ok\n"; }

    # everything else is not found
    location / { return 404; }
}
