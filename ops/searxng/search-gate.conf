# La puerta: sin la cabecera no se pasa, y sólo se pasa a /search en JSON.
server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header Cache-Control "no-store" always;

    # Lo único que LifeOS necesita.
    location = /search {
        if ($http_x_lifeos_search_key != "REEMPLAZAR-CON-LA-CLAVE") {
            return 403;
        }
        # Sólo JSON. Servir el HTML convertiría esto en un buscador general
        # para cualquiera que tuviera la clave y un navegador.
        if ($arg_format != "json") {
            return 403;
        }
        proxy_pass http://searxng:8080/search;
        proxy_set_header Host $host;
        # La clave no viaja más allá de esta puerta.
        proxy_set_header X-LifeOS-Search-Key "";
        proxy_read_timeout 20s;
    }

    # Comprobación de vida, sin clave y sin tocar el buscador: sirve para saber
    # que la puerta está en pie sin abrir nada.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Todo lo demás no existe: ni la interfaz, ni /preferences, ni /stats.
    location / { return 404; }
}
