[project]
name = "lifeos-relay"
version = "0.1.0"
description = "Blind ciphertext store-and-forward relay for LifeOS device sync"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.34",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
