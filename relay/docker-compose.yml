# LifeOS blind relay — Coolify service definition.
#
# Everything lives in Coolify, nothing loose on the host: the relay's only
# state is one SQLite file in a managed volume, holding transient ciphertext
# that expires on its own.
#
# PUBLISHED, and routed by FILE rather than by a label here — see
# `ops/traefik/lifeos-relay.yaml`. Coolify regenerates per-container labels on
# every redeploy, so routing declared in this file would silently disappear; the
# proxy's dynamic directory is not regenerated and is watched live.
#
# It is reachable from the whole internet on purpose: a phone OFF the VPN is
# exactly who needs it. What protects it is not an IP filter but Ed25519
# signatures over the exact bytes of every request, claim-before-deposit,
# non-reusable nonces, per-mailbox size and count caps — and the fact that it
# only ever holds ciphertext it cannot read.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - lifeos-relay-data:/data
    environment:
      - RELAY_DB_PATH=/data/relay.db
    # Guardrails: the relay is a small, bounded service and should stay that
    # way. If it ever needs more than this, something is storing more than it
    # should.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lifeos-relay-data:
