# 4G, not 8G: the daemon does not die of a heap OOM (that would leave a
# dump), it is KILLED by the kernel — this machine has 23G shared with
# several always-on services, so a JVM allowed to grow to 8G loses the
# race whenever they are busy. The release build fits in 4G comfortably.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Two workers, not one per core: the release build shells out to several
# JVMs at once and their SUM is what makes this the largest thing in the
# user slice — which is precisely what user-mem-guard kills.
org.gradle.workers.max=2
