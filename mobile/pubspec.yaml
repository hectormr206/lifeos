name: lifeos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (design D2: Riverpod). Plain (non-codegen) Riverpod for
  # this foundation batch — see mobile/lib/core/api for the rationale.
  flutter_riverpod: ^3.0.0

  # HTTP client used by the generated API package below.
  dio: ^5.9.0

  # Generated Axi v1 API client (design D3): produced FROM
  # contracts/openapi/axi-v1.json by mobile/tool/gen-api.sh. Never hand-edit
  # files under packages/axi_api_client.
  axi_api_client:
    path: packages/axi_api_client
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0

  # On-device LLM (roadmap SLICE 1): runs gemma-4-E2B fully offline behind the
  # existing chat UI. Unified FlutterGemma.* API (v1.3.x), wrapped behind
  # LocalLlmEngine (features/local_model/domain) so the flow is unit-testable
  # with a fake and the flutter_gemma dependency stays at the edge.
  flutter_gemma: ^1.3.1

  # Inference engine for flutter_gemma (roadmap SLICE 1): flutter_gemma's core
  # registers NO engine by default — the `.litertlm` on-device runtime lives in
  # this companion package. It must be registered once via
  # `FlutterGemma.initialize(inferenceEngines: [LiteRtLmEngine()])` before any
  # install/getActiveModel/createChat, or those throw a StateError at runtime.
  # The native litert-lm library is fetched at build time (Native Assets,
  # hook/build.dart) — no manual Android/iOS wiring. Pinned exact: the native
  # ABI contract is version-coupled to this runtime. arm64-v8a only (see
  # android/app/build.gradle.kts abiFilters).
  flutter_gemma_litertlm: 1.1.0

  # The downloader flutter_gemma uses for the model fetch. Already resolved
  # transitively via flutter_gemma; made direct so we can, before each download:
  #   * request POST_NOTIFICATIONS (Android 13+ foreground-service notification),
  #   * reset() the 'smart_downloads' group to clear a stale/failed task record
  #     (the "Existing download failed: TaskStatus.failed" re-attach loop).
  background_downloader: ^9.5.6

  # Local-only persistence for the "use local model" toggle (roadmap SLICE 1).
  # Deliberately NOT flutter_secure_storage: this is a non-secret UI preference
  # that must survive with no engine connection / no pairing.
  shared_preferences: ^2.3.2

  # App support directory lookup for the offline read cache's file-backed
  # impl (M3 slice 1, core/cache/response_cache.dart's FileResponseCache).
  # Was already resolved transitively (via flutter_secure_storage); made
  # direct since we import it explicitly now.
  path_provider: ^2.1.6

  # SHA-256 for TLS cert-pinning fingerprint compare (design D5/D6 hardening,
  # core/tls/ca_fingerprint.dart). Was already resolved transitively; made
  # direct because we import it explicitly now.
  crypto: ^3.0.6

  # Markdown rendering for Axi's chat replies (spec mobile-chat: "MUST
  # support ... markdown rendering"). `flutter_markdown` (the official
  # package) is discontinued upstream; `flutter_markdown_plus` is its
  # actively-maintained drop-in continuation (same API, same widgets).
  flutter_markdown_plus: ^1.0.12
  permission_handler: ^12.0.3

  # Self-hosted OTA app-update (this slice). The app is sideloaded (no Play
  # Store), so it self-updates from the paired engine's /api/app endpoints.
  #   * package_info_plus: the running build's versionCode (buildNumber) +
  #     versionName, compared against the engine manifest to detect updates.
  #   * flutter_local_notifications: the app had NO local-notification
  #     mechanism; this posts "Nueva versión disponible" when an update is
  #     found (POST_NOTIFICATIONS is already declared + requested for the
  #     model download; reused here).
  #   * open_filex: hands the downloaded APK to the Android package installer
  #     (ACTION_VIEW on a FileProvider content:// URI) — the user taps
  #     "Instalar" on the system dialog (unavoidable for a sideloaded app).
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.1.0
  open_filex: ^4.7.0
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
