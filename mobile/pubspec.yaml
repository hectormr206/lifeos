name: lifeos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# EL NOMBRE DE VERSIÓN HAY QUE MOVERLO A MANO, y hay que acordarse.
#
# 0.9.19 se quedó congelado desde el 25 de julio de 2026 mientras el
# versionCode subía de ~700 a 887: casi un mes y decenas de mejoras bajo el
# mismo nombre. Dos personas diciendo "tengo la 0.9.19" podían tener apps
# completamente distintas, y eso hace inútil lo único que la gente cita cuando
# reporta un problema.
#
# El versionCode (el +N) NO se toca aquí: sale del número de commits, lo pone
# `--build-number` en publish-to-vps.sh, y por eso sí se mueve solo.
#
# Criterio: sube el MINOR (0.10 -> 0.11) en cada tanda con funciones nuevas o
# cambios visibles; el PATCH para correcciones sueltas.
version: 0.14.1+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Internationalization (i18n slice). `flutter_localizations` supplies the
  # Material/Cupertino/Widgets localizations for every supported locale; `intl`
  # backs the generated `AppLocalizations` (gen-l10n) and locale-aware
  # date/time formatting used in Axi's prompt context. Adding a new language is
  # then just one more ARB file under lib/l10n/ (see l10n.yaml).
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (design D2: Riverpod). Plain (non-codegen) Riverpod for
  # this foundation batch — see mobile/lib/core/api for the rationale.
  flutter_riverpod: ^3.0.0

  # HTTP client used by the generated API package below.
  dio: ^5.9.0

  # Generated Axi v1 API client (design D3): produced FROM
  # contracts/openapi/axi-v1.json by mobile/tool/gen-api.sh. Never hand-edit
  # files under packages/axi_api_client.
  axi_api_client:
    path: packages/axi_api_client
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0

  # On-device LLM (roadmap SLICE 1): runs gemma-4-E2B fully offline behind the
  # existing chat UI. Unified FlutterGemma.* API (v1.3.x), wrapped behind
  # LocalLlmEngine (features/local_model/domain) so the flow is unit-testable
  # with a fake and the flutter_gemma dependency stays at the edge.
  flutter_gemma: ^1.3.1

  # Inference engine for flutter_gemma (roadmap SLICE 1): flutter_gemma's core
  # registers NO engine by default — the `.litertlm` on-device runtime lives in
  # this companion package. It must be registered once via
  # `FlutterGemma.initialize(inferenceEngines: [LiteRtLmEngine()])` before any
  # install/getActiveModel/createChat, or those throw a StateError at runtime.
  # The native litert-lm library is fetched at build time (Native Assets,
  # hook/build.dart) — no manual Android/iOS wiring. Pinned exact: the native
  # ABI contract is version-coupled to this runtime. arm64-v8a only (see
  # android/app/build.gradle.kts abiFilters).
  flutter_gemma_litertlm: 1.1.0

  # Embedding backend for flutter_gemma (roadmap SLICE B1b): core registers NO
  # embedding backend by default — the LiteRT C-API runtime that actually runs
  # EmbeddingGemma-300M (.tflite) lives in this companion package. It must be
  # registered once via
  # `FlutterGemma.initialize(embeddingBackends: [LiteRtEmbeddingBackend()])`
  # before any installEmbedder/getActiveEmbedder, or those throw a StateError.
  # Native LiteRT library fetched at build time (Native Assets, hook/build.dart),
  # same as flutter_gemma_litertlm. Pinned exact for the same ABI-coupling
  # reason. arm64-v8a only on Android.
  flutter_gemma_embeddings: 1.0.2

  # The downloader flutter_gemma uses for the model fetch. Already resolved
  # transitively via flutter_gemma; made direct so we can, before each download:
  #   * request POST_NOTIFICATIONS (Android 13+ foreground-service notification),
  #   * reset() the 'smart_downloads' group to clear a stale/failed task record
  #     (the "Existing download failed: TaskStatus.failed" re-attach loop).
  background_downloader: ^9.5.6

  # Local-only persistence for the "use local model" toggle (roadmap SLICE 1).
  # Deliberately NOT flutter_secure_storage: this is a non-secret UI preference
  # that must survive with no engine connection / no pairing.
  shared_preferences: ^2.3.2

  # App support directory lookup for the offline read cache's file-backed
  # impl (M3 slice 1, core/cache/response_cache.dart's FileResponseCache).
  # Was already resolved transitively (via flutter_secure_storage); made
  # direct since we import it explicitly now.
  path_provider: ^2.1.6

  # SHA-256 for TLS cert-pinning fingerprint compare (design D5/D6 hardening,
  # core/tls/ca_fingerprint.dart). Was already resolved transitively; made
  # direct because we import it explicitly now.
  crypto: ^3.0.6
  # AES-256-GCM for file-backed user data that cannot live in the SQLCipher
  # graph database (offline cache/outbox and recorded voice notes). The key is
  # kept separately in Android Keystore / iOS Keychain via flutter_secure_storage.
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # Markdown rendering for Axi's chat replies (spec mobile-chat: "MUST
  # support ... markdown rendering"). `flutter_markdown` (the official
  # package) is discontinued upstream; `flutter_markdown_plus` is its
  # actively-maintained drop-in continuation (same API, same widgets).
  flutter_markdown_plus: ^1.0.12
  permission_handler: ^12.0.3

  # Self-hosted OTA app-update (this slice). The app is sideloaded (no Play
  # Store), so it self-updates from the paired engine's /api/app endpoints.
  #   * package_info_plus: the running build's versionCode (buildNumber) +
  #     versionName, compared against the engine manifest to detect updates.
  #   * flutter_local_notifications: the app had NO local-notification
  #     mechanism; this posts "Nueva versión disponible" when an update is
  #     found (POST_NOTIFICATIONS is already declared + requested for the
  #     model download; reused here).
  #   * open_filex: hands the downloaded APK to the Android package installer
  #     (ACTION_VIEW on a FileProvider content:// URI) — the user taps
  #     "Instalar" on the system dialog (unavoidable for a sideloaded app).
  package_info_plus: ^10.2.1
  # Opens the LifeOS landing page (https://lifeos.hectormr.com) from the
  # "Acerca de" card in an external browser (LaunchMode.externalApplication).
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.1.0
  # LOCAL reminders (roadmap slice C2): `zonedSchedule` takes a
  # `tz.TZDateTime`, so the app must import `package:timezone` directly.
  # It was ALREADY in the dependency tree (transitive of
  # flutter_local_notifications, pinned 0.11.1 in the lock) — this line only
  # promotes it to a direct dependency; no new package is resolved.
  timezone: ^0.11.1
  # Device IANA zone detection (timezone slice): returns the device's IANA zone
  # id (e.g. "America/Mexico_City") so the effective-timezone resolver can, in
  # AUTOMATIC mode, follow the phone's zone. The `timezone` package above turns
  # that id into a DST-aware `tz.Location`; this package only reports the id.
  flutter_timezone: ^4.1.1
  open_filex: ^4.7.0
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1

  # On-device encrypted graph store (roadmap SLICE A2): the local
  # property-graph (nodes + edges) that backs memory, RAG, domains, the graph
  # browser, and future sync. Ported from axi/src/axi/store.py's SQLCipher
  # property-graph. sqflite_sqlcipher (not plain sqflite) so the DB file is
  # AES-256 encrypted at rest with a per-install key held in
  # flutter_secure_storage. Raw-SQL surface mirrors store.py 1:1; host unit
  # tests run on the standard sqlite backend via sqflite_common_ffi (dev dep).
  #
  # MOBILE ONLY. sqflite_sqlcipher 3.4.0 ships `android ios macos` and there is
  # no federated `_linux`/`_windows` implementation, so on desktop it can only
  # throw MissingPluginException. Desktop is served by the FFI backend below;
  # see core/graph/graph_database_backend.dart for the split.
  sqflite_sqlcipher: ^3.1.0

  # DESKTOP (Linux, and Windows when its runner lands) half of the same
  # encrypted graph DB. `sqflite_common_ffi` drives `package:sqlite3` over
  # dart:ffi, exposing the IDENTICAL sqflite `Database` API — which is what
  # lets `local_graph_migrations.dart` be REUSED rather than duplicated for
  # desktop. It was a dev dependency (host tests only); it is now a real one
  # because the Linux desktop build depends on it at runtime.
  #
  # The encryption itself comes from the `hooks:` block at the bottom of this
  # file, which makes `package:sqlite3` bundle a SQLCipher build instead of
  # stock SQLite. Without that block `PRAGMA key` is a SILENT NO-OP and the
  # graph would be written in plaintext — `SqlCipherFfiGraphBackend` therefore
  # verifies `PRAGMA cipher_version` on every open and refuses to hand back a
  # handle if the cipher is missing.
  sqflite_common_ffi: ^2.3.3

  # The shared `Database`/`OpenDatabaseOptions` types that BOTH backends above
  # speak. Already in the tree transitively via each of them; declared directly
  # because `core/graph/graph_database_backend.dart` imports it to describe the
  # backend seam without depending on either concrete implementation.
  sqflite_common: ^2.5.5

  # RFC-4122 v4 UUIDs for the graph store's sync-forward `uuid` primary sync
  # id (roadmap SLICE A2 / PRD D1). Every node/edge gets a globally-unique id
  # at creation so later sync can merge two devices' graphs without an id
  # rewrite. Already resolved transitively; made direct because we mint them.
  uuid: ^4.5.3

  # On-device speech-to-text (roadmap slice B2): transcribes a recorded voice
  # note fully offline with a Whisper base int8 multilingual model (ES+EN) via
  # next-gen-Kaldi's sherpa-onnx runtime. The `sherpa_onnx` meta-package pulls
  # the per-ABI native runtimes transitively (sherpa_onnx_android_arm64 +
  # armeabi/x86/x86_64, plus ios/macos/linux/windows); only arm64-v8a is
  # actually packaged into the APK (android/app/build.gradle.kts abiFilters).
  # Wrapped behind SpeechToText (features/stt/domain) so the flow is
  # unit-testable with a fake and the plugin stays at the edge. The ~80MB model
  # itself is NOT bundled — it is downloaded on first use (see
  # features/stt/data/stt_model_source_config.dart, kSttModelBaseUrl).
  sherpa_onnx: ^1.13.4

  # "Axi habla" (speak-aloud): reads an assistant reply out loud using the
  # device's built-in OS text-to-speech voices. This is the INTERIM engine —
  # it lives behind TextToSpeechGateway (features/chat/domain) so a future
  # slice can swap system TTS for a higher-quality on-device engine (Piper)
  # without touching the UI. Configured for Spanish (es-MX → es-ES → es).
  flutter_tts: ^4.2.5

  # Optional biometric app lock (fingerprint / face). All of the user's
  # health/life data lives on-device, so app entry (cold start + resume from
  # background) can be gated behind a device biometric — with the OS
  # device-credential (PIN/pattern) as the automatic fallback. Opt-in,
  # default OFF. Wrapped behind BiometricAuthenticator (features/security)
  # so the flow is unit-testable with a fake and the plugin stays at the edge.
  # NOTE: local_auth requires the host Activity to extend FlutterFragmentActivity
  # (see android/.../MainActivity.kt) and the USE_BIOMETRIC permission
  # (AndroidManifest.xml). Purely on-device: no network.
  local_auth: ^3.0.2
  # REAL background generation for the "Boletín automático" ("Segundo plano",
  # user opt-in): a WorkManager one-off task fires at the scheduled hour with
  # the app closed and runs the whole briefing pipeline headless — fetch +
  # assemble + on-device translation when the ~2.6GB model file is already on
  # disk (never downloads in background). Wrapped behind BriefingBackgroundWork
  # (features/morning_briefing/domain) so tests inject a fake; the callback
  # dispatcher lives in core/background/background_tasks.dart. No extra Android
  # manifest work needed for one-off tasks on 0.9.x.
  workmanager: ^0.9.0+3

  # DESKTOP SYSTEM TRAY (desktop-shell slice). An icon in the top bar that says
  # "LifeOS is alive", with a menu to bring the window back and to really quit.
  #
  #   * tray_manager   — the icon + its context menu.
  #   * window_manager — show/focus/hide the window, and `setPreventClose`, which
  #                      is what turns the window's close button into "hide to
  #                      tray" instead of "kill the app".
  #
  # BOTH declare exactly `linux macos windows` in their own
  # `flutter.plugin.platforms`. There is NO android/ios implementation to
  # register: no Gradle subproject, no manifest merge, no entry in the Android
  # GeneratedPluginRegistrant. That is asserted for real — against the plugin
  # map the Flutter tool itself generates — in
  # test/core/tray/tray_plugin_isolation_test.dart, so a future upstream
  # version that DID ship an Android implementation turns that test red before
  # it can reach the phone.
  #
  # Windows/macOS runners do not exist in this repo yet; the tray code is
  # written against the OS name (core/tray/tray_platform.dart) so adding one is
  # `flutter create --platforms=windows` and not a rewrite.
  #
  # Linux runtime requirement: the icon is drawn by the desktop environment's
  # StatusNotifier/AppIndicator host, which needs libayatana-appindicator3 —
  # probed by tools/install-linux.sh alongside gtk3/gstreamer/libsecret. A
  # session with no tray host at all (some Wayland compositors) cannot be fixed
  # by a package, so the app SAYS the tray is unavailable rather than pretending
  # it worked (core/tray/tray_service.dart).
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  hotkey_manager: ^0.2.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Test-only: mock the url_launcher platform channel (the "Acerca de" landing
  # link) without a real browser. Both are already in the tree transitively via
  # url_launcher; declared here so the test import is a direct dependency.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

  # Test-only: point `getApplicationSupportDirectory()` at a temp directory so
  # `LocalGraphDatabase.open()` can be driven end-to-end on the host VM without
  # a device. Already in the tree transitively via path_provider; declared here
  # because the test imports it directly.
  path_provider_platform_interface: ^2.1.2

  # NOTE: sqflite_common_ffi moved UP into real dependencies — the Linux
  # desktop build now needs it at runtime, not only the host tests. Host tests
  # keep using it exactly as before.

  # Generates the Android launcher icons (all mipmap densities + adaptive
  # icon) from the Axi axolotl mark. App-shell slice. Run with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# App-shell slice: Android launcher icon generated from the Axi mark. The
# adaptive foreground uses the maskable variant (safe-zone padded) over a
# clean white background; the legacy/monochrome icon uses the full mark.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/axi-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/axi-512-maskable.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # i18n slice: turns on Flutter's gen-l10n codegen. Running `flutter pub get`
  # (or `flutter gen-l10n`) reads l10n.yaml + lib/l10n/*.arb and generates the
  # `AppLocalizations` delegate consumed by MaterialApp.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # App-shell slice: the Axi mark, shown in Settings > Acerca de.
  assets:
    - assets/branding/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ── Encryption at rest on DESKTOP (roadmap SLICE A2, Linux desktop) ─────────
#
# `package:sqlite3` 3.x bundles a copy of SQLite with the app through Dart
# build hooks. By default that copy is STOCK SQLite, in which `PRAGMA key` is
# silently ignored — an encrypted-looking open that writes plaintext. This
# user-define switches the bundled library to the SQLCipher community build
# (SQLCipher 4.17.0 as of sqlite3 3.5.0), which is what makes the desktop graph
# DB genuinely AES-256 encrypted with the per-install key from the OS keystore.
#
# DO NOT REMOVE. `SqlCipherFfiGraphBackend` fails the open loudly rather than
# degrading to plaintext if this is missing, so deleting it does not silently
# leak data — it makes the desktop app unable to open its database at all.
#
# On-disk compatibility with the mobile path: sqflite_sqlcipher pins SQLCipher
# 4.10.0 on Android (net.zetetic:sqlcipher-android) and iOS/macOS (SQLCipher
# pod). Both are SQLCipher 4.x, which share the same defaults (PBKDF2-HMAC-
# SHA512 / 256 000 iterations, HMAC-SHA512, 4096-byte pages), so the same file
# is readable on either side. Bumping a MAJOR SQLCipher version on one side
# only would break that — see graph_database_backend.dart.
#
# The `sqlite3` code asset is built for every target, so Android/iOS release
# builds also carry this library even though they use sqflite_sqlcipher's own
# native SQLCipher.
#
# IT IS NOT INERT ON ANDROID, WHICH IS WHAT THIS COMMENT USED TO CLAIM.
# The asset is named `libsqlcipher.so` — the SAME name as the JNI build inside
# net.zetetic:sqlcipher-android — so packaging merged them by name and the FFI
# one won. Every native method of net.zetetic.database.sqlcipher.SQLiteConnection
# was then unbound and the app died opening its encrypted database before the
# first frame, with UnsatisfiedLinkError. It shipped to a real phone twice.
# android/app/build.gradle.kts now drops the code asset from the Android
# staging dir; see the comment there for why that, and not a packaging rule.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
