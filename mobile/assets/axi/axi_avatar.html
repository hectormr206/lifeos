<!DOCTYPE html>
<!--
  Axi living avatar — mobile port of the laptop dashboard's animated body
  (axi/src/axi/templates/dashboard.html, section "Axi living avatar").

  The SVG, its organ groups and every CSS keyframe are copied VERBATIM from
  the laptop so the body is pixel-faithful. What changed for mobile:
    * Alpine.js bindings removed — this page has zero dependencies (offline).
    * Live vitals (breath/pulse durations, tired face, sonar, game glow) are
      replaced by the calm healthy defaults the laptop uses as CSS fallbacks.
    * Organ clicks post the organ key to Flutter through the `Axi`
      JavaScript channel; Flutter owns the organ -> action map.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    height: 100%; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #stage { display: flex; align-items: center; justify-content: center; height: 100%; }
  /* ── Animations: identical keyframes/durations to the laptop dashboard ── */
  @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(0.1)} }
  @keyframes gillFloat { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  @keyframes heartbeat { 0%,18%,30%,100%{transform:scale(1)} 9%{transform:scale(1.18)} 24%{transform:scale(1.12)} }
  @keyframes tailWag { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(7deg)} }
  #axi-avatar .eye   { animation: blink 5.5s ease-in-out infinite; cursor:pointer; }
  #axi-avatar .ears  { animation: gillFloat 4s ease-in-out infinite; transform-origin: 32px 40px; cursor:pointer; }
  #axi-avatar .heart { animation: heartbeat 2s ease-in-out infinite; transform-origin: 33.5px 56px; cursor:pointer; }
  #axi-avatar .tail  { animation: tailWag 4.5s ease-in-out infinite; transform-origin: 41px 59px; }
  #axi-avatar .clk   { cursor:pointer; }
  #axi-avatar #organ-mind { cursor:pointer; }
  #axi-avatar .mind-spark { transform-box: fill-box; transform-origin: center; }
  #axi-avatar #organ-mind .mind-aura  { animation: mindPulse 2.6s ease-in-out infinite; }
  #axi-avatar #organ-mind .mind-spark { animation: mindSpark 2s ease-in-out infinite; }
  @keyframes mindPulse { 0%,100%{opacity:.22} 50%{opacity:.5} }
  @keyframes mindSpark { 0%,100%{opacity:.35;transform:translateY(0) scale(.85)} 50%{opacity:1;transform:translateY(-1px) scale(1.1)} }
  @media (prefers-reduced-motion: reduce){ #axi-avatar * { animation:none !important; } }
</style>
</head>
<body>
<div id="stage">
<svg id="axi-avatar" viewBox="0 0 64 80" width="220" height="275"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Axi — agente vivo"
     style="overflow:visible">
  <defs>
    <g id="axi-gill">
      <ellipse cx="0" cy="-8.5" rx="3.8" ry="10.6" fill="#fe8faf" stroke="#241019" stroke-width="0.9"/>
      <path d="M0 -16.2 Q-3.2 -12 -2.6 -7.2 Q0 -8.6 2.6 -7.2 Q3.2 -12 0 -16.2 Z" fill="#00D4AA" stroke="#241019" stroke-width="0.42" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Orejas / branquias superiores = Oído -->
  <g id="organ-ears" class="ears" onclick="tap(event,'ears')">
    <title>Oídos (escuchar)</title>
    <use href="#axi-gill" transform="translate(23,32) rotate(-56) scale(0.94)"/>
    <use href="#axi-gill" transform="translate(20,37) rotate(-79) scale(0.95)"/>
    <use href="#axi-gill" transform="translate(41,32) rotate(56) scale(0.94)"/>
    <use href="#axi-gill" transform="translate(44,37) rotate(79) scale(0.95)"/>
  </g>

  <!-- Branquias inferiores = Pulmones -->
  <g id="organ-lungs" class="ears" onclick="tap(event,'lungs')">
    <title>Pulmones (signos vitales)</title>
    <use href="#axi-gill" transform="translate(22,43) rotate(-95) scale(0.9)"/>
    <use href="#axi-gill" transform="translate(42,43) rotate(95) scale(0.9)"/>
  </g>

  <!-- Cola (se menea) -->
  <g class="tail">
    <path d="M40 57 Q52 54 57 63 Q52 70 45 65 Q41 62 40 57 Z" fill="#fe8faf" stroke="#241019" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M44 58 Q50 58 55 63" stroke="#241019" stroke-width="0.45" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M44 62 Q49 64 55 63" stroke="#241019" stroke-width="0.45" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Manos = actuar -->
  <g id="organ-hands" class="clk" onclick="tap(event,'hands')">
    <title>Manos (actuar)</title>
    <ellipse cx="21" cy="53" rx="3" ry="4.3" fill="#fe8faf" stroke="#241019" stroke-width="0.9" transform="rotate(32 22 53)"/>
    <ellipse cx="43" cy="53" rx="3" ry="4.3" fill="#fe8faf" stroke="#241019" stroke-width="0.9" transform="rotate(-32 42 53)"/>
  </g>

  <!-- Pies = conciencia de red -->
  <g id="organ-feet" class="clk" onclick="tap(event,'feet')">
    <title>Pies (red y ubicación)</title>
    <ellipse cx="25.5" cy="67.5" rx="3.8" ry="3.3" fill="#fe8faf" stroke="#241019" stroke-width="0.9"/>
    <ellipse cx="38.5" cy="67.5" rx="3.8" ry="3.3" fill="#fe8faf" stroke="#241019" stroke-width="0.9"/>
  </g>

  <!-- Sistema inmune = contorno tenue alrededor del cuerpo -->
  <ellipse id="organ-immune" class="clk"
           cx="32" cy="57" rx="14.5" ry="14"
           fill="none" stroke="#00D4AA" stroke-width="1.4"
           stroke-dasharray="2.2 2.6" opacity="0.35"
           style="pointer-events:stroke"
           onclick="tap(event,'immune')">
    <title>Sistema inmune (prevención)</title>
  </ellipse>

  <!-- Cuerpo -->
  <ellipse cx="32" cy="57" rx="12.5" ry="12" fill="#fe8faf" stroke="#241019" stroke-width="0.9"/>

  <!-- Memoria = la pancita-núcleo; anillos = capas de recuerdos -->
  <g id="organ-memory" class="clk" onclick="tap(event,'memory')">
    <title>Memoria (lo que Axi recuerda)</title>
    <ellipse cx="32" cy="59" rx="7.6" ry="7.8" fill="#FFC2D6" opacity="0.7"/>
    <ellipse cx="32" cy="59" rx="5.4" ry="5.6" fill="none" stroke="#FF6B9D" stroke-width="0.4" opacity="0.3"/>
    <ellipse cx="32" cy="59" rx="3.3" ry="3.5" fill="none" stroke="#FF6B9D" stroke-width="0.4" opacity="0.35"/>
  </g>

  <!-- Cara -->
  <ellipse cx="32" cy="38" rx="15.5" ry="13.5" fill="#fe8faf" stroke="#241019" stroke-width="0.9"/>

  <!-- Cerebro = el modelo que razona; clic = Cerebro 3D -->
  <g id="organ-brain" class="clk" onclick="tap(event,'brain')">
    <title>Cerebro (el modelo que razona)</title>
    <ellipse cx="32" cy="30.5" rx="7" ry="3.8" fill="#000000" fill-opacity="0"/>
    <ellipse cx="32" cy="30.3" rx="2.7" ry="2" fill="#FFC2D6" stroke="#D94F86" stroke-width="0.35"/>
    <path d="M29.8 30.3 Q31 29.4 32 30.3 Q33 31.2 34.2 30.3" fill="none" stroke="#D94F86" stroke-width="0.35" stroke-linecap="round" opacity="0.85"/>
    <path d="M32 28.5 L32 32.1" stroke="#D94F86" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- Chapitas -->
  <circle cx="21.5" cy="42" r="2.2" fill="#FF4D88" opacity="0.5"/>
  <circle cx="42.5" cy="42" r="2.2" fill="#FF4D88" opacity="0.5"/>

  <!-- Ojos = visión -->
  <g id="eye-screen" class="eye" onclick="tap(event,'eyes')" style="transform-origin:26px 38px">
    <title>Ojo (visión)</title>
    <circle cx="26" cy="38" r="2.6" fill="#14131F"/>
    <circle cx="26.9" cy="37.2" r="0.9" fill="#FFFFFF"/>
  </g>
  <g id="eye-webcam" class="eye" onclick="tap(event,'eyes')" style="transform-origin:38px 38px">
    <title>Ojo (visión)</title>
    <circle cx="38" cy="38" r="2.6" fill="#14131F"/>
    <circle cx="38.9" cy="37.2" r="0.9" fill="#FFFFFF"/>
  </g>

  <!-- Naricita = Olfato -->
  <g id="organ-smell" class="clk" onclick="tap(event,'smell')">
    <title>Olfato (detector de anomalías)</title>
    <ellipse cx="32" cy="41" rx="2.6" ry="1.6" fill="#000000" fill-opacity="0"/>
    <circle cx="31.1" cy="41" r="0.42" fill="#14131F" opacity="0.55"/>
    <circle cx="32.9" cy="41" r="0.42" fill="#14131F" opacity="0.55"/>
  </g>

  <!-- Boca = hablar con Axi -->
  <g id="organ-mouth" class="clk" onclick="tap(event,'mouth')">
    <title>Boca (hablar con Axi)</title>
    <path id="mouth-smile" d="M26 43 Q32 48 38 43" stroke="#14131F" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Corazón = latido vital -->
  <g id="organ-heart" class="heart" onclick="tap(event,'heart')">
    <title>Corazón (latido vital)</title>
    <circle cx="32.2" cy="55" r="1.45" fill="#FF4D88"/>
    <circle cx="34.8" cy="55" r="1.45" fill="#FF4D88"/>
    <path d="M30.85 55.6 Q33.5 60.5 36.15 55.6" fill="#FF4D88"/>
  </g>

  <!-- Mente autónoma — aura teal + chispitas de pensamiento -->
  <g id="organ-mind" onclick="tap(event,'mind')">
    <title>Mente autónoma</title>
    <ellipse cx="32" cy="16" rx="13" ry="9" fill="#ffffff" fill-opacity="0"/>
    <ellipse class="mind-aura" cx="32" cy="19" rx="11" ry="4.5" fill="#00D4AA" opacity="0.4" style="filter:blur(2.5px)"/>
    <circle class="mind-spark" cx="25" cy="16" r="1.1" fill="#7FF0E0"/>
    <circle class="mind-spark" cx="32" cy="12.5" r="1.5" fill="#00D4AA"/>
    <circle class="mind-spark" cx="39" cy="16" r="1.1" fill="#7FF0E0"/>
  </g>
</svg>
</div>
<script>
  // Post the organ key to Flutter. stopPropagation keeps overlapping organ
  // groups (immune ring over memory/heart, etc.) from double-firing.
  function tap(ev, key) {
    ev.stopPropagation();
    if (window.Axi && window.Axi.postMessage) window.Axi.postMessage(key);
  }
</script>
</body>
</html>
